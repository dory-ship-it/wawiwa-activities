CustomerID too, as a Foreign Key. Ask for the orders of one customer and you follow the key:', c: 'select h.SalesOrderID, h.OrderDate, h.TotalDue\\nfrom Sales.SalesOrderHeader h\\nwhere h.CustomerID = 29825;' },\n      { l: 'Compare it to something I know', t: 'A schema is the folder, the table is the file, the Primary Key is the file name that cannot repeat inside the folder, and a Foreign Key is a shortcut in another folder pointing at that file. Delete the file and the shortcut breaks, which is exactly why a Foreign Key must contain a value that exists in the other table.' },\n      { l: 'Show it another way', t: 'Read the ERD out loud, one connector at a time: \"one Customers row, many Order Details rows\". Where the line meets 1:1 you are looking at a Primary Key. Where it meets 1:N you are looking at a Foreign Key. Every join you will ever write follows one of those lines.' }\n    ],\n    [\n      { l: 'Explain it simply', t: 'A retrieval query is one sentence with four parts. select says which columns you want, from says which table they live in, where throws away the rows you do not want, and order by decides the order they come back in. Everything else in this topic is a refinement of those four.' },\n      { l: 'Give me an example', t: 'Black products over 1000, with a 10 percent discount shown beside the list price, cheapest first:', c: \"select Name, ListPrice, ListPrice * 0.9 as SalePrice\\nfrom Production.Product\\nwhere Color = 'Black' and ListPrice > 1000\\norder by SalePrice;\" },\n      { l: 'Compare it to something I know', t: 'Compared with a spreadsheet: select is hiding columns, where is a filter on the rows, a calculated column is a formula in a new column, an alias is renaming that column header, and order by is the sort button. The difference is that SQL never writes any of it back into the sheet.' },\n      { l: 'Show it another way', t: 'Read the query backwards to sanity check it. Which table? Which rows survive? Which columns do I show? In what order? If you can answer those four in one breath, the query is correct.' }\n    ],\n    [\n      { l: 'Explain it simply', t: 'Grouping is a sub-total. You tell SQL which column defines a group, it puts the records with the same value into one bucket, and an aggregate function turns each bucket into a single number. What comes back is one row per bucket, not the original records.' },\n      { l: 'Give me an example', t: 'Revenue per year, keeping only the years above one million:', c: 'select year(OrderDate) as OrderYear, sum(TotalDue) as Revenue\\nfrom Sales.SalesOrderHeader\\ngroup by year(OrderDate)\\nhaving sum(TotalDue) > 1000000\\norder by OrderYear;' },\n      { l: 'Compare it to something I know', t: 'It is the pivot table you already know. group by is the row field, the aggregate is the value field, where is the filter applied to the source data, and having is the filter applied to the pivot output. Nobody filters a pivot total before the pivot exists, and SQL is no different.' },\n      { l: 'Show it another way', t: 'Say the query as a sentence: \"For each year, add up TotalDue, but only online orders, and only show me the years above a million, sorted by year.\" Each clause of that sentence is one line of SQL, in exactly that order.' }\n    ],\n    [\n      { l: 'Explain it simply', t: 'This topic is about being precise. distinct removes repeats, top cuts the list short, in checks a set of values, between checks a range, like matches a text pattern, and is null checks for emptiness. Each one replaces a long chain of or conditions with a single readable line.' },\n      { l: 'Give me an example', t: 'The ten most expensive products between 100 and 500 whose name begins with Road:', c: \"select distinct top 10 Name, ListPrice\\nfrom Production.Product\\nwhere ListPrice between 100 and 500\\n  and Name like 'Road%'\\norder by ListPrice desc;\" },\n      { l: 'Compare it to something I know', t: 'like is the spreadsheet search box with two extra powers: % is \"anything, any length\" and _ is \"exactly one character\". The bracket forms go further still: [oa] is a small menu of allowed characters, [^oa] is the same menu forbidden.' },\n      { l: 'Show it another way', t: 'The NULL rule in one line: NULL is not a value, it is the absence of one, so every comparison with it returns unknown rather than true or false. That is why the language gives you a separate test, is null, instead of letting you use equals.' }\n    ],\n    [\n      { l: 'Explain it simply', t: 'A join puts two tables side by side by matching a field they share. The only real decision is what to do with the rows that have no partner: inner throws them away, left keeps everything on the left, right keeps everything on the right, full outer keeps both and fills the gaps with NULL.' },\n      { l: 'Give me an example', t: 'Every customer with their order count, including those who never ordered:', c: 'select c.CustomerID, count(h.SalesOrderID) as Orders\\nfrom Sales.Customer c\\n  left join Sales.SalesOrderHeader h on h.CustomerID = c.CustomerID\\ngroup by c.CustomerID;' },\n      { l: 'Compare it to something I know', t: 'A join is a lookup that may return several matches, so the result can be longer than either input. A union is copy and paste of one list under another, which is why the two lists must have the same number of columns.' },\n      { l: 'Show it another way', t: 'Draw the two circles before writing the query. Shade the part you actually want, then name it: overlap only is inner, whole left circle is left, whole right circle is right, both circles is full outer. Then write the join that matches your drawing.' }\n    ],\n    [\n      { l: 'Explain it simply', t: 'Functions do the work inside the query. Aggregate functions squeeze many rows into one value. Number, string and date functions transform one value into another value, row by row. Window functions sit in between: they calculate over a group of rows but still answer for every single row.' },\n      { l: 'Give me an example', t: 'Each order with the quarter it falls in and the running total for that customer:', c: 'select SalesOrderID, CustomerID, TotalDue,\\n  datepart(quarter, OrderDate) as Qtr,\\n  sum(TotalDue) over (partition by CustomerID order by OrderDate) as RunningTotal\\nfrom Sales.SalesOrderHeader;' },\n      { l: 'Compare it to something I know', t: 'group by is the pivot table, a window function is the extra column you add next to your raw data with a formula that looks at a range. The raw rows are all still there, each one now carrying the group answer beside it.' },\n      { l: 'Show it another way', t: 'Read an over clause in two questions. partition by: which rows belong in my window? order by: in what order are they read? Add order by and sum becomes a running total; leave it out and sum is the flat total for the whole partition.' }\n    ],\n    [\n      { l: 'Explain it simply', t: 'Sometimes the answer to your question needs another answer first. A subquery is that first query, in brackets, run before the outer one. A CTE is the same idea with a name in front, written above the main query instead of buried inside it.' },\n      { l: 'Give me an example', t: 'Customers whose spend is above the average, first nested, then named:', c: 'with CustomerSpend as (\\n  select CustomerID, sum(TotalDue) as Total\\n  from Sales.SalesOrderHeader\\n  group by CustomerID\\n)\\nselect * from CustomerSpend\\nwhere Total > (select avg(Total) from CustomerSpend);' },\n      { l: 'Compare it to something I know', t: 'A subquery is a formula nested inside another formula. A CTE is naming that intermediate result in its own cell first, then referring to the name. Both give the same number, but only one of them can be read six months later.' },\n      { l: 'Show it another way', t: 'Choose by the shape of what comes back. One value goes next to = or >. One column goes next to in. Several columns go into the from clause with an alias. And if you need it twice, or the nesting is three deep, stop nesting and name it as a CTE.' }\n    ]\n  ];\n\n  PRACTICE = [\n    [{ q: 'Name the four building blocks of a table and say what each one is.', a: 'Field is a column, record is a row, Primary Key uniquely identifies a record and may be a combination of fields, Foreign Key is a field pointing at the Primary Key of another table.' },\n     { q: 'In the retail ERD, which table would you add a Foreign Key to if branches belonged to regions?', a: 'To Branches. The many side carries the key, so Branches would gain a RegionID pointing at the Primary Key of a Regions table.' },\n     { q: 'Write the full reference for the Product table in the Production schema.', a: 'Production.Product. Schema first, then a dot, then the table name.' }],\n    [{ q: 'Write a query returning the name and profit of every product, cheapest profit first.', a: 'select Name, ListPrice - StandardCost as Profit from Production.Product order by Profit;' },\n     { q: 'Which rows survive where Color = \\u2018Red\\u2019 or ListPrice > 2000 and Size = \\u2018L\\u2019?', a: 'and binds tighter than or, so it reads: red products, plus any product over 2000 that is also size L. Brackets remove the doubt.' },\n     { q: 'Why can you order by an alias but not filter on it in where?', a: 'The engine runs where before select, so the alias does not exist yet. order by runs after select, when the alias is already defined.' }],\n    [{ q: 'Write a query showing the number of products per colour, busiest colour first.', a: 'select Color, count(*) as Products from Production.Product group by Color order by Products desc;' },\n     { q: 'A colleague writes where sum(TotalDue) > 1000. What will happen and how do you fix it?', a: 'SQL Server rejects it because where runs before grouping. Move the condition into a having clause after group by.' },\n     { q: 'When would count(*) and count(ColumnName) return the same number?', a: 'When the column contains no NULL values at all, since count(column) only skips NULLs.' }],\n    [{ q: 'Write a filter for products whose name starts with a B or an R.', a: \"where Name like '[BR]%'  -- the bracket form lists the allowed first characters\" },\n     { q: 'Find all orders placed in 2013 using between.', a: \"where OrderDate between '2013-01-01' and '2013-12-31'  -- both ends included\" },\n     { q: 'How do you count the products with no colour recorded?', a: 'select count(*) from Production.Product where Color is null; -- never = NULL' }],\n    [{ q: 'Which join do you use to find orders whose customer no longer exists?', a: 'A right join from Customers to Orders (or a left join written the other way round), then where the customer columns are null.' },\n     { q: 'Two lists of cities, and you want every city once. Which combiner?', a: 'union. Use union all only when you want to keep the duplicates, for example to count occurrences.' },\n     { q: 'Rewrite the price bands so Premium is not swallowed by Standard.', a: \"Put the narrowest test first: case when ListPrice > 1000 then 'Premium' when ListPrice > 100 then 'Standard' else 'Budget' end.\" }],\n    [{ q: 'Return the number of days between the order date and today.', a: 'select datediff(day, OrderDate, getdate()) as DaysAgo from Sales.SalesOrderHeader;' },\n     { q: 'Show each order with its rank inside its customer, biggest first.', a: 'select SalesOrderID, CustomerID, rank() over (partition by CustomerID order by TotalDue desc) as R from Sales.SalesOrderHeader;' },\n     { q: 'Which functions would build an email of first initial plus last name?', a: \"concat(lower(left(FirstName,1)), lower(LastName), '@company.com')\" }],\n    [{ q: 'Find the orders whose subtotal is above the overall average.', a: 'select SalesOrderID, SubTotal from Sales.SalesOrderHeader where SubTotal > (select avg(SubTotal) from Sales.SalesOrderHeader);' },\n     { q: 'Rewrite an in subquery with exists and say why you might.', a: 'where exists (select 1 from Sales.SalesOrderHeader h where h.CustomerID = c.CustomerID) - exists stops at the first hit instead of building the whole list.' },\n     { q: 'Declare two CTEs where the second uses the first.', a: 'with A as (select ...), B as (select ... from A ...) select * from B; - separate them with a comma, and a later CTE may read an earlier one.' }]\n  ];\n\n  WT = {\n    title: 'Walkthrough: reading a query out loud, line by line (transcript)',\n    steps: [\n      { n: '01', text: 'Start at from. Production.Product is the table, so every column you may name has to live there.' },\n      { n: '02', text: 'Move to where. ListPrice > 1000 and Color = \\u2018Black\\u2019. Both criteria must hold, so the black cheap products and the expensive red ones are both gone.' },\n      { n: '03', text: 'Now select. Name and ListPrice come straight from the table, SalePrice is arithmetic done at read time and named with an alias.' },\n      { n: '04', text: 'Finally order by SalePrice desc. Sorting happens last, on the finished rows, which is why it may use the alias.' },\n      { n: '05', text: 'Say it as one sentence: from the products, keep the expensive black ones, show name, price and the discounted price, most expensive first. If your sentence matches the query, you have read it correctly.' }\n    ]\n  };\n\n  ERD_NOTES = {\n    pk: 'Primary Key. Customer ID identifies exactly one customer, and the value never repeats in this table.',\n    composite: 'Composite Primary Key. Neither Order Number nor Line Number is unique alone, but together they identify exactly one line of one order.',\n    fk: 'Foreign Key. This is the same Customer ID, borrowed from the Customers table. It may repeat on many rows, which is the 1:N side of the relationship.'\n  };\n\n  DISCOUNTS = [10, 15, 20];\n  PRODUCTS = [\n    { name: 'Mountain-100 Black, 38', price: 3374.99 },\n    { name: 'Road-250 Red, 48', price: 2443.35 },\n    { name: 'Touring-1000 Blue, 46', price: 2384.07 }\n  ];\n  EXEC = [\n    { k: 'from', d: 'The engine fetches the table or tables named in the from clause. Nothing can be filtered before it has been read.' },\n    { k: 'where', d: 'Records that do not meet the criteria are dropped. Aggregates do not exist yet, so they cannot be used here.' },\n    { k: 'group by', d: 'The surviving records are collected into groups of identical values, and the aggregates are calculated per group.' },\n    { k: 'having', d: 'Whole groups are dropped if they fail the condition. This is the only place a condition on sum, avg or count belongs.' },\n    { k: 'select', d: 'Only now is the output list built: the grouped columns, the aggregates, the calculated columns and their aliases.' },\n    { k: 'order by', d: 'The finished rows are sorted. Because select has already run, order by may refer to an alias.' }\n  ];\n  LIKE_PATTERNS = ['Road%', '%Black%', 'S____', '[BR]%', '_-%'];\n  LIKE_NAMES = ['Road-250 Red', 'Road-750 Black', 'Sport-100 Helmet', 'Blade', 'Short Socks', 'Mountain Bike Black'];\n  JOINS = ['inner', 'left', 'right', 'full outer'];\n  CUSTOMERS = [{ id: 1, name: 'Ana' }, { id: 2, name: 'Ben' }, { id: 3, name: 'Cara' }];\n  ORDERS = [{ cust: 1, amt: 100 }, { cust: 1, amt: 250 }, { cust: 2, amt: 90 }, { cust: 4, amt: 300 }];\n\n  likeMatch(pattern, value) {\n    let rx = '', i = 0, p = pattern.toLowerCase();\n    while (i < p.length) {\n      const ch = p[i];\n      if (ch === '%') rx += '.*';\n      else if (ch === '_') rx += '.';\n      else if (ch === '[') {\n        const end = p.indexOf(']', i);\n        let inner = p.slice(i + 1, end);\n        rx += '[' + inner + ']';\n        i = end;\n      } else rx += ch.replace(/[.*+?^${}()|\\\\]/g, '\\\\$&');\n      i++;\n    }\n    return new RegExp('^' + rx + '$').test(value.toLowerCase());\n  }\n\n  ui(k, dflt) { return this.state.ui[k] === undefined ? dflt : this.state.ui[k]; }\n  setUi(k, v) { this.setState(s => ({ ui: Object.assign({}, s.ui, { [k]: v }) })); }\n\n  score(i) {\n    const qs = this.Q[i], a = this.state.ans;\n    let pts = 0, answered = 0;\n    let attempted = 0;\n    qs.forEach(q => {\n      const r = a[q.id];\n      if (!r) return;\n      attempted++;\n      const resolved = r.done || r.tries >= 4;\n      if (resolved) { answered++; pts += r.done ? (r.tries === 1 ? 1 : r.tries === 2 ? 0.6 : r.tries === 3 ? 0.3 : 0) : 0; }\n    });\n    return { pct: Math.round(pts / qs.length * 100), runPct: Math.round(pts / Math.max(1, attempted) * 100), answered, attempted, total: qs.length };\n  }\n  statusOf(i) {\n    const s = this.score(i);\n    if (s.attempted === 0) return 'empty';\n    const g = this.props.greenThreshold ?? 80;\n    const p = s.attempted < s.total ? s.runPct : s.pct;\n    return p >= g ? 'green' : p >= 50 ? 'gold' : 'red';\n  }\n  dotColor(st) { return st === 'green' ? '#256F46' : st === 'gold' ? '#F4B41A' : st === 'red' ? '#EE3124' : st === 'partial' ? '#5E6A79' : '#E3E9EC'; }\n\n  answer(q, oi) {\n    const o = q.opts[oi];\n    this.setState(s => {\n      const prev = s.ans[q.id] || { tries: 0, done: false };\n      if (prev.done) return null;\n      const tries = prev.tries + 1;\n      return { ans: Object.assign({}, s.ans, { [q.id]: { tries, done: o.ok, chosen: oi, fb: o.fb, revealed: !o.ok && tries >= 4 } }) };\n    });\n  }\n\n  record(q, ok, fb) {\n    this.setState(s => {\n      const prev = s.ans[q.id] || { tries: 0, done: false };\n      if (prev.done) return null;\n      const tries = prev.tries + 1;\n      return { ans: Object.assign({}, s.ans, { [q.id]: { tries, done: ok, fb, revealed: !ok && tries >= 4 } }) };\n    });\n  }\n\n  submitFill(q) {\n    const raw = (this.state.fill[q.id] || '').toLowerCase().replace(/\\s+/g, ' ').trim();\n    if (!raw) return;\n    const ok = (q.accept || []).some(set => set.every(tok => raw.indexOf(tok) >= 0));\n    this.record(q, ok, ok ? (q.okFb || 'Correct.') : (q.wrongFb || 'Not yet. Read the guidance below and try again.'));\n  }\n\n  toggleOrd(q, k) {\n    this.setState(s => {\n      if ((s.ans[q.id] || {}).done) return null;\n      const cur = (s.ord[q.id] || []).slice();\n      const at = cur.indexOf(k);\n      if (at >= 0) cur.splice(at, 1); else cur.push(k);\n      return { ord: Object.assign({}, s.ord, { [q.id]: cur }) };\n    });\n  }\n\n  submitOrder(q) {\n    const cur = this.state.ord[q.id] || [];\n    if (cur.length < q.items.length) return;\n    const ok = cur.every((k, idx) => q.items[k] === q.correct[idx]);\n    this.record(q, ok, ok ? (q.okFb || 'Correct.') : (q.wrongFb || 'Not that order. Clear it and try again.'));\n  }\n\n  escalate(q, r) {\n    let esc = '', escTitle = '';\n    if (r && !r.done) {\n      if (r.tries === 1) { esc = q.hint; escTitle = 'Hint.'; }\n      else if (r.tries === 2) { esc = q.angle; escTitle = 'Another angle.'; }\n      else if (r.tries >= 3) { esc = q.explain + (r.tries >= 4 ? ' The correct answer is now shown.' : ''); escTitle = 'Full explanation.'; }\n    }\n    return { escalation: esc, escTitle };\n  }\n\n  badgeStyle(acc) {\n    return 'display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:#fff;background:' + acc + ';border-radius:20px;padding:4px 11px';\n  }\n\n  qvm(q, acc) {\n    if (!q) return null;\n    if (q.type === 'fill' || q.type === 'order') {\n      const r = this.state.ans[q.id];\n      const esc = this.escalate(q, r);\n      const base = {\n        mode: q.type, kind: q.kind, stem: q.stem, code: q.code || '',\n        badge: this.badgeStyle(acc),\n        feedback: r ? r.fb : '',\n        fbStyle: 'margin-top:10px;border-radius:8px;padding:11px 14px;font-size:13.5px;background:' + (r && r.done ? '#E6F4F6' : '#fdf4f4') + ';color:' + (r && r.done ? '#007681' : '#a32127'),\n        answerShown: r && r.revealed ? q.answer : '',\n        escalation: esc.escalation, escTitle: esc.escTitle\n      };\n      if (q.type === 'fill') {\n        return Object.assign(base, {\n          fillValue: this.state.fill[q.id] || '',\n          placeholder: q.placeholder || 'Type your answer',\n          onFill: e => { const v = e.target.value; this.setState(s => ({ fill: Object.assign({}, s.fill, { [q.id]: v }) })); },\n          submit: () => this.submitFill(q),\n          submitLabel: r && r.done ? 'Correct' : 'Check my answer'\n        });\n      }\n      const cur = this.state.ord[q.id] || [];\n      return Object.assign(base, {\n        orderItems: q.items.map((label, k) => {\n          const pos = cur.indexOf(k);\n          const on = pos >= 0;\n          return { label, num: on ? String(pos + 1) : '', go: () => this.toggleOrd(q, k),\n            style: 'display:inline-flex;align-items:center;gap:8px;border:1px solid ' + (on ? '#1F2C36' : '#E3E9EC') + ';background:' + (on ? '#1F2C36' : '#fff') + ';color:' + (on ? '#fff' : '#3A4555') + ';border-radius:8px;padding:8px 14px;font:inherit;font-family:Consolas,Menlo,monospace;font-size:13.5px;cursor:pointer',\n            numStyle: on ? 'display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#2FC3D4;color:#0C2233;font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:800' : 'display:none' };\n        }),\n        orderSeq: cur.length ? cur.map(k => q.items[k]).join('  \\u2192  ') : 'Click the commands in the order the engine performs them.',\n        submit: () => this.submitOrder(q),\n        submitLabel: r && r.done ? 'Correct' : 'Check the order',\n        reset: () => this.setState(s => ({ ord: Object.assign({}, s.ord, { [q.id]: [] }) }))\n      });\n    }\n    const r = this.state.ans[q.id];\n    const options = q.opts.map((o, oi) => {\n      const chosen = r && r.chosen === oi;\n      const reveal = r && r.revealed && o.ok;\n      const bg = r && chosen ? (o.ok ? '#E6F4F6' : '#fdf4f4') : reveal ? '#E6F4F6' : '#fff';\n      const bc = r && chosen ? (o.ok ? '#256F46' : '#EE3124') : reveal ? '#256F46' : '#E3E9EC';\n      return { text: o.t, go: () => this.answer(q, oi),\n        style: 'text-align:left;border:' + (reveal && !chosen ? '2px dashed ' : '1px solid ') + bc + ';background:' + bg + ';border-radius:9px;padding:11px 15px;font:inherit;font-size:14px;cursor:' + (r && r.done ? 'default' : 'pointer') + ';color:#1F2C36;width:100%' };\n    });\n    let esc = '', escTitle = '';\n    if (r && !r.done) {\n      if (r.tries === 1) { esc = q.hint; escTitle = 'Hint.'; }\n      else if (r.tries === 2) { esc = q.angle; escTitle = 'Another angle.'; }\n      else if (r.tries >= 3) { esc = q.explain + (r.tries >= 4 ? ' The correct answer is now marked above.' : ''); escTitle = 'Full explanation.'; }\n    }\n    return { mode: 'choice', kind: q.kind, stem: q.stem, code: q.code || '', options,\n      badge: this.badgeStyle(acc),\n      feedback: r ? r.fb : '',\n      fbStyle: 'margin-top:10px;border-radius:8px;padding:11px 14px;font-size:13.5px;background:' + (r && r.done ? '#E6F4F6' : '#fdf4f4') + ';color:' + (r && r.done ? '#007681' : '#a32127'),\n      escalation: esc, escTitle };\n  }\n\n  reflect(i, t) {\n    const text = (this.state.refl[i] || '').trim();\n    const keys = t.keys;\n    const hit = keys.filter(k => text.toLowerCase().includes(k));\n    const words = text ? text.split(/\\s+/).length : 0;\n    let title, body, missing = '';\n    if (words === 0) { title = 'Nothing to read yet'; body = 'Write a sentence first, even a rough one. Putting it in your own words is where the gap shows up.'; }\n    else if (words < 6) { title = 'A good start, now stretch it'; body = 'That is more of a label than an explanation. Add the because: what does it do, and what would go wrong without it?'; missing = keys.slice(0, 4).join(', '); }\n    else if (hit.length >= 3) { title = 'That is a solid answer'; body = 'You have named the key ideas and connected them. If you can say this out loud without looking, this topic is behind you.'; }\n    else if (hit.length >= 1) { title = 'You are most of the way there'; body = 'The shape is right and one or two central ideas are named. Add the missing piece and it becomes an explanation you could give to a colleague.'; missing = keys.filter(k => !text.toLowerCase().includes(k)).slice(0, 4).join(', '); }\n    else { title = 'Close, but it is not landing yet'; body = 'Your sentence does not touch the core idea of this topic. Re-read the refresher above, then try once more without looking at it.'; missing = keys.slice(0, 4).join(', '); }\n    this.setState(s => ({ reflFb: Object.assign({}, s.reflFb, { [i]: { title, body, missing, good: hit.length >= 3 && words >= 6 } }) }));\n  }\n\n  renderVals() {\n    const i = this.state.tab, isMap = i === 'map';\n    let answered = 0, totalQ = 0;\n    this.Q.forEach((qs, k) => { const s = this.score(k); answered += s.answered; totalQ += s.total; });\n    const overall = Math.round(answered / totalQ * 100);\n\n    const tabs = this.TOPICS.map((tp, k) => {\n      const st = this.statusOf(k), on = i === k;\n      return { label: tp.tab, go: () => this.setState({ tab: k }),\n        style: 'display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid ' + (on ? '#1F2C36' : '#E3E9EC') + ';background:' + (on ? '#1F2C36' : '#fff') + ';color:' + (on ? '#fff' : '#3A4555') + ';border-radius:20px;padding:8px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer',\n        dot: 'width:9px;height:9px;border-radius:50%;background:' + this.dotColor(st) + ';display:inline-block' };\n    });\n    tabs.push({ label: 'Readiness map', go: () => this.setState({ tab: 'map' }),\n      style: 'display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid ' + (isMap ? '#0097A7' : '#E3E9EC') + ';background:' + (isMap ? '#0097A7' : '#fff') + ';color:' + (isMap ? '#fff' : '#3A4555') + ';border-radius:20px;padding:8px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer',\n      dot: 'width:9px;height:9px;border-radius:50%;background:' + (isMap ? '#fff' : '#E3E9EC') + ';display:inline-block' });\n\n    const vals = {\n      headerTitle: this.props.headerTitle ?? 'AI Data Analyst program \\u00b7 SQL module \\u00b7 Data retrieval checkpoint',\n      overallPct: overall + '%',\n      overallFill: 'height:100%;width:' + overall + '%;background:linear-gradient(90deg,#0097A7,#2FC3D4);transition:width .3s',\n      tabs, isChapter: !isMap, isMap\n    };\n\n    if (isMap) {\n      const rows = this.TOPICS.map((tp, k) => {\n        const s = this.score(k), st = this.statusOf(k);\n        const bg = st === 'green' ? '#f2fdf8' : st === 'gold' ? '#fffbf0' : st === 'red' ? '#fdf4f4' : '#F5F7F8';\n        const col = st === 'green' ? '#007681' : st === 'gold' ? '#7A4E00' : st === 'red' ? '#EE3124' : '#5E6A79';\n        const partial = s.attempted < s.total;\n        const prefix = st === 'empty' ? '' : partial ? s.attempted + ' of ' + s.total + ' checks tried so far. ' : '';\n        const advice = st === 'empty' ? 'Not started. Work through the panel and the four checks in this topic.'\n          : prefix + (st === 'green' ? 'Solid. Move on with confidence.'\n          : st === 'gold' ? 'Almost there. Re-read the panel at the top of this topic, then retry the checks.'\n          : 'A real gap. Review the material at the source before moving on.');\n        return { title: tp.title, pct: st === 'empty' ? '\\u2013' : (partial ? s.runPct : s.pct) + '%', advice,\n          route: tp.route, showRoute: st === 'red' || st === 'gold', showLink: st === 'gold',\n          statStyle: 'padding:12px 14px;font-size:14px;font-weight:800;text-align:center;background:' + bg + ';color:' + col + ';display:flex;align-items:center;justify-content:center',\n          go: () => this.setState({ tab: k }) };\n      });\n      const weak = this.TOPICS.filter((tp, k) => ['gold', 'red'].indexOf(this.statusOf(k)) >= 0).map(tp => tp.title);\n      const done = this.TOPICS.every((tp, k) => this.score(k).answered === this.score(k).total);\n      const allGreen = done && this.TOPICS.every((tp, k) => this.statusOf(k) === 'green');\n      vals.mapRows = rows;\n      vals.summaryLine = weak.length === 0 && !done ? 'Nothing weak so far. Keep going \\u2014 topics you have not started yet are marked with a dash.'\n        : weak.length === 0 ? 'All seven topics are green. Nothing is holding you back.'\n        : 'Focus your review on ' + weak.slice(0, 2).join(' and ') + (weak.length > 2 ? ' first' : '') + ' before the next lesson.';\n      vals.gateText = allGreen ? 'All seven are green. You are ready for Lesson 13.' : 'When all seven topics are green, you are ready for Lesson 13.';\n      vals.gateStyle = 'border-radius:10px;padding:14px 18px;font-size:14.5px;font-weight:700;background:' + (allGreen ? '#E6F4F6' : '#0C2233') + ';color:' + (allGreen ? '#007681' : '#E6F4F6');\n      return vals;\n    }\n\n    const t = this.TOPICS[i], acc = t.acc;\n    const qs = this.Q[i];\n    const s = this.score(i), st = this.statusOf(i);\n    const shown = s.attempted < s.total ? s.runPct : s.pct;\n    const label = s.attempted === 0 ? 'Not started'\n      : (s.attempted < s.total ? s.attempted + ' of ' + s.total + ' tried \\u00b7 ' + shown + '% so far \\u00b7 ' : shown + '% \\u00b7 ')\n        + (st === 'green' ? 'solid' : st === 'gold' ? 'almost there' : 'review this one');\n\n    const chipStyle = on => 'border:1px solid ' + (on ? '#EE3124' : '#f3bcbc') + ';background:' + (on ? '#EE3124' : '#fff') + ';color:' + (on ? '#fff' : '#EE3124') + ';border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer';\n    const pick = this.state.ai[i];\n    const aiSet = this.AI[i];\n    const chosen = pick === undefined ? null : aiSet[pick];\n    const fb = this.state.reflFb[i];\n    const pillStyle = on => 'border:1px solid ' + (on ? '#0097A7' : '#E3E9EC') + ';background:' + (on ? '#0097A7' : '#fff') + ';color:' + (on ? '#fff' : '#3A4555') + ';border-radius:20px;padding:7px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer';\n\n    Object.assign(vals, {\n      bandStyle: 'display:flex;gap:20px;align-items:center;background:linear-gradient(120deg,' + acc + ',' + acc + 'cc);color:#fff;border-radius:14px 14px 0 0;padding:20px 26px',\n      bandNum: t.n, bandKicker: 'Topic ' + i + ' of 6', bandTitle: t.title, bandSub: t.sub,\n      showT0: i === 0, showT1: i === 1, showT2: i === 2, showT3: i === 3, showT4: i === 4, showT5: i === 5, showT6: i === 6,\n      qA: this.qvm(qs[0], acc), qB: this.qvm(qs[1], acc), qC: this.qvm(qs[2], acc), qD: this.qvm(qs[3], acc),\n      showAi: this.props.showAiHelpers ?? true,\n      aiChips: aiSet.map((c, k) => ({ label: c.l, style: chipStyle(pick === k), go: () => this.setState(x => ({ ai: Object.assign({}, x.ai, { [i]: k }) })) })),\n      aiAnswer: chosen ? chosen.t : '',\n      aiAnswerCode: chosen && chosen.c ? chosen.c : '',\n      aiAnswerTitle: chosen ? chosen.l + ' \\u00b7 ' + t.title : '',\n      reflPrompt: t.reflQ,\n      reflVal: this.state.refl[i] || '',\n      onRefl: e => { const v = e.target.value; this.setState(x => ({ refl: Object.assign({}, x.refl, { [i]: v }) })); },\n      checkRefl: () => this.reflect(i, t),\n      reflFb: fb ? fb.body : '',\n      reflFbTitle: fb ? fb.title : '',\n      reflMissing: fb ? fb.missing : '',\n      reflFbStyle: 'margin-top:12px;border-radius:10px;padding:12px 14px;font-size:14px;background:' + (fb && fb.good ? '#E6F4F6' : '#fffbf0') + ';border:1px solid ' + (fb && fb.good ? '#256F46' : '#ffe6a3') + ';color:' + (fb && fb.good ? '#007681' : '#7a5c00'),\n      practiceOn: !!this.state.practice[i],\n      practiceTitle: 'Three extra questions on ' + t.title + ', pitched at ' + (s.answered === 0 ? 'a first pass' : s.pct + '% on the checks'),\n      practiceItems: this.PRACTICE[i].map((p, k) => {\n        const open = this.state.pOpen[i + '-' + k];\n        return { q: p.q, answer: open ? p.a : '', label: open ? 'Hide the answer' : 'Show the answer',\n          go: () => this.setState(x => ({ pOpen: Object.assign({}, x.pOpen, { [i + '-' + k]: !open }) })) };\n      }),\n      genPractice: () => this.setState(x => ({ practice: Object.assign({}, x.practice, { [i]: true }) })),\n      topicFill: 'height:100%;width:' + (s.attempted === 0 ? 0 : shown) + '%;background:' + acc + ';display:block;transition:width .3s',\n      topicLabel: label,\n      prevLabel: i === 0 ? 'Back to top' : 'Previous topic',\n      nextLabel: i === 6 ? 'See my readiness map' : 'Next topic',\n      goPrev: () => this.setState({ tab: Math.max(0, i - 1) }),\n      goNext: () => this.setState({ tab: i === 6 ? 'map' : i + 1 })\n    });\n\n    if (i === 0) {\n      const note = this.ui('erd', '');\n      vals.erdPK = () => this.setUi('erd', 'pk');\n      vals.erdFK = () => this.setUi('erd', 'fk');\n      vals.erdComposite = () => this.setUi('erd', 'composite');\n      vals.erdNote = note ? this.ERD_NOTES[note] : 'Nothing selected yet. Click Customer ID, Order Number or the teal Customer ID in Order Details.';\n      vals.erdNoteStyle = 'margin-top:10px;border-radius:8px;padding:12px 15px;font-size:13.5px;background:' + (note ? '#E6F4F6' : '#F5F7F8') + ';border-left:4px solid ' + (note ? '#0097A7' : '#E3E9EC');\n    }\n    if (i === 1) {\n      const d = this.ui('disc', 10);\n      vals.discountBtns = this.DISCOUNTS.map(x => ({ label: x + '% off', style: pillStyle(d === x), go: () => this.setUi('disc', x) }));\n      vals.discountSql = 'select Name, ListPrice, ListPrice * ' + ((100 - d) / 100).toFixed(2) + ' as SalePrice\\nfrom Production.Product\\nwhere ListPrice > 1000\\norder by SalePrice desc;';\n      vals.discountRows = this.PRODUCTS.map(p => ({ name: p.name, price: p.price.toFixed(2), sale: (p.price * (100 - d) / 100).toFixed(2) }));\n      vals.wtTitle = this.WT.title;\n      vals.wtSteps = this.WT.steps;\n      vals.wtOpen = !!this.ui('wt', false);\n      vals.wtToggle = () => this.setUi('wt', !this.ui('wt', false));\n      vals.wtLabel = this.ui('wt', false) ? 'Hide transcript' : 'Read the transcript';\n    }\n    if (i === 2) {\n      const step = this.ui('exec', 0);\n      vals.execSteps = this.EXEC.map((e, k) => ({ label: e.k, style: 'border:1px solid ' + (step === k ? '#1F2C36' : '#E3E9EC') + ';background:' + (step === k ? '#1F2C36' : '#fff') + ';color:' + (step === k ? '#fff' : '#3A4555') + ';border-radius:7px;padding:7px 13px;font:inherit;font-family:Consolas,monospace;font-size:13px;cursor:pointer', go: () => this.setUi('exec', k) }));\n      vals.execTitle = (step + 1) + '. ' + this.EXEC[step].k;\n      vals.execText = this.EXEC[step].d;\n    }\n    if (i === 3) {\n      const p = this.ui('like', 'Road%');\n      vals.likeBtns = this.LIKE_PATTERNS.map(x => ({ label: \"like '\" + x + \"'\", style: pillStyle(p === x), go: () => this.setUi('like', x) }));\n      vals.likeRows = this.LIKE_NAMES.map(n => {\n        const m = this.likeMatch(p, n);\n        return { name: n, tag: m ? 'matches' : 'filtered out',\n          style: 'display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid ' + (m ? '#256F46' : '#E3E9EC') + ';background:' + (m ? '#E6F4F6' : '#fff') + ';border-radius:8px;padding:9px 14px;font-size:13.5px;font-family:Consolas,monospace',\n          tagStyle: 'font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:' + (m ? '#007681' : '#5E6A79') };\n      });\n    }\n    if (i === 4) {\n      const j = this.ui('join', 'inner');\n      vals.joinBtns = this.JOINS.map(x => ({ label: x.toUpperCase() + ' JOIN', style: pillStyle(j === x), go: () => this.setUi('join', x) }));\n      const rows = [];\n      const cell = nul => 'padding:6px 12px;border:1px solid #E3E9EC' + (nul ? ';color:#7A4E00;font-style:italic;background:#fff8e3' : '');\n      this.CUSTOMERS.forEach(c => {\n        const matches = this.ORDERS.filter(o => o.cust === c.id);\n        if (matches.length) matches.forEach(o => rows.push({ id: String(c.id), name: c.name, amount: String(o.amt), c1: cell(), c2: cell(), c3: cell() }));\n        else if (j === 'left' || j === 'full outer') rows.push({ id: String(c.id), name: c.name, amount: 'NULL', c1: cell(), c2: cell(), c3: cell(true) });\n      });\n      this.ORDERS.forEach(o => {\n        const has = this.CUSTOMERS.some(c => c.id === o.cust);\n        if (!has && (j === 'right' || j === 'full outer')) rows.push({ id: 'NULL', name: 'NULL', amount: String(o.amt), c1: cell(true), c2: cell(true), c3: cell() });\n      });\n      vals.joinRows = rows;\n      vals.joinCount = rows.length + (rows.length === 1 ? ' row' : ' rows');\n    }\n    if (i === 5) {\n      const mode = this.ui('win', 'group');\n      vals.winBtns = [\n        { label: 'group by', style: pillStyle(mode === 'group'), go: () => this.setUi('win', 'group') },\n        { label: 'sum() over (partition by)', style: pillStyle(mode === 'over'), go: () => this.setUi('win', 'over') }\n      ];\n      if (mode === 'group') {\n        vals.winSql = 'select CustomerID, sum(TotalDue) as Total\\nfrom Sales.SalesOrderHeader\\ngroup by CustomerID;';\n        vals.winHead = [{ t: 'CustomerID' }, { t: 'Total' }];\n        vals.winRows = [{ cells: [{ t: '29825' }, { t: '400' }] }, { cells: [{ t: '29827' }, { t: '200' }] }];\n        vals.winCount = '2 rows, the detail is gone';\n      } else {\n        vals.winSql = 'select SalesOrderID, CustomerID, TotalDue,\\n  sum(TotalDue) over (partition by CustomerID) as CustomerTotal\\nfrom Sales.SalesOrderHeader;';\n        vals.winHead = [{ t: 'SalesOrderID' }, { t: 'CustomerID' }, { t: 'TotalDue' }, { t: 'CustomerTotal' }];\n        vals.winRows = [\n          { cells: [{ t: '43659' }, { t: '29825' }, { t: '100' }, { t: '400' }] },\n          { cells: [{ t: '43701' }, { t: '29825' }, { t: '300' }, { t: '400' }] },\n          { cells: [{ t: '43712' }, { t: '29827' }, { t: '200' }, { t: '200' }] }\n        ];\n        vals.winCount = '3 rows, every detail row kept';\n      }\n    }\n    if (i === 6) {\n      const m = this.ui('cte', 'nested');\n      vals.cteBtns = [\n        { label: 'Nested subquery', style: pillStyle(m === 'nested'), go: () => this.setUi('cte', 'nested') },\n        { label: 'Named CTE', style: pillStyle(m === 'cte'), go: () => this.setUi('cte', 'cte') }\n      ];\n      vals.cteSql = m === 'nested'\n        ? 'select CustomerID, Total\\nfrom (\\n  select CustomerID, sum(TotalDue) as Total\\n  from Sales.SalesOrderHeader\\n  group by CustomerID\\n) as s\\nwhere Total > 50000;'\n        : 'with YearlySales as (\\n  select CustomerID, sum(TotalDue) as Total\\n  from Sales.SalesOrderHeader\\n  group by CustomerID\\n)\\nselect CustomerID, Total\\nfrom YearlySales\\nwhere Total > 50000;';\n      vals.cteNote = m === 'nested'\n        ? 'A table subquery in the from clause. It must be given an alias, here s, and it cannot be referred to twice.'\n        : 'The same logic, named once and read top to bottom. YearlySales may be called several times inside this one query, and it disappears the moment the query finishes.';\n    }\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
