  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

    <div style=\"color:#2FC3D4;font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:11.5px\">Practice · data retrieval<\u002Fdiv>\n    <h1 style=\"font-size:40px;line-height:1.15;margin:10px 0 14px;font-weight:800\">Practice what you have learned<\u002Fh1>\n    <p style=\"max-width:660px;color:#E6F4F6;margin:0 0 20px\">You have already studied these seven data retrieval topics. This unit is hands-on practice: every topic opens with a worked panel of real data, and the questions that follow are asked about that data. You get immediate feedback on every answer, and finish with a readiness map that names the presentation to return to.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px\">\n      <span style=\"background:rgba(255,255,255,.1);border:1px solid rgba(47,195,212,.35);border-radius:22px;padding:7px 14px;font-size:13px\">Self-paced practice<\u002Fspan>\n      <span style=\"background:rgba(255,255,255,.1);border:1px solid rgba(47,195,212,.35);border-radius:22px;padding:7px 14px;font-size:13px\">Immediate feedback on every question<\u002Fspan>\n      <span style=\"background:rgba(255,255,255,.1);border:1px solid rgba(47,195,212,.35);border-radius:22px;padding:7px 14px;font-size:13px\">Interactive query simulators<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px\">\n      <div style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:16px 18px\">\n        <div style=\"color:#2FC3D4;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px\">By the end you can<\u002Fdiv>\n        <div style=\"font-size:14px;color:#E6F4F6\">Read any retrieval query and say what it returns, choose the right tool for a question, and know exactly which topics need more practice.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:16px 18px\">\n        <div style=\"color:#2FC3D4;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px\">Why it matters<\u002Fdiv>\n        <div style=\"font-size:14px;color:#E6F4F6\">Everything ahead builds on retrieval. Practising now makes the queries you write later faster and more reliable.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:16px 18px\">\n        <div style=\"color:#2FC3D4;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px\">Support and reassurance<\u002Fdiv>\n        <div style=\"font-size:14px;color:#E6F4F6\">This is not a graded test. Every question gives you immediate feedback, so you always know what to practice next.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:sticky;top:37px;z-index:20;background:#fff;border-bottom:1px solid #E3E9EC;padding:10px 26px\">\n  <div style=\"max-width:960px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px\">\n    <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"8\">\n      <button sc-camel-on-click=\"{{ tab.go }}\" style=\"{{ tab.style }}\"><span aria-hidden=\"true\" style=\"{{ tab.dot }}\"><\u002Fspan>{{ tab.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:960px;margin:0 auto;padding:26px 26px 60px\">\n\n<sc-if value=\"{{ isChapter }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n  <div style=\"{{ bandStyle }}\">\n    <div style=\"font-size:46px;font-weight:800;opacity:.35;line-height:1\">{{ bandNum }}<\u002Fdiv>\n    <div>\n      <div style=\"font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.95\">{{ bandKicker }}<\u002Fdiv>\n      <h2 style=\"margin:2px 0 3px;font-size:26px;color:#fff;font-weight:800\">{{ bandTitle }}<\u002Fh2>\n      <div style=\"font-size:13.5px;opacity:.92\">{{ bandSub }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #E3E9EC;border-top:none;border-radius:0 0 14px 14px;padding:24px 26px 26px\">\n\n<sc-if value=\"{{ showT0 }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n  <div style=\"margin:2px 0 12px\">\n    <div style=\"font-size:20px;font-weight:800;color:#3A4555\">ERD · Retail Business<\u002Fdiv>\n    <div style=\"position:relative;height:3px;width:300px;max-width:70%;background:linear-gradient(90deg,#0097A7,#0C2233);border-radius:2px;margin-top:7px\"><span style=\"position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#0C2233\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:10px 0 12px;font-size:14px\">Click any underlined or highlighted field to see the part it plays.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;background:#F5F7F8;border:1px solid #E3E9EC;border-radius:12px;padding:18px\">\n    <div style=\"border:1px solid #1F2C36;align-self:start;background:#fff\">\n      <div style=\"background:#F4B41A;text-align:center;font-weight:700;padding:5px;border-bottom:1px solid #1F2C36\">Customers<\u002Fdiv>\n      <div style=\"padding:8px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:2px\">\n        <button sc-camel-on-click=\"{{ erdPK }}\" style=\"text-decoration:underline;font-weight:700;background:none;border:none;padding:0;font:inherit;color:#1F2C36;cursor:pointer;text-align:left\">Customer ID<\u002Fbutton>\n        <span>First Name<\u002Fspan><span>Last Name<\u002Fspan><span>Address<\u002Fspan><span>Gender<\u002Fspan><span>Age<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #1F2C36;align-self:start;background:#fff\">\n      <div style=\"background:#70AD47;color:#fff;text-align:center;font-weight:700;padding:5px;border-bottom:1px solid #1F2C36\">Order Details<\u002Fdiv>\n      <div style=\"padding:8px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:2px\">\n        <button sc-camel-on-click=\"{{ erdComposite }}\" style=\"text-decoration:underline;font-weight:700;background:none;border:none;padding:0;font:inherit;color:#1F2C36;cursor:pointer;text-align:left\">Order Number<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ erdComposite }}\" style=\"text-decoration:underline;font-weight:700;background:none;border:none;padding:0;font:inherit;color:#1F2C36;cursor:pointer;text-align:left\">Line Number<\u002Fbutton>\n        <span>Item Number<\u002Fspan>\n        <button sc-camel-on-click=\"{{ erdFK }}\" style=\"background:none;border:none;padding:0;font:inherit;color:#0097A7;font-weight:700;cursor:pointer;text-align:left\">Customer ID<\u002Fbutton>\n        <span>Branch Number<\u002Fspan><span>Amount<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"border:1px solid #1F2C36;background:#fff\">\n        <div style=\"background:#256F46;color:#fff;text-align:center;font-weight:700;padding:5px;border-bottom:1px solid #1F2C36\">Items<\u002Fdiv>\n        <div style=\"padding:8px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:2px\"><span style=\"text-decoration:underline;font-weight:700\">Item Number<\u002Fspan><span>Name<\u002Fspan><span>Department<\u002Fspan><span>Division<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #1F2C36;background:#fff\">\n        <div style=\"background:#2FC3D4;text-align:center;font-weight:700;padding:5px;border-bottom:1px solid #1F2C36\">Branches<\u002Fdiv>\n        <div style=\"padding:8px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:2px\"><span style=\"text-decoration:underline;font-weight:700\">Branch Number<\u002Fspan><span>Branch Name<\u002Fspan><span>Date Opened<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"{{ erdNoteStyle }}\">{{ erdNote }}<\u002Fdiv>\n  <div style=\"margin:26px 0 0;padding-top:14px;border-top:1px solid #E3E9EC;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#5E6A79\">Four questions about the ERD above<\u002Fdiv>\n  <dc-import name=\"CheckQuestion\" q=\"{{ qA }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qB }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qC }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qD }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showT1 }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n  <div style=\"margin:2px 0 12px\">\n    <div style=\"font-size:20px;font-weight:800;color:#3A4555\">Calculated columns<\u002Fdiv>\n    <div style=\"position:relative;height:3px;width:300px;max-width:70%;background:linear-gradient(90deg,#0097A7,#0C2233);border-radius:2px;margin-top:7px\"><span style=\"position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#0C2233\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:10px 0 10px\">Arithmetic inside select creates a column in the result only, never in the table. Operators: <b>+ &nbsp; - &nbsp; * &nbsp; / &nbsp; %<\u002Fb> (modulo returns the remainder). Change the discount and watch the calculated column move.<\u002Fp>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px\">\n    <sc-for list=\"{{ discountBtns }}\" as=\"d\" hint-placeholder-count=\"3\">\n      <button sc-camel-on-click=\"{{ d.go }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <pre style=\"background:#F5F7F8;border:1px solid #E3E9EC;border-left:4px solid #0097A7;border-radius:8px;padding:13px 16px;font-family:Consolas,Menlo,monospace;font-size:13.5px;color:#333;overflow-x:auto;white-space:pre;margin:0 0 12px\">{{ discountSql }}<\u002Fpre>\n  <div style=\"border:1px solid #bcd;border-radius:8px;overflow:hidden\">\n    <div style=\"background:#eef1f5;border-bottom:1px solid #cdd6e0;font-size:12px;color:#556;padding:5px 12px;font-weight:600\">Results<\u002Fdiv>\n    <sc-raw-table style=\"border-collapse:collapse;width:100%;font-size:13px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"background:#e8edf3;color:#334;text-align:left;padding:6px 12px;border:1px solid #d3dbe4\">Name<\u002Fsc-raw-th><sc-raw-th style=\"background:#e8edf3;color:#334;text-align:left;padding:6px 12px;border:1px solid #d3dbe4\">ListPrice<\u002Fsc-raw-th><sc-raw-th style=\"background:#e8edf3;color:#334;text-align:left;padding:6px 12px;border:1px solid #d3dbe4\">SalePrice<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ discountRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <sc-raw-tr><sc-raw-td style=\"padding:6px 12px;border:1px solid #E3E9EC\">{{ r.name }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 12px;border:1px solid #E3E9EC\">{{ r.price }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 12px;border:1px solid #E3E9EC\">{{ r.sale }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <div style=\"margin:26px 0 0;padding-top:14px;border-top:1px solid #E3E9EC;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#5E6A79\">Four questions about the query and result above<\u002Fdiv>\n  <dc-import name=\"CheckQuestion\" q=\"{{ qA }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qB }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qC }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qD }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showT2 }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n  <div style=\"margin:2px 0 12px\">\n    <div style=\"font-size:20px;font-weight:800;color:#3A4555\">Order of commands<\u002Fdiv>\n    <div style=\"position:relative;height:3px;width:300px;max-width:70%;background:linear-gradient(90deg,#0097A7,#0C2233);border-radius:2px;margin-top:7px\"><span style=\"position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#0C2233\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:10px 0 10px\">Step through the stages the engine actually performs.<\u002Fp>\n  <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px\">\n    <sc-for list=\"{{ execSteps }}\" as=\"s\" hint-placeholder-count=\"6\">\n      <button sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"background:#F5F7F8;border-left:4px solid #0097A7;border-radius:8px;padding:14px 16px;font-size:14px\"><b style=\"color:#3A4555\">{{ execTitle }}<\u002Fb> {{ execText }}<\u002Fdiv>\n  <div style=\"margin:26px 0 0;padding-top:14px;border-top:1px solid #E3E9EC;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#5E6A79\">Four questions about the stages above<\u002Fdiv>\n  <dc-import name=\"CheckQuestion\" q=\"{{ qA }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qB }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qC }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qD }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showT3 }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n  <div style=\"margin:2px 0 12px\">\n    <div style=\"font-size:20px;font-weight:800;color:#3A4555\">like and the wildcards<\u002Fdiv>\n    <div style=\"position:relative;height:3px;width:300px;max-width:70%;background:linear-gradient(90deg,#0097A7,#0C2233);border-radius:2px;margin-top:7px\"><span style=\"position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#0C2233\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 10px;font-size:14px\">Pick a pattern and see which product names survive. SQL is not case sensitive.<\u002Fp>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px\">\n    <sc-for list=\"{{ likeBtns }}\" as=\"p\" hint-placeholder-count=\"5\">\n      <button sc-camel-on-click=\"{{ p.go }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:6px\">\n    <sc-for list=\"{{ likeRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n      <div style=\"{{ r.style }}\"><span>{{ r.name }}<\u002Fspan><span style=\"{{ r.tagStyle }}\">{{ r.tag }}<\u002Fspan><\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"margin:26px 0 0;padding-top:14px;border-top:1px solid #E3E9EC;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#5E6A79\">Four questions about the pattern tester above<\u002Fdiv>\n  <dc-import name=\"CheckQuestion\" q=\"{{ qA }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qB }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qC }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qD }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showT4 }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n  <div style=\"margin:2px 0 12px\">\n    <div style=\"font-size:20px;font-weight:800;color:#3A4555\">Run the join yourself<\u002Fdiv>\n    <div style=\"position:relative;height:3px;width:300px;max-width:70%;background:linear-gradient(90deg,#0097A7,#0C2233);border-radius:2px;margin-top:7px\"><span style=\"position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#0C2233\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:10px 0 10px\">Three customers, four orders, one of them belonging to a customer who is not in the list. Switch the join and the result is recalculated on this page.<\u002Fp>\n  <div style=\"display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px\">\n    <div style=\"border:1px solid #1F2C36;background:#fff\">\n      <div style=\"background:#F4B41A;text-align:center;font-weight:700;padding:4px 14px;border-bottom:1px solid #1F2C36;font-size:13px\">Customers<\u002Fdiv>\n      <div style=\"padding:7px 12px;font-size:13px;font-family:Consolas,monospace;display:flex;flex-direction:column;gap:2px\"><span>1 &nbsp; Ana<\u002Fspan><span>2 &nbsp; Ben<\u002Fspan><span>3 &nbsp; Cara<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #1F2C36;background:#fff\">\n      <div style=\"background:#70AD47;color:#fff;text-align:center;font-weight:700;padding:4px 14px;border-bottom:1px solid #1F2C36;font-size:13px\">Orders<\u002Fdiv>\n      <div style=\"padding:7px 12px;font-size:13px;font-family:Consolas,monospace;display:flex;flex-direction:column;gap:2px\"><span>cust 1 &nbsp; 100<\u002Fspan><span>cust 1 &nbsp; 250<\u002Fspan><span>cust 2 &nbsp; &nbsp; 90<\u002Fspan><span>cust 4 &nbsp; 300<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px\">\n    <sc-for list=\"{{ joinBtns }}\" as=\"j\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ j.go }}\" style=\"{{ j.style }}\">{{ j.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"border:1px solid #bcd;border-radius:8px;overflow:hidden\">\n    <div style=\"background:#eef1f5;border-bottom:1px solid #cdd6e0;font-size:12px;color:#556;padding:5px 12px;font-weight:600\">Results · {{ joinCount }}<\u002Fdiv>\n    <sc-raw-table style=\"border-collapse:collapse;width:100%;font-size:13px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"background:#e8edf3;color:#334;text-align:left;padding:6px 12px;border:1px solid #d3dbe4\">CustomerID<\u002Fsc-raw-th><sc-raw-th style=\"background:#e8edf3;color:#334;text-align:left;padding:6px 12px;border:1px solid #d3dbe4\">Name<\u002Fsc-raw-th><sc-raw-th style=\"background:#e8edf3;color:#334;text-align:left;padding:6px 12px;border:1px solid #d3dbe4\">Amount<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ joinRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <sc-raw-tr><sc-raw-td style=\"{{ r.c1 }}\">{{ r.id }}<\u002Fsc-raw-td><sc-raw-td style=\"{{ r.c2 }}\">{{ r.name }}<\u002Fsc-raw-td><sc-raw-td style=\"{{ r.c3 }}\">{{ r.amount }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <div style=\"margin:26px 0 0;padding-top:14px;border-top:1px solid #E3E9EC;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#5E6A79\">Four questions about these two tables and the result above<\u002Fdiv>\n  <dc-import name=\"CheckQuestion\" q=\"{{ qA }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qB }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qC }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qD }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showT5 }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n  <div style=\"margin:2px 0 12px\">\n    <div style=\"font-size:20px;font-weight:800;color:#3A4555\">group by or over<\u002Fdiv>\n    <div style=\"position:relative;height:3px;width:300px;max-width:70%;background:linear-gradient(90deg,#0097A7,#0C2233);border-radius:2px;margin-top:7px\"><span style=\"position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#0C2233\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:10px 0 10px\">Same three orders, two ways of summarising them. Flip between them and watch what happens to the detail.<\u002Fp>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px\">\n    <sc-for list=\"{{ winBtns }}\" as=\"w\" hint-placeholder-count=\"2\">\n      <button sc-camel-on-click=\"{{ w.go }}\" style=\"{{ w.style }}\">{{ w.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <pre style=\"background:#F5F7F8;border:1px solid #E3E9EC;border-left:4px solid #0097A7;border-radius:8px;padding:13px 16px;font-family:Consolas,Menlo,monospace;font-size:13.5px;color:#333;overflow-x:auto;white-space:pre;margin:0 0 12px\">{{ winSql }}<\u002Fpre>\n  <div style=\"border:1px solid #bcd;border-radius:8px;overflow:hidden\">\n    <div style=\"background:#eef1f5;border-bottom:1px solid #cdd6e0;font-size:12px;color:#556;padding:5px 12px;font-weight:600\">Results · {{ winCount }}<\u002Fdiv>\n    <sc-raw-table style=\"border-collapse:collapse;width:100%;font-size:13px\">\n      <sc-raw-thead><sc-raw-tr>\n        <sc-for list=\"{{ winHead }}\" as=\"h\" hint-placeholder-count=\"3\">\n          <sc-raw-th style=\"background:#e8edf3;color:#334;text-align:left;padding:6px 12px;border:1px solid #d3dbe4\">{{ h.t }}<\u002Fsc-raw-th>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ winRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <sc-raw-tr>\n            <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <sc-raw-td style=\"padding:6px 12px;border:1px solid #E3E9EC\">{{ c.t }}<\u002Fsc-raw-td>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <div style=\"margin:26px 0 0;padding-top:14px;border-top:1px solid #E3E9EC;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#5E6A79\">Four questions about the two results above<\u002Fdiv>\n  <dc-import name=\"CheckQuestion\" q=\"{{ qA }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qB }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qC }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qD }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showT6 }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n  <div style=\"margin:2px 0 12px\">\n    <div style=\"font-size:20px;font-weight:800;color:#3A4555\">Same question, two ways<\u002Fdiv>\n    <div style=\"position:relative;height:3px;width:300px;max-width:70%;background:linear-gradient(90deg,#0097A7,#0C2233);border-radius:2px;margin-top:7px\"><span style=\"position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#0C2233\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:10px 0 10px\">\"Which customers spent more than 50,000?\" — written as a nested subquery, then as a named CTE. Same result, very different readability.<\u002Fp>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px\">\n    <sc-for list=\"{{ cteBtns }}\" as=\"c\" hint-placeholder-count=\"2\">\n      <button sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <pre style=\"background:#F5F7F8;border:1px solid #E3E9EC;border-left:4px solid #0097A7;border-radius:8px;padding:13px 16px;font-family:Consolas,Menlo,monospace;font-size:13.5px;color:#333;overflow-x:auto;white-space:pre;margin:0\">{{ cteSql }}<\u002Fpre>\n  <p style=\"font-size:13px;color:#3A4555;margin:10px 0 0\">{{ cteNote }}<\u002Fp>\n  <div style=\"margin:26px 0 0;padding-top:14px;border-top:1px solid #E3E9EC;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#5E6A79\">Four questions about the two queries above<\u002Fdiv>\n  <dc-import name=\"CheckQuestion\" q=\"{{ qA }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qB }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qC }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n\n  <dc-import name=\"CheckQuestion\" q=\"{{ qD }}\" hint-size=\"100%,230px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n\n    <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid #E3E9EC;padding-top:16px;margin-top:20px\">\n      <div style=\"flex:1;min-width:220px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#5E6A79;margin-bottom:5px\">Topic readiness<\u002Fdiv>\n        <div style=\"height:8px;background:#E3E9EC;border-radius:6px;overflow:hidden;max-width:240px\"><div style=\"{{ topicFill }}\"><\u002Fdiv><\u002Fdiv>\n        <div aria-live=\"polite\" style=\"font-size:13px;color:#3A4555;font-weight:700;margin-top:4px\">{{ topicLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px\">\n        <button sc-camel-on-click=\"{{ goPrev }}\" style=\"background:#fff;color:#0097A7;border:1px solid #0097A7;border-radius:9px;padding:9px 18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer\">{{ prevLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goNext }}\" style=\"background:#0097A7;color:#fff;border:none;border-radius:9px;padding:9px 20px;font:inherit;font-size:14px;font-weight:700;cursor:pointer\">{{ nextLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isMap }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n  <div style=\"display:flex;gap:20px;align-items:center;background:linear-gradient(120deg,#0C2233,#0C2233);color:#fff;border-radius:14px 14px 0 0;padding:22px 26px\">\n    <div>\n      <div style=\"font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#2FC3D4\">Final screen<\u002Fdiv>\n      <h2 style=\"margin:2px 0 3px;font-size:26px;font-weight:800;color:#fff\">Your readiness map<\u002Fh2>\n      <div style=\"font-size:13.5px;color:#E6F4F6\">Not a grade. A route: what is solid, and which topics to practice more.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E3E9EC;border-top:none;border-radius:0 0 14px 14px;padding:22px 24px 26px\">\n    <div aria-live=\"polite\" style=\"background:#F5F7F8;border-left:4px solid #0097A7;border-radius:8px;padding:14px 16px;font-size:15px;font-weight:700;color:#3A4555\">{{ summaryLine }}<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;margin:18px 0\">\n      <sc-for list=\"{{ mapRows }}\" as=\"r\" hint-placeholder-count=\"7\">\n        <div style=\"display:grid;grid-template-columns:190px 84px 1fr;border:1px solid #E3E9EC;border-radius:10px;overflow:hidden;align-items:stretch\">\n          <div style=\"padding:12px 14px;font-size:13.5px;font-weight:700;color:#3A4555\">{{ r.title }}<\u002Fdiv>\n          <div style=\"{{ r.statStyle }}\">{{ r.pct }}<\u002Fdiv>\n          <div style=\"padding:12px 14px;font-size:13.5px\">\n            <div>{{ r.advice }}<\u002Fdiv>\n            <sc-if value=\"{{ r.showRoute }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:6px;font-size:13px;font-weight:700;color:#3A4555\">Go back to: {{ r.route }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ r.showLink }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ r.go }}\" style=\"background:none;border:none;color:#0097A7;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;padding:0;margin-top:6px;text-decoration:underline\">Reopen the refresher panel<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px\">\n      <span style=\"display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#E6F4F6;color:#007681\">GREEN · solid, move on<\u002Fspan>\n      <span style=\"display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#fffbf0;color:#7A4E00\">GOLD · practice more<\u002Fspan>\n      <span style=\"display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#fdf4f4;color:#EE3124\">RED · more practice needed<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"{{ gateStyle }}\">{{ gateText }}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<div style=\"background:#0C2233;color:#8fbdb2;padding:24px 26px;font-size:13px\">\n  <div style=\"max-width:960px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n    <img src=\"4aec9fc4-162a-4477-a84d-05ddf6659bdb\" alt=\"Wawiwa\" style=\"height:24px;display:block\">\n    <span>AI Data Analyst program · SQL module<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;headerTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AI Data Analyst program · SQL module · Data retrieval checkpoint&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;greenThreshold&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:80,&quot;min&quot;:50,&quot;max&quot;:100,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;showAiHelpers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { tab: 0, ans: {}, ai: {}, refl: {}, reflFb: {}, practice: {}, pOpen: {}, ui: {}, fill: {}, ord: {} };\n\n  TOPICS = [\n    { n: '00', title: 'Foundations & DB Structure', tab: '0 Foundations', acc: '#70AD47',\n      sub: 'How the data is organised before you query it',\n      route: 'Lesson 1 presentation, slides 42\\u201363, and Lesson 2 presentation, slides 10\\u201317',\n      reflQ: 'In one sentence: what is the difference between a Primary Key and a Foreign Key?',\n      keys: ['primary', 'foreign', 'unique', 'table', 'join', 'key'] },\n    { n: '01', title: 'Basic Retrieval', tab: '1 Basic retrieval', acc: '#0097A7',\n      sub: 'select, where, operators, calculated columns, aliases, order by',\n      route: 'Lesson 2 presentation, slides 20\\u201358, and Lesson 3 presentation, slides 4\\u201327',\n      reflQ: 'In one sentence: what does a calculated column with an alias actually change in the database?',\n      keys: ['result', 'not', 'table', 'alias', 'query', 'column'] },\n    { n: '02', title: 'Grouping & Aggregation', tab: '2 Grouping', acc: '#256F46',\n      sub: 'group by, aggregates, having, and the order of commands',\n      route: 'Lesson 4 presentation, slides 4\\u201338',\n      reflQ: 'In one sentence: when do you filter with where and when with having?',\n      keys: ['where', 'having', 'before', 'after', 'group', 'aggregate', 'row'] },\n    { n: '03', title: 'Filtering, Ranges & Patterns', tab: '3 Filtering', acc: '#0C2233',\n      sub: 'distinct, top, in, between, like with wildcards, and NULL',\n      route: 'Lesson 5 presentation, slides 4\\u201361',\n      reflQ: 'In one sentence: why does where Color = NULL return nothing?',\n      keys: ['null', 'unknown', 'equal', 'is null', 'nothing', 'compare'] },\n    { n: '04', title: 'Joins & Combining', tab: '4 Joins', acc: '#007681',\n      sub: 'inner, left, right, full outer, union, union all and case when',\n      route: 'Lesson 6 presentation, slides 16\\u201371, and Lesson 7 presentation, slides 4\\u201350',\n      reflQ: 'In one sentence: what is the difference between a join and a union?',\n      keys: ['join', 'union', 'column', 'row', 'horizontal', 'vertical', 'match'] },\n    { n: '05', title: 'Functions', tab: '5 Functions', acc: '#F4B41A',\n      sub: 'Aggregate, number, string and date functions, and window functions',\n      route: 'Lesson 8 presentation, slides 4\\u201385, and Lesson 7 presentation, slides 27\\u201331',\n      reflQ: 'In one sentence: what does a window function give you that group by cannot?',\n      keys: ['every row', 'detail', 'partition', 'over', 'collapse', 'row'] },\n    { n: '06', title: 'Subqueries & CTE', tab: '6 Subqueries & CTE', acc: '#256F46',\n      sub: 'Three shapes of subquery, correlated queries, exists, and with ... as',\n      route: 'Lesson 9 presentation, slides 4\\u201346, Lesson 10 presentation, slides 4\\u201324, and Lesson 11 presentation, slides 4\\u201334',\n      reflQ: 'In one sentence: how long does a CTE exist, and what does that mean in practice?',\n      keys: ['immediately', 'after', 'query', 'temporary', 'runs', 'declare'] }\n  ];\n\n  Q = [\n    [\n      { id: 'q0a', kind: 'Multiple choice', stem: 'In the ERD above, Customer ID appears in Customers and again in Order Details. In Order Details, what is that field called?',\n        opts: [\n          { t: 'Foreign Key', ok: true, fb: 'Correct. And it must contain a value that exists in the table where it is the Primary Key.' },\n          { t: 'Primary Key', ok: false, fb: 'Not quite. The Primary Key identifies records inside its own table.' },\n          { t: 'Index', ok: false, fb: 'No. An index speeds up searching, it does not connect tables.' },\n          { t: 'Alias', ok: false, fb: 'No. An alias is a temporary name used while a query runs.' }],\n        hint: 'Think about which field appears in two tables at once.',\n        angle: 'In the ERD, Customer ID sits in Customers and in Order Details. In Order Details it is not the row identifier, it is a reference.',\n        explain: 'A Primary Key uniquely identifies a record in its own table. A Foreign Key is a field in another table holding those same values, which is what makes a join possible.' },\n      { id: 'q0b', kind: 'Code prediction', stem: 'In the ERD, Order Details has two underlined fields: Order Number and Line Number. What does that tell you?',\n        opts: [\n          { t: 'Together they form the Primary Key', ok: true, fb: 'Correct. A record can be identified by a combination of fields, not only by a single one.' },\n          { t: 'Both are Foreign Keys', ok: false, fb: 'No. Underlining marks the key of this table. Item Number and Customer ID are the references out.' },\n          { t: 'The table has two Primary Keys', ok: false, fb: 'A table has one Primary Key. It may be built from more than one field.' },\n          { t: 'They are indexed for speed', ok: false, fb: 'Indexing is not what underlining means in an ERD.' }],\n        hint: 'One order line is not identified by the order alone.',\n        angle: 'Order 1001 has line 1, line 2, line 3. Neither field alone is unique, the pair is.',\n        explain: 'A Primary Key may be a single field or a combination of fields. Order Number plus Line Number identifies exactly one line of one order.' },\n      { id: 'q0c', type: 'fill', kind: 'Short answer', stem: 'The Product table sits in the Production schema. Type the full reference you would write after from.',\n        placeholder: 'schema.table',\n        accept: [['production.product'], ['production', 'product']],\n        answer: 'Production.Product \\u2014 schema first, then a dot, then the table name.',\n        okFb: 'Correct. Schema first, then a dot, then the table name.',\n        wrongFb: 'Not yet. Two parts, joined by a dot: the category the table is filed under, then the table itself.',\n        hint: 'AdventureWorks groups its tables by business area.',\n        angle: 'You have also written Production.Product and Person.Person. What do Sales, Production and Person have in common?',\n        explain: 'A schema is a framework that organises tables into categories inside one database. The full reference is schema.table.' },\n      { id: 'q0d', kind: 'Branching', stem: 'One customer may place many orders, and each order belongs to exactly one customer. Where does the Foreign Key sit?',\n        opts: [\n          { t: 'In the orders table, on the 1:N side', ok: true, fb: 'Correct. The value repeats on the many side, which is exactly where a Foreign Key lives.' },\n          { t: 'In the customers table, on the 1:1 side', ok: false, fb: 'Choose this and each customer could hold only one order. The key must sit where the value repeats.' },\n          { t: 'In both tables, one copy each', ok: false, fb: 'No. It is one field in the referencing table, pointing at the Primary Key in the other.' }],\n        hint: 'Ask which table needs to repeat a value.',\n        angle: 'A customer row cannot list an unlimited number of orders. An order row easily names one customer.',\n        explain: 'The Foreign Key always sits on the many side of a 1:N relationship. That is why Order Details carries Customer ID and not the other way round.' }\n    ],\n    [\n      { id: 'q1a', kind: 'Multiple choice', stem: 'The result above lists a black, a red and a blue bike. Which where clause would keep every product except the black one?',\n        opts: [\n          { t: \"where Color <> 'Black'\", ok: true, fb: 'Correct. <> is the not-equal operator. Note that rows with a NULL colour still will not appear.' },\n          { t: \"where Color = 'Black'\", ok: false, fb: 'That is the opposite: it keeps only the black ones.' },\n          { t: \"where Color >< 'Black'\", ok: false, fb: 'Not an SQL operator. The correct spelling is <>.' },\n          { t: \"where not Color\", ok: false, fb: 'not needs a full condition after it, for example not (Color = \\u2018Black\\u2019).' }],\n        hint: 'One of these is the standard not-equal sign in T-SQL.',\n        angle: 'The operator list has =, >, <, >=, <= and one more.',\n        explain: 'T-SQL writes not equal to as <>. You may also express it as not (Color = \\u2018Black\\u2019), which is the same thing.' },\n      { id: 'q1b', kind: 'Code prediction', stem: 'What does this query return?',\n        code: 'select Name, ListPrice, ListPrice * 0.9 as SalePrice\\nfrom Production.Product\\nwhere ListPrice > 1000\\norder by SalePrice;',\n        opts: [\n          { t: 'Products over 1000, sorted from the lowest SalePrice upward', ok: true, fb: 'Correct. Ascending is the default, and order by may use the alias.' },\n          { t: 'Products over 1000, sorted from the highest SalePrice down', ok: false, fb: 'That would need desc. Without it, order by sorts ascending.' },\n          { t: 'An error, because SalePrice is not a real column', ok: false, fb: 'No. order by runs after select, so the alias already exists.' },\n          { t: 'All products, with SalePrice saved into the table', ok: false, fb: 'No. A calculated column exists only in the result, and where filters rows out.' }],\n        hint: 'Two decisions: which rows survive, and in what order they come back.',\n        angle: 'Look for the word desc. It is not there.',\n        explain: 'where keeps products over 1000, select adds a calculated column named by an alias, and order by sorts ascending by default.' },\n      { id: 'q1c', kind: 'Multiple choice', stem: 'You alias a column as Profit. How long does that name exist?',\n        opts: [\n          { t: 'Only while this query runs', ok: true, fb: 'Correct. The alias expires with the query. The table is untouched.' },\n          { t: 'Until you close the connection', ok: false, fb: 'No. It is not stored anywhere, not even for the session.' },\n          { t: 'Permanently, the column is renamed', ok: false, fb: 'No. An alias never changes the table structure.' },\n          { t: 'Until another query uses the same name', ok: false, fb: 'No. Each query declares its own aliases from scratch.' }],\n        hint: 'The Aliases circle diagram has a badge for exactly this.',\n        angle: 'Expiration: the alias applies only during the running of the query.',\n        explain: 'An alias is a temporary name for a column or a table, used to give a result a clear title. It applies only while the query runs and changes nothing in the database.' },\n      { id: 'q1d', type: 'fill', kind: 'Write the clause', stem: 'From the same product list, you want only the black ones costing more than 500. Type the whole where clause.',\n        placeholder: \"where Color = '...' ...\",\n        accept: [['where', 'color', 'black', 'and', 'listprice', '500']],\n        answer: \"where Color = 'Black' and ListPrice > 500\",\n        okFb: 'Correct. and means every criterion must be met.',\n        wrongFb: 'Not yet. You need both criteria in one clause, joined by the operator that requires them both.',\n        hint: 'Both criteria have to hold at the same time.',\n        angle: 'and narrows the result, or widens it.',\n        explain: 'Use and when all criteria must be met, or when at least one is enough, and not to reverse a condition. Brackets make the intention explicit when you mix them.' }\n    ],\n    [\n      { id: 'q2a', kind: 'Multiple choice', stem: 'You write group by Color. Which columns may appear in the select list?',\n        opts: [\n          { t: 'Color, and any aggregate function', ok: true, fb: 'Correct. Every select column must be in the group by or inside an aggregate.' },\n          { t: 'Any column of the table', ok: false, fb: 'No. A plain detail column has many values per group, so SQL Server rejects it.' },\n          { t: 'Only aggregate functions', ok: false, fb: 'Too strict. The grouped column itself is allowed, and usually wanted.' },\n          { t: 'Only Color', ok: false, fb: 'Too strict. Aggregates are the whole point of grouping.' }],\n        hint: 'How many values would ProductID have inside the group Red?',\n        angle: 'One row comes back per group, so any column shown must have exactly one value per group.',\n        explain: 'The rule is fixed: the columns in select must be part of the group by, or an aggregate function. Anything else has no single value per group.' },\n      { id: 'q2b', kind: 'Code prediction', stem: 'The extract has 3 rows and one Color is NULL. What comes back?',\n        code: 'select count(*) as Rows, count(Color) as Colors\\nfrom Production.Product;',\n        opts: [\n          { t: '3 and 2', ok: true, fb: 'Correct. count(*) counts rows, count(Color) skips the NULL.' },\n          { t: '3 and 3', ok: false, fb: 'No. count on a column ignores NULL values.' },\n          { t: '2 and 2', ok: false, fb: 'No. count(*) counts every row, empty values included.' },\n          { t: 'An error, because of the NULL', ok: false, fb: 'No. NULL does not break count, it is simply skipped.' }],\n        hint: 'One of the two counts cares about NULL.',\n        angle: 'count(*) asks how many rows there are. count(Color) asks how many colours are actually filled in.',\n        explain: 'count(*) counts rows regardless of content. count(column) counts only rows where that column holds a value. count(distinct column) counts the different values.' },\n      { id: 'q2c', kind: 'Branching', stem: 'You want only the years whose total revenue is over one million. Where does that condition belong?',\n        opts: [\n          { t: 'In having, after group by', ok: true, fb: 'Correct. The value only exists after grouping, so having is the only place it can go.' },\n          { t: 'In where, before group by', ok: false, fb: 'Choose this and SQL rejects the query: sum(TotalDue) does not exist yet when where runs.' },\n          { t: 'In order by', ok: false, fb: 'order by only sorts. It never removes rows.' }],\n        hint: 'Ask yourself when the total is calculated.',\n        angle: 'from, then where, then group by, then having. A filter on sum needs the sum to exist already.',\n        explain: 'where filters records before grouping and cannot use an aggregate. having filters after grouping, and is where every condition on sum, avg or count belongs.' },\n      { id: 'q2d', type: 'order', kind: 'Put in order', stem: 'Click the six commands in the order the engine actually performs them, first to last.',\n        items: ['select', 'where', 'from', 'order by', 'having', 'group by'],\n        correct: ['from', 'where', 'group by', 'having', 'select', 'order by'],\n        answer: 'from \\u2192 where \\u2192 group by \\u2192 having \\u2192 select \\u2192 order by',\n        okFb: 'Correct. That execution order is why an alias works in order by but never in where.',\n        wrongFb: 'Not that order. Clear it and think about what must exist before the next stage can run.',\n        hint: 'Something has to be read before it can be filtered.',\n        angle: 'Use the stepper above: the first stage names the table.',\n        explain: 'The execution order is from, where, group by, having, select, order by. The written order is required to be select, from, where, group by, having, order by.' }\n    ],\n    [\n      { id: 'q3a', kind: 'Multiple choice', stem: 'select distinct Color, Size from Production.Product. What does distinct apply to?',\n        opts: [\n          { t: 'The whole record, so the Color and Size pair together', ok: true, fb: 'Correct. Two rows survive if they differ in at least one field.' },\n          { t: 'Only the first column, Color', ok: false, fb: 'No. distinct is never per column, it applies to the returned record.' },\n          { t: 'Only the last column, Size', ok: false, fb: 'No. It applies to the record as a whole.' },\n          { t: 'Nothing, distinct needs one column', ok: false, fb: 'No, distinct works on any number of columns.' }],\n        hint: 'The rule speaks about records, not columns.',\n        angle: 'Red-M and Red-L differ in one field, so both survive.',\n        explain: 'distinct removes duplicate records: every returned row differs from every other in at least one field. Its main use is producing lists in which each value appears once.' },\n      { id: 'q3b', kind: 'Code prediction', stem: 'ListPrice values are 100, 300, 500 and 700. How many rows does where ListPrice between 100 and 500 return?',\n        opts: [\n          { t: '3, because both ends are included', ok: true, fb: 'Correct. between is inclusive: 100, 300 and 500.' },\n          { t: '1, only 300', ok: false, fb: 'No. between includes the boundary values themselves.' },\n          { t: '2, only 100 and 300', ok: false, fb: 'No, the upper boundary counts too.' },\n          { t: '4, all of them', ok: false, fb: 'No. 700 is above the range.' }],\n        hint: 'Are the boundary values in or out?',\n        angle: 'between selects the range including the outer values.',\n        explain: 'between a and b includes both a and b. It works on numbers, text and dates, and can be inverted with not between.' },\n      { id: 'q3c', kind: 'Multiple choice', stem: \"Using the same wildcard rules as the tester above: which pattern matches 'hit' but not 'hot' or 'hat'?\",\n        opts: [\n          { t: \"like 'h[^oa]t'\", ok: true, fb: 'Correct. The caret excludes the listed characters.' },\n          { t: \"like 'h[oa]t'\", ok: false, fb: 'That is the opposite: it matches hot and hat, but not hit.' },\n          { t: \"like 'h_t'\", ok: false, fb: 'The underscore accepts any single character, so all three match.' },\n          { t: \"like 'h%t'\", ok: false, fb: 'Any number of characters between h and t, so all three match again.' }],\n        hint: 'One of the wildcards means \"except these\".',\n        angle: 'Try the patterns in the tester above and watch which names drop out.',\n        explain: 'Wildcards: % any number of characters, _ exactly one, [] any one of the listed characters, [^] any character except those, and - a range like [a-b].' },\n      { id: 'q3d', type: 'fill', kind: 'Fix the query', stem: 'This query is meant to list the products with no colour recorded, but it returns nothing at all. Type the corrected where clause.',\n        code: 'select Name from Production.Product\\nwhere Color = NULL;',\n        placeholder: 'where Color ...',\n        accept: [['where', 'color', 'is null']],\n        answer: 'where Color is null \\u2014 nothing can equal NULL, so = NULL never matches a row.',\n        okFb: 'Correct. Nothing equals NULL, so you need the dedicated test instead of =.',\n        wrongFb: 'Not yet. Equals cannot be used on an unknown value, so the language gives you a separate two-word test.',\n        hint: 'NULL is not a value you can compare with equals.',\n        angle: 'NULL means unknown. Is unknown equal to unknown? SQL cannot tell, so the row is dropped.',\n        explain: 'NULL represents nothing, and it is not 0 and not empty text. Any comparison with = returns unknown, so no row passes. Always write is null or is not null.' }\n    ],\n    [\n      { id: 'q4a', kind: 'Branching', stem: 'You list every customer with their orders. Some customers never ordered. Which join keeps them?',\n        opts: [\n          { t: 'LEFT JOIN from Customers to Orders', ok: true, fb: 'Correct. Every customer stays and the order columns show NULL where there is no match.' },\n          { t: 'INNER JOIN', ok: false, fb: 'Pick this and the customers with no orders disappear. Inner keeps only matching pairs.' },\n          { t: 'UNION of the two tables', ok: false, fb: 'union stacks rows and needs matching columns. It cannot attach an order to a customer.' }],\n        hint: 'Which side must be complete no matter what?',\n        angle: 'Customers is the left table. You want all of it, matched or not.',\n        explain: 'inner join returns only matching rows. left join returns all rows from the left table with NULLs on the right where there is no partner, and that NULL is how you spot customers with no orders.' },\n      { id: 'q4b', kind: 'Code prediction', stem: 'In the two tables above Ana has two orders, Ben one, Cara none, and one order belongs to customer 4. How many rows does an INNER JOIN return?',\n        opts: [\n          { t: '3', ok: true, fb: 'Correct. Ana twice and Ben once. Cara and order 4 have no partner, so they drop out.' },\n          { t: '4', ok: false, fb: 'That is the left join count. Inner join drops Cara.' },\n          { t: '5', ok: false, fb: 'That is the full outer join count, which keeps every unmatched row from both sides.' },\n          { t: '2', ok: false, fb: 'No. Ana matches twice, so Ana produces two rows.' }],\n        hint: 'Count the matching pairs, and remember one customer matches twice.',\n        angle: 'Switch the join picker above to INNER and count the result rows.',\n        explain: 'If a row on one side matches several rows on the other, there is a result record for every matching value. An inner join returns only matched pairs, so here that is 2 + 1 = 3.' },\n      { id: 'q4c', type: 'fill', kind: 'Short answer', stem: 'Two city lists are stacked and Tel Aviv appears in both. You want it twice in the result. Which combiner do you write?',\n        placeholder: 'Type the keyword',\n        accept: [['union all']],\n        answer: 'union all \\u2014 union removes duplicate records, union all keeps every row and is faster.',\n        okFb: 'Correct. union removes duplicates, union all keeps them and is faster.',\n        wrongFb: 'Close, but the plain form of that keyword throws the duplicate away. You need the two-word form.',\n        hint: 'One of the two forms does extra work before returning the rows.',\n        angle: 'If the same city appears in both queries, how many times should it be in the result?',\n        explain: 'Both combine result sets vertically and need the same number of columns with compatible types. union returns the records without duplicates, union all returns everything.' },\n      { id: 'q4d', kind: 'Code prediction', stem: 'A product costs 1500. Which band does this case return?',\n        code: \"case when ListPrice > 100 then 'Standard'\\n     when ListPrice > 1000 then 'Premium'\\n     else 'Budget'\\nend\",\n        opts: [\n          { t: \"'Standard', because that condition is checked first\", ok: true, fb: 'Correct. The first true condition wins and the case exits. This ordering is the classic bug.' },\n          { t: \"'Premium', because 1500 is over 1000\", ok: false, fb: 'It would be, if the Premium test came first. Conditions are checked in written order.' },\n          { t: \"'Budget'\", ok: false, fb: 'else is used only when no condition is true.' },\n          { t: 'Both values, in two columns', ok: false, fb: 'No. A case expression returns exactly one value per row.' }],\n        hint: 'In what order are the conditions checked?',\n        angle: '1500 is greater than 100, and that test is written on the first line.',\n        explain: 'The conditions are checked in the order written, and the value is released from the first one that is true. Order your when clauses from the narrowest condition to the widest.' }\n    ],\n    [\n      { id: 'q5a', type: 'fill', kind: 'Short answer', stem: 'You want the quarter an order falls in: datepart(?, OrderDate). Type the abbreviation that goes in place of the question mark.',\n        placeholder: 'e.g. mm for month',\n        accept: [['qq'], ['q']],\n        answer: 'qq (or q, or the full word quarter).',\n        okFb: 'Correct. datepart(qq, OrderDate) and datepart(quarter, OrderDate) are the same.',\n        wrongFb: 'Not that one. yy is year, mm is month, wk is week \\u2014 quarter follows the same habit.',\n        hint: 'The abbreviation usually doubles the first letter.',\n        angle: 'yy year, mm month, dd day, wk week... and quarter follows the same habit.',\n        explain: 'Date functions such as dateadd, datediff and datename take a datepart: yy year, qq quarter, mm month, dy dayofyear, dd day, wk week, dw weekday, hh hour, mi minute, ss second.' },\n      { id: 'q5b', kind: 'Code prediction', stem: \"LastName is 'Sanchez'. What does left(upper(LastName), 3) return?\",\n        opts: [\n          { t: \"'SAN'\", ok: true, fb: 'Correct. upper runs first inside the brackets, then left takes three characters.' },\n          { t: \"'San'\", ok: false, fb: 'upper has already converted the whole string to capitals.' },\n          { t: \"'HEZ'\", ok: false, fb: 'That would be right(upper(LastName), 3).' },\n          { t: \"'SANCHEZ'\", ok: false, fb: 'left cuts the string down to the number of characters you ask for.' }],\n        hint: 'Inner brackets are evaluated first.',\n        angle: 'upper(\\u2018Sanchez\\u2019) is \\u2018SANCHEZ\\u2019. Now take the leftmost three characters.',\n        explain: 'Functions nest inside out. len counts characters, left and right cut from an end, substring(string, start, length) cuts from the middle, concat joins, trim removes outer spaces.' },\n      { id: 'q5c', kind: 'Multiple choice', stem: 'The two results above come from the same three orders: one has 2 rows, the other 3. What is the key difference between group by and a window function with over?',\n        opts: [\n          { t: 'group by collapses rows into one per group, a window function returns an answer for every row', ok: true, fb: 'Correct. That is why over lets you show the detail and the total side by side.' },\n          { t: 'They do the same thing with different syntax', ok: false, fb: 'No. The shape of the result is different.' },\n          { t: 'A window function can only count, never sum', ok: false, fb: 'No. sum, avg, count, min and max all work with over.' },\n          { t: 'group by works on numbers only', ok: false, fb: 'No. You may group by any column.' }],\n        hint: 'Compare how many rows come back from each.',\n        angle: 'Flip the toggle above: one view has two rows, the other still has three.',\n        explain: 'group by summarises and the detail disappears. A window function groups the data, calculates over that window, and returns an answer for every row of the group.' },\n      { id: 'q5d', kind: 'Code prediction', stem: 'A customer has two orders of 100 and 300. What does CustomerTotal show on each of their rows?',\n        code: 'select SalesOrderID, TotalDue,\\n  sum(TotalDue) over (partition by CustomerID) as CustomerTotal\\nfrom Sales.SalesOrderHeader;',\n        opts: [\n          { t: '400 on both rows', ok: true, fb: 'Correct. The window is the customer, so both rows carry the same total.' },\n          { t: '100 on the first row and 400 on the second', ok: false, fb: 'That is a running total, which needs order by inside the over clause.' },\n          { t: 'One row only, showing 400', ok: false, fb: 'No. A window function does not collapse rows, that is group by.' },\n          { t: '100 and 300, unchanged', ok: false, fb: 'No. sum over the partition adds the customer\\u2019s orders together.' }],\n        hint: 'partition by decides which rows are added up together.',\n        angle: 'There is no order by inside over, so there is no running total, just one sum per partition.',\n        explain: 'partition by CustomerID puts both orders in the same window. The sum over that window is 400, and because it is a window function the value appears on every row of the partition.' }\n    ],\n    [\n      { id: 'q6a', type: 'fill', kind: 'Short answer', stem: 'A subquery returns a whole column of CustomerID values, so where CustomerID = (...) fails. Type the operator that belongs there instead.',\n        placeholder: 'Type the operator',\n        accept: [['in']],\n        answer: 'in \\u2014 a single value pairs with = or >, a list pairs with in or not in, a table goes in the from clause with an alias.',\n        okFb: 'Correct. in compares one value against a list.',\n        wrongFb: 'Not that one. You are asking whether a value belongs to a set of values.',\n        hint: 'What shape is the result: one value, a list, or a table?',\n        angle: 'A list of values is a set. Which operator asks whether something belongs to a set?',\n        explain: 'A single value subquery pairs with = or >. A list subquery pairs with in or not in. A table subquery goes in the from clause with an alias.' },\n      { id: 'q6b', kind: 'Multiple choice', stem: 'Neither query above is correlated \\u2014 both inner queries could run on their own. So what makes a subquery correlated?',\n        opts: [\n          { t: 'It uses a value from the outer query, so it is re-evaluated for every outer row', ok: true, fb: 'Correct. The two are interdependent, which is powerful and slow.' },\n          { t: 'It returns more than one column', ok: false, fb: 'No. That is a table subquery, and it may be perfectly independent.' },\n          { t: 'It is written inside the from clause', ok: false, fb: 'No. Position is not what makes it correlated.' },\n          { t: 'It uses exists', ok: false, fb: 'exists is usually used with one, but the correlation is the reference to the outer query.' }],\n        hint: 'Look for a column of the outer table inside the inner where clause.',\n        angle: 'In the example above, h.CustomerID = c.CustomerID names c, which belongs to the outer query.',\n        explain: 'A correlated subquery depends on the outer query and cannot be run alone. Each time the outer query processes a row, the inner query is evaluated again for that row.' },\n      { id: 'q6c', kind: 'Branching', stem: 'When does the exists operator return TRUE?',\n        opts: [\n          { t: 'As soon as the subquery returns at least one record', ok: true, fb: 'Correct. It tests existence only, and stops at the first hit.' },\n          { t: 'Only if the subquery returns exactly one record', ok: false, fb: 'Choose this and you would reject customers with several orders. One or more is enough.' },\n          { t: 'Only if the subquery returns no records', ok: false, fb: 'That is not exists.' }],\n        hint: 'The clue is in the word: does anything exist?',\n        angle: 'It never looks at the values the subquery returns, only whether there are any.',\n        explain: 'exists tests for the existence of any record in the subquery and returns TRUE if there is one or more. Because it stops at the first hit it is often faster than in.' },\n      { id: 'q6d', kind: 'Multiple choice', stem: 'You declare a CTE, run a select that uses it, then run a second select using the same name. What happens?',\n        opts: [\n          { t: 'The second query fails, the CTE is gone', ok: true, fb: 'Correct. A CTE may be referred to only in the query written immediately after it.' },\n          { t: 'It works, the CTE stays for the whole session', ok: false, fb: 'You would get an invalid object name error. A CTE is not a table or a view.' },\n          { t: 'It works, but returns no rows', ok: false, fb: 'No. It is not an empty result, it is an error about an unknown name.' },\n          { t: 'It works only if the CTE has column aliases', ok: false, fb: 'Aliases affect naming, not lifetime.' }],\n        hint: 'How long does the name survive?',\n        angle: 'Compare it with a view, which is stored, or a temp table, which lasts for the session.',\n        explain: 'A CTE is a named set of temporary results, available only to the query immediately following its with clause. The same query may call it several times, and several CTEs may be declared together, separated by commas.' }\n    ]\n  ];\n\n  AI = [\n    [\n      { l: 'Explain it simply', t: 'Think of a database as a set of spreadsheets that know about each other. Each sheet is a table for one kind of thing: customers, orders, items. A column is a field, a row is a record. One column is chosen as the Primary Key so each row can be picked out with no confusion. When another sheet needs to point at that row, it copies the key into a column of its own, and that copy is the Foreign Key.' },\n      { l: 'Give me an example', t: 'Sales.Customer has CustomerID as its Primary Key. Sales.SalesOrderHeader stores
