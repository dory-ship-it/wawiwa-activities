<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit feedback · Wawiwa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
body{margin:0;background:#0C2233}
a{color:#007681}a:hover{color:#0C2233}
.bx *{box-sizing:border-box}
.bx button,.bx input,.bx textarea{font-family:inherit}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{min-height:100vh;display:flex;flex-direction:column;background:#0C2233;color:#0C2233;font-family:Roboto,'Helvetica Neue',Helvetica,sans-serif}
.stage{position:relative;background:#0C2233;color:#FFFFFF;display:flex;flex-direction:column}
.hdr{padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.unit{margin:0;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#FFFFFF;text-align:right}
.unit span{color:#2FC3D4}
.prog{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.prog[hidden]{display:none}
.prog-txt{margin:0;font-size:15px;font-weight:700;color:#FFFFFF}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i{display:block;height:100%;background:#EE3124;border-radius:3px;transition:width .4s ease}
.photo{position:relative;height:250px;overflow:hidden;background:#0C2233}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:bx-ph .7s ease-out both}
.art{display:grid;place-items:center;background-color:#0C2233;background-image:radial-gradient(rgba(255,255,255,.08) 1.4px,transparent 1.6px);background-size:22px 22px;animation:none}
.art svg{width:88%;max-width:460px;height:auto;max-height:88%;display:block;animation:bx-pop .5s ease-out both}
.art svg.pa{animation:bx-swapA .45s cubic-bezier(.2,.9,.3,1.3) both}
.art svg.pb{animation:bx-swapB .45s cubic-bezier(.2,.9,.3,1.3) both}
.brush{position:absolute;left:-3%;width:106%;bottom:18px;height:74px;pointer-events:none}
.sheet{flex:1;position:relative;margin-top:-26px;background:#FFFFFF;border-radius:26px 26px 0 0;padding:28px 18px 28px;display:flex;flex-direction:column}
.inner{width:100%;max-width:620px;margin:0 auto;flex:1;display:flex;flex-direction:column}
.q-title{margin:0;font-size:26px;line-height:1.2;font-weight:900;letter-spacing:-0.5px;color:#0C2233;text-wrap:balance;outline:none}
.q-sub{margin:8px 0 0;font-size:15px;font-weight:500;color:#3A4555}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.opt input:focus-visible + .face{outline:3px solid #0097A7;outline-offset:3px}
.opt input:disabled + .face{opacity:.4;cursor:not-allowed}
.chip .face,.seg .face,.tile .face{border:2px solid #0C2233;background:#FFFFFF;color:#0C2233;transition:border-color .15s ease,background-color .15s ease,color .15s ease,transform .12s ease}
.chip:hover .face,.seg:hover .face,.tile:hover .face{border-color:#EE3124}
.opt:active .face{transform:scale(.98)}
.chip input:checked + .face,.seg input:checked + .face,.tile input:checked + .face{background:#007681;border-color:#007681;color:#FFFFFF}
.chip .face{min-height:46px;padding:10px 14px;border-radius:10px;font-size:15px;font-weight:700;line-height:1.3;display:flex;align-items:center;gap:8px}
.chk{display:none;width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chip input:checked + .face .chk{display:block}
.star .face{width:58px;height:58px;display:grid;place-items:center;transition:transform .15s ease}
.star:hover .face{transform:translateY(-2px)}
.star svg{width:52px;height:52px;fill:#FFFFFF;stroke:#0C2233;stroke-width:1.6;stroke-linejoin:round;transition:fill .15s ease}
.star.on svg{fill:#EE3124}
.star.pop svg{animation:bx-pop .35s cubic-bezier(.2,.9,.3,1.4)}
.kf-list{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.kf-row{border:0;margin:0;padding:14px;border-radius:10px;background:#F5F7F8;min-width:0;transition:background-color .15s ease}
.kf-in{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:center}
.kf-label{margin:0;font-size:17px;font-weight:900;color:#0C2233}
.kf-toggle{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;transition:opacity .15s ease}
.seg .face{min-height:50px;padding:8px 10px;border-radius:10px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.kf-fix input:checked + .face{background:#0C2233;border-color:#0C2233}
.kf-row.na .kf-toggle{opacity:.45}
.kf-na{display:inline-flex;align-items:center;gap:6px;margin-top:4px;min-height:40px;padding:0 4px;background:none;border:0;color:#007681;font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.kf-na.on{padding:0 12px;border-radius:8px;background:#007681;color:#FFFFFF;text-decoration:none}
.kf-na:focus-visible{outline:3px solid #0097A7;outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
.tile .face{height:100%;min-height:88px;padding:12px;border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-size:15px;font-weight:700;line-height:1.3}
.tile .num{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 6px;border-radius:6px;background:#E6F4F6;color:#0C2233;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;flex:none}
.tile input:checked + .face .num{background:#2FC3D4}
.tile.none{grid-column:1 / -1}
.tile.none .face{min-height:56px;flex-direction:row;align-items:center;justify-content:flex-start;border-style:dashed}
.tile.none input:checked + .face{border-style:solid}
.dur-label{margin:0;min-height:74px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:36px;line-height:1.1;font-weight:900;letter-spacing:-1px;color:#0C2233}
.dur-label.unset{font-size:18px;font-weight:700;letter-spacing:0;color:#5E6A79}
.stop{position:absolute;top:18px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#FFFFFF;border:2px solid #CBD5DB}
.stop.on{border-color:#EE3124;background:#EE3124}
.ticks{position:relative;height:40px;margin-top:6px}
.ticks span{position:absolute;top:0;width:84px;font-size:13px;line-height:1.25;font-weight:700;color:#3A4555;text-align:center;transform:translateX(-50%)}
.ticks span.cur{color:#0C2233}
.range{-webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;height:48px;margin:0;background:transparent;cursor:pointer}
.range::-webkit-slider-runnable-track{height:48px;background:transparent}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:7px;border-radius:50%;background:#FFFFFF;border:4px solid #EE3124;box-shadow:0 2px 6px rgba(12,34,51,.25)}
.range::-moz-range-track{background:transparent}
.range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#FFFFFF;border:4px solid #EE3124}
.range.unset::-webkit-slider-thumb{border-color:#5E6A79}
.range.unset::-moz-range-thumb{border-color:#5E6A79}
.range:focus-visible{outline:3px solid #0097A7;outline-offset:4px;border-radius:12px}
.yn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
.yn-btn{min-height:128px;padding:14px 10px;border-radius:10px;border:2px solid #0C2233;background:#FFFFFF;color:#0C2233;font-size:18px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:border-color .15s ease,background-color .15s ease,color .15s ease,transform .12s ease}
.yn-btn:hover{border-color:#EE3124}
.yn-btn:active{transform:scale(.98)}
.yn-btn .yn-ic{width:52px;height:52px;border-radius:50%;background:#E6F4F6;display:grid;place-items:center}
.yn-btn.on-no{background:#007681;border-color:#007681;color:#FFFFFF}
.yn-btn.on-yes{background:#0C2233;border-color:#0C2233;color:#FFFFFF}
.yn-btn.on-no .yn-ic,.yn-btn.on-yes .yn-ic{background:#FFFFFF;color:#0C2233}
.yn-btn:focus-visible{outline:3px solid #0097A7;outline-offset:3px}
.btn{min-height:52px;padding:0 22px;border-radius:10px;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:19px;font-weight:700;cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .12s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:#EE3124;color:#FFFFFF}
.btn-primary:hover{background:#C9221A}
.btn-primary:disabled{background:#E3E9EC;color:#5E6A79;cursor:not-allowed;transform:none}
.btn-primary.busy:disabled{background:#0C2233;color:#FFFFFF;cursor:progress}
.btn-ghost{background:#FFFFFF;color:#0C2233;border-color:#0C2233}
.btn-ghost:hover{background:#0C2233;color:#FFFFFF}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed}
.link-btn{min-height:44px;padding:0 8px;background:none;border:0;color:#007681;font-size:16px;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer}
.link-btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.link-btn:focus-visible{outline:3px solid #0097A7;outline-offset:3px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#FFFFFF;animation:bx-rot .8s linear infinite}
.bx textarea{width:100%;border:2px solid #0C2233;border-radius:10px;background:#FFFFFF;color:#0C2233;font-size:16px;min-height:160px;padding:14px 16px;line-height:1.5;resize:vertical}
.bx textarea:focus-visible{outline:3px solid #0097A7;outline-offset:3px}
.bx textarea::placeholder{color:#5E6A79}
.screen{flex:1 0 auto;display:flex;flex-direction:column;justify-content:safe center}
.wl-top{margin-top:auto !important}
.screen.fwd{animation:bx-in-fwd .28s ease-out both}
.screen.back{animation:bx-in-back .28s ease-out both}
.reveal{animation:bx-in-fwd .22s ease-out both}
@keyframes bx-in-fwd{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes bx-in-back{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
@keyframes bx-pop{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:none}}
@keyframes bx-swapA{0%{opacity:0;transform:scale(.9) translateY(8px)}100%{opacity:1;transform:none}}
@keyframes bx-swapB{0%{opacity:0;transform:scale(.9) translateY(8px)}100%{opacity:1;transform:none}}
@keyframes bx-ph{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@keyframes bx-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.bx *{animation:none !important;transition:none !important}}
/* phone: keep every screen inside one viewport */
.hdr{padding:10px 16px 8px}
.prog{padding:0 16px 10px;gap:6px}
.photo{height:112px}
.photo.tall{height:250px}
.photo:not(.tall) .brush{display:none}
.photo:not(.tall) .art{place-items:start center;padding-top:4px}
.photo:not(.tall) .art svg{width:117px;height:80px;max-width:none;max-height:none}
.bx.app{overflow-x:clip}
.inner,.screen{min-width:0}
.dur-label{min-height:56px;font-size:32px}
.ticks{height:36px}
.ticks span{width:72px;font-size:12px}
.sheet{padding:24px 18px 20px}
.q-title{font-size:24px}
.kf-list{gap:8px;margin-top:16px}
.kf-row{padding:10px 12px}
.kf-in{grid-template-columns:minmax(0,1fr) 208px;gap:10px}
.kf-label{font-size:15px;line-height:1.3}
.kf-toggle .seg .face{min-height:52px;padding:6px 4px;flex-direction:column;gap:2px;font-size:13px;line-height:1.2}
.kf-toggle .seg .ico{width:18px;height:18px}
.tiles{gap:8px;margin-top:16px}
.tile .face{min-height:56px;padding:8px 10px;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;font-size:14px}
.yn-btn{min-height:96px}
@media (max-width: 360px){.kf-in{grid-template-columns:minmax(0,1fr)}}
@media (min-width: 900px){
.app{flex-direction:row}
.photo.tall{height:auto}
.photo:not(.tall) .brush{display:block;height:96px;bottom:22px}
.photo:not(.tall) .art{place-items:center;padding-top:0}
.photo:not(.tall) .art svg{width:88%;height:auto;max-width:460px;max-height:88%}
.kf-label{font-size:17px}
.kf-toggle .seg .face{min-height:50px;padding:8px 10px;flex-direction:row;gap:8px;font-size:15px}
.kf-toggle .seg .ico{width:20px;height:20px}
.tile .face{min-height:88px;padding:12px;flex-direction:column;align-items:stretch;justify-content:space-between;gap:10px;font-size:15px}
.tile.none .face{min-height:56px;flex-direction:row;align-items:center;justify-content:flex-start}
.tile .num{align-self:flex-start}
.stage{width:44%;max-width:640px;flex:none;position:sticky;top:0;align-self:flex-start;height:100vh}
.hdr{padding:24px 32px 14px}
.prog{padding:0 32px 22px}
.photo{flex:1;height:auto}
.brush{bottom:22px;height:96px}
.sheet{margin-top:0;border-radius:0;padding:64px 56px 48px;min-height:100vh}
.inner{max-width:640px;justify-content:center}
.q-title{font-size:36px;letter-spacing:-1px}
.wl-h{font-size:54px !important;letter-spacing:-1.6px !important}
.wl-top{margin-top:0 !important}
.wl-btn{margin-top:14px !important;width:auto !important;align-self:flex-start;min-width:260px}
.star .face{width:76px;height:76px}
.star svg{width:68px;height:68px}
.kf-in{grid-template-columns:minmax(0,1fr) minmax(0,360px)}
.kf-row{padding:14px 16px}
.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
.dur-label{font-size:48px;min-height:96px}
.ticks{height:40px}
.ticks span{width:84px;font-size:13px}
.yn-btn{min-height:160px;font-size:20px}
}
</style>
</head>

      st += '<label class="opt star' + (S.q1 >= n ? ' on' : '') + (S.q1 === n ? ' pop' : '') + '"><input type="radio" name="sq1" value="' + n + '" data-k="q1-' + n + '"' + (S.q1 === n ? ' checked' : '') + '><span class="face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + STAR_PATH + '"></path></svg><span class="sr">' + esc(n === 1 ? L.star1 : fmt(L.starN, n)) + '</span></span></label>';
    }
    return '<section class="screen" aria-labelledby="h-q1"><fieldset style="border:0;margin:0;padding:0;min-width:0"><legend class="sr">' + esc(L.q1) + '</legend>' +
      '<h1 id="h-q1" class="q-title" tabindex="-1">' + esc(L.q1) + '</h1>' +
      '<div style="display:flex;justify-content:center;gap:4px;margin-top:30px">' + st + '</div>' +
      '<p aria-hidden="true" style="margin:14px 0 0;min-height:22px;text-align:center;font-size:15px;font-weight:900;color:#0C2233">' + (S.q1 ? esc(fmt(L.outOf, S.q1)) : '') + '</p>' +
      '</fieldset></section>';
  }
  if (k === 'q3') {
    var tiles = U.topics.map(function (t, i) {
      return '<label class="opt tile"><input type="radio" name="sq3" data-k="q3-' + i + '" data-q3="' + esc(t) + '"' + (S.q3 === t ? ' checked' : '') + '><span class="face"><span class="num" aria-hidden="true">' + (i < 9 ? '0' : '') + (i + 1) + '</span><span>' + esc(t) + '</span></span></label>';
    }).join('');
    tiles += '<label class="opt tile none"><input type="radio" name="sq3" data-k="q3-none" data-q3="' + esc(NONE_EN) + '"' + (S.q3 === NONE_EN ? ' checked' : '') + '><span class="face"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.6"><path d="M6 12.5l4 4L18 8"></path></svg><span>' + esc(L.none) + '</span></span></label>';
    return '<section class="screen" aria-labelledby="h-q3"><fieldset style="border:0;margin:0;padding:0;min-width:0"><legend class="sr">' + esc(L.q3 + ' ' + L.pickOne) + '</legend>' +
      '<h1 id="h-q3" class="q-title" tabindex="-1">' + esc(L.q3) + '</h1><p class="q-sub">' + esc(L.pickOne) + '</p><div class="tiles">' + tiles + '</div></fieldset>' + whyHTML() + '</section>';
  }
  if (k === 'q4') {
    var stops = '', ticks = '';
    L.dur.forEach(function (label, i) {
      stops += '<span class="stop" data-stop="' + i + '" aria-hidden="true" style="left:calc(17px + (100% - 34px) * ' + (i / 3) + ')"></span>';
      var pos = i === 0 ? 'left:0;transform:none;text-align:left' : (i === 3 ? 'left:auto;right:0;transform:none;text-align:right' : 'left:calc(17px + (100% - 34px) * ' + (i / 3) + ')');
      ticks += '<span data-tick="' + i + '" style="' + pos + '">' + esc(label) + '</span>';
    });
    return '<section class="screen" aria-labelledby="h-q4"><h1 id="h-q4" class="q-title" tabindex="-1">' + esc(L.q4) + '</h1>' +
      '<p class="dur-label" id="durLabel" aria-hidden="true" style="margin-top:24px"></p>' +
      '<div style="position:relative;height:48px;margin-top:8px">' +
      '<div aria-hidden="true" style="position:absolute;left:17px;right:17px;top:20px;height:8px;border-radius:999px;background:#E3E9EC"></div>' +
      '<div id="durFill" aria-hidden="true" style="position:absolute;left:17px;top:20px;height:8px;border-radius:999px;background:#EE3124;width:0;transition:width .15s ease"></div>' +
      stops +
      '<input type="range" min="0" max="3" step="1" id="durRange" class="range" aria-labelledby="h-q4">' +
      '</div><div class="ticks" aria-hidden="true">' + ticks + '</div></section>';
  }
  if (k === 'q5') {
    var chips = '';
    if (S.q5 === 'yes') {
      chips = '<fieldset class="reveal" style="border:0;margin:22px 0 0;padding:0;min-width:0"><legend style="padding:0;font-size:15px;font-weight:700;color:#0C2233">' + esc(L.whatGotInWay) + ' <span style="font-weight:500;color:#3A4555">' + esc(L.selectAll) + '</span></legend><div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px">' +
        Q5K.map(function (key) {
          return '<label class="opt chip"><input type="checkbox" data-k="q5-' + key + '" data-q5="' + key + '"' + (S.q5items.indexOf(key) >= 0 ? ' checked' : '') + '><span class="face">' + ico(key) + esc(L.q5items[key]) + CHK + '</span></label>';
        }).join('') + '</div></fieldset>';
    }
    return '<section class="screen" aria-labelledby="h-q5"><h1 id="h-q5" class="q-title" tabindex="-1">' + esc(L.q5) + '</h1>' +
      '<div class="yn" role="group" aria-labelledby="h-q5">' +
      '<button type="button" class="yn-btn' + (S.q5 === 'no' ? ' on-no' : '') + '" aria-pressed="' + (S.q5 === 'no') + '" data-k="q5-no" data-act="q5no"><span class="yn-ic"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:28px;height:28px;stroke-width:2.6">' + ICON.check + '</svg></span>' + esc(L.noAllGood) + '</button>' +
      '<button type="button" class="yn-btn' + (S.q5 === 'yes' ? ' on-yes' : '') + '" aria-pressed="' + (S.q5 === 'yes') + '" data-k="q5-yes" data-act="q5yes"><span class="yn-ic"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:28px;height:28px;stroke-width:2.4"><path d="M12 4 L21 19.5 H3 Z"></path><path d="M12 10 v4.5"></path><circle cx="12" cy="17" r=".6"></circle></svg></span>' + esc(L.yes) + '</button>' +
      '</div>' + chips + '</section>';
  }
  if (k === 'comment') {
    return '<section class="screen" aria-labelledby="h-comment"><h1 id="h-comment" class="q-title" tabindex="-1">' + esc(L.comment) + '</h1>' +
      '<p class="q-sub" id="sx-comment-sub">' + esc(L.optional) + '</p>' +
      '<label for="sx-comment" class="sr">' + esc(L.comment + ' ' + L.optional) + '</label>' +
      '<textarea id="sx-comment" maxlength="1000" placeholder="' + esc(L.placeholder) + '" aria-describedby="sx-comment-sub"' + (S.sending ? ' readonly' : '') + ' style="margin-top:20px;display:block">' + esc(S.comment) + '</textarea>' +
      (S.sendError ? '<div class="reveal" role="alert" style="margin-top:18px;padding:14px 16px;border-radius:10px;background:#FDECEA;border:2px solid #EE3124;border-left-width:6px;color:#0C2233;display:flex;align-items:flex-start;gap:12px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="margin-top:1px;color:#C9221A;stroke-width:2.4"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg><p style="margin:0;font-size:16px;line-height:1.45;font-weight:700">' + esc(L.sendError) + '</p></div>' : '') +
      '</section>';
  }
  /* thanks */
  return '<section class="screen" aria-labelledby="h-thanks" style="gap:14px;text-align:center;align-items:center">' +
    '<div aria-hidden="true" style="width:128px;height:128px;border-radius:50%;background:#E6F4F6;border:4px solid #2FC3D4;display:grid;place-items:center;animation:bx-pop .5s .15s cubic-bezier(.2,.9,.3,1.3) both">' + BOT + '</div>' +
    '<h1 id="h-thanks" class="q-title" tabindex="-1" style="font-size:44px;letter-spacing:-1.2px">' + esc(L.thanks) + '</h1>' +
    (S.already ? '<p style="margin:0;max-width:360px;font-size:18px;line-height:1.5;font-weight:700;color:#0C2233">' + esc(L.already) + '</p>' : '') +
    '<p style="margin:0;max-width:360px;font-size:18px;line-height:1.5;font-weight:500;color:#1F2C36">' + esc(L.thanksBody) + '</p>' +
    '<p style="margin:6px 0 0;max-width:360px;font-size:15px;line-height:1.5;font-weight:500;color:#3A4555">' + esc(L.closeTab) + '</p>' +
    '</section>';
}

function whyHTML() {
  if (!S.q3 || S.q3 === NONE_EN) return '';
  var full = S.why.length >= 2;
  return '<fieldset id="whyBox" class="' + (S.whyNew ? 'reveal' : '') + '" style="border:0;margin:24px 0 0;padding:16px 14px;border-radius:10px;background:#F5F7F8;min-width:0">' +
    '<legend class="sr">' + esc(L.whyHard + ' ' + L.upTo2) + '</legend>' +
    '<p style="margin:0;font-size:18px;font-weight:900;color:#0C2233">' + esc(L.whyHard) + ' <span style="font-size:14px;font-weight:500;color:#3A4555">' + esc(L.upTo2) + '</span></p>' +
    '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">' +
    WHY_K.map(function (k) {
      var on = S.why.indexOf(k) >= 0;
      return '<label class="opt chip"><input type="checkbox" data-k="why-' + k + '" data-why="' + k + '"' + (on ? ' checked' : '') + (full && !on ? ' disabled' : '') + '><span class="face" style="justify-content:space-between">' + esc(L.why[k]) + CHK + '</span></label>';
    }).join('') + '</div></fieldset>';
}

function navHTML() {
  var cur = S.screen;
  if (cur < 1 || cur > 5) return '';
  var showNext = cur <= 4 && (SCREENS[cur] !== 'q5' || S.q5 === 'yes');
  var html = '<div style="margin-top:28px;padding-top:4px;display:flex;align-items:center;justify-content:space-between;gap:12px">' +
    '<button type="button" class="btn btn-ghost" data-act="back"' + (S.sending ? ' disabled' : '') + ' style="padding:0 18px 0 14px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.6"><path d="M15 6l-6 6 6 6"></path></svg>' + esc(L.back) + '</button>';
  if (showNext) {
    html += '<button type="button" class="btn btn-primary" data-act="next" id="nextBtn"' + (answered(cur) ? '' : ' disabled') + ' style="min-width:132px;padding:0 18px 0 26px">' + esc(L.next) + '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.6"><path d="M9 6l6 6-6 6"></path></svg></button>';
  }
  if (cur === 5) {
    var label = S.sending ? '<span class="spin" aria-hidden="true"></span>' + esc(L.sending)
      : (S.sendError ? '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.6">' + ICON.load + '</svg>' + esc(L.tryAgain) : esc(L.send));
    html += '<div style="display:flex;align-items:center;gap:8px">' +
      (!S.sendError ? '<button type="button" class="link-btn" data-act="skip"' + (S.sending ? ' disabled' : '') + '>' + esc(L.skip) + '</button>' : '') +
      '<button type="button" class="btn btn-primary' + (S.sending ? ' busy' : '') + '" data-act="send"' + (S.sending ? ' disabled' : '') + '>' + label + '</button></div>';
  }
  return html + '</div>';
}

function setLive(msg) { $('live').textContent = msg || ''; }

/* Full render. animate = 'fwd' | 'back' | null (null = same screen, keep focus) */
function render(animate) {
  var activeKey = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-k');
  $('screenHost').innerHTML = screenHTML();
  $('nav').innerHTML = navHTML();
  renderStage();
  var sec = $('screenHost').querySelector('.screen');
  if (animate && sec) sec.classList.add(animate);
  if (SCREENS[S.screen] === 'q4') wireRange();
  if (animate) {
    setTimeout(function () {
      var h = $('screenHost').querySelector('h1');
      if (h) { try { h.focus({ preventScroll: true }); } catch (e) {} }
      try { window.scrollTo(0, 0); } catch (e) {}
    }, 30);
  } else if (activeKey) {
    var el = document.querySelector('[data-k="' + activeKey + '"]');
    if (el) { try { el.focus({ preventScroll: true }); } catch (e) {} }
  }
}
function updateNext() { var b = $('nextBtn'); if (b) b.disabled = !answered(S.screen); }

function go(n, dir) {
  S.screen = n;
  setLive(n >= 1 && n <= 4 ? fmt(L.progress, n) : (n === 5 ? L.progressOpt : (n === 6 ? L.thanks : '')));
  renderArt();
  render(dir);
}

/* ---------- Q4 slider (patched in place so dragging is smooth) ---------- */
function wireRange() {
  var r = $('durRange');
  function paint() {
    var d = S.q4;
    r.value = d === null ? 0 : d;
    r.className = 'range' + (d === null ? ' unset' : '');
    r.setAttribute('aria-valuetext', d === null ? L.notChosen : L.dur[d]);
    var lab = $('durLabel');
    lab.textContent = d === null ? L.dragToChoose : L.dur[d];
    lab.className = 'dur-label' + (d === null ? ' unset' : '');
    $('durFill').style.width = 'calc((100% - 34px) * ' + (d === null ? 0 : d / 3) + ')';
    document.querySelectorAll('[data-stop]').forEach(function (s) { var i = +s.getAttribute('data-stop'); s.className = 'stop' + (d !== null && i <= d ? ' on' : ''); });
    document.querySelectorAll('[data-tick]').forEach(function (s) { var i = +s.getAttribute('data-tick'); s.className = d !== null && i === d ? 'on cur' : (d !== null && i < d ? 'on' : ''); });
    updateNext();
  }
  function set() { var n = parseInt(r.value, 10); if (n >= 0 && n <= 3) { S.q4 = n; paint(); } }
  r.addEventListener('input', set);
  r.addEventListener('change', set);
  r.addEventListener('click', set);
  paint();
}

/* ---------- Sending ---------- */
function payload(withComment) {
  return {
    unit: unitKey, unitName: U.name, lang: lang,
    overall: S.q1,
    hardestTopic: S.q3,
    whyHard: S.q3 && S.q3 !== NONE_EN ? S.why.map(function (k) { return WHY_EN[k]; }).join('; ') : '',
    timePerLesson: S.q4 === null ? '' : DUR_EN[S.q4],
    technicalIssue: S.q5 === 'yes' ? 'Yes' : 'No',
    issues: S.q5 === 'yes' ? S.q5items.map(function (k) { return Q5_EN[k]; }).join('; ') : '',
    comment: withComment ? S.comment.trim().slice(0, 1000) : ''
  };
}
function send(withComment) {
  if (S.sending) return;
  if (!withComment) S.comment = '';
  S.sending = true; S.sendError = false;
  setLive(L.liveSending);
  render(null);
  function ok() { S.sending = false; S.sendError = false; markSent(); go(6, 'fwd'); }
  function fail() { S.sending = false; S.sendError = true; setLive(L.liveFailed); render(null); }
  if (PREVIEW) { try { console.info('[feedback preview] would send:', payload(withComment)); } catch (e) {} setTimeout(ok, 900); return; }
  var body = JSON.stringify(payload(withComment));
  function attempt(n) {
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);
    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: body,
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        clearTimeout(t);
        if (res && res.ok) ok(); else throw new Error('not saved');
      })
      .catch(function () {
        clearTimeout(t);
        if (n < 2) setTimeout(function () { attempt(n + 1); }, 1500); else fail();
      });
  }
  attempt(1);
}

/* ---------- Events (delegated) ---------- */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var a = b.getAttribute('data-act'), cur = S.screen;
  if (a === 'start') go(1, 'fwd');
  else if (a === 'back') { if (cur > 0 && !S.sending) { S.sendError = false; go(cur - 1, 'back'); } }
  else if (a === 'next') { if (answered(cur) && cur < 5) go(cur + 1, 'fwd'); }
  else if (a === 'q5no') {
    S.q5 = 'no'; S.q5items = []; render(null);
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { go(5, 'fwd'); }, 260);
  }
  else if (a === 'q5yes') { S.q5 = 'yes'; setLive(L.liveChoose); render(null); }
  else if (a === 'send') send(true);
  else if (a === 'skip') send(false);
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.name === 'sq1') { S.q1 = +el.value; S.pulse++; renderArt(); render(null); }
  else if (el.hasAttribute('data-q3')) {
    var was = S.q3, v = el.getAttribute('data-q3');
    S.q3 = v;
    if (v === NONE_EN) S.why = [];
    S.whyNew = v !== NONE_EN && (!was || was === NONE_EN);
    render(null);
    S.whyNew = false;
    var box = $('whyBox');
    if (box && (!was || was === NONE_EN)) { try { box.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {} }
  }
  else if (el.hasAttribute('data-why')) {
    var w = el.getAttribute('data-why');
    S.why = S.why.filter(function (x) { return x !== w; });
    if (el.checked && S.why.length < 2) S.why.push(w);
    render(null);
  }
  else if (el.hasAttribute('data-q5')) {
    var k = el.getAttribute('data-q5');
    S.q5items = S.q5items.filter(function (x) { return x !== k; });
    if (el.checked) S.q5items.push(k);
    updateNext();
  }
});
document.addEventListener('input', function (e) { if (e.target.id === 'sx-comment') S.comment = e.target.value; });

/* ---------- Start ---------- */
var unitLine = $('unitLine');
if (!U) {
  unitLine.textContent = L.unitSuffix;
  $('photoArt').innerHTML = '<img class="ph" src="' + PHOTO + '" alt="" style="object-position:62% 30%">';
  $('screenHost').innerHTML = '<section class="screen"><h1 class="q-title">' + esc(L.badLink) + '</h1></section>';
  return;
}
unitLine.innerHTML = esc(U.name) + ' <span aria-hidden="true">·</span> ' + esc(L.unitSuffix);
document.title = U.name + ' · ' + L.unitSuffix + ' · Wawiwa';
if (alreadySent()) { S.already = true; S.screen = 6; }
renderArt();
render(null);
})();
</script>
</body>
</html>
