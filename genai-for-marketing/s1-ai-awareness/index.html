<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>AI Awareness · Generative AI for Marketing Professionals</title>
<link rel="stylesheet" href="src/fonts.css">
<link rel="stylesheet" href="src/frame.css">
<style>
  /* cover START button (original: vertical gradient #7CD1CC→#359488, 1px 40% black stroke,
     drop shadow 4px down, Open Sans Bold 28pt white with a 0.8px #969696 shadow) */
  .start-btn { position: absolute; margin: 0; padding: 0; cursor: pointer; border: 1px solid rgba(0,0,0,.4); border-radius: 0;
    background: linear-gradient(180deg, #7CD1CC 0%, #359488 100%); box-shadow: 0 4px 3.5px rgba(0,0,0,.29);
    font-family: var(--font-open-sans-bold); font-size: 37.33px; line-height: 1; color: #fff; text-shadow: .8px .8px #969696; }
  .start-btn:hover, .start-btn:focus-visible { background: linear-gradient(180deg, #B5D9D5 0%, #53A79D 100%); outline: none; }
  .start-btn:active { background: linear-gradient(180deg, #6BC4BF 0%, #2E756A 100%); }
  .start-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #boot-error { position: fixed; inset: 0; display: none; place-items: center; color: #BABBBA; font: 14px/1.5 Lato, sans-serif; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div id="player"></div>
<div id="boot-error"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
