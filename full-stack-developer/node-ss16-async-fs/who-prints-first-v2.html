:root{
  --bg:#0D1626; --s1:#132036; --s2:#1A2A44; --line:#25395A;
  --tx:#EEF3F9; --tx2:#B4C4D6; --mut:#8EA2B9;
  --teal:#5AB3AA; --teal2:#7ED3C9; --red:#D62A1E; --ok:#7FDC86; --warn:#F0B44C;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Assistant',sans-serif;font-size:18px;line-height:1.55;overflow:hidden}
:focus-visible{outline:3px solid var(--teal2);outline-offset:3px;border-radius:8px}
.sr{position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
code,.m{font-family:var(--mono);font-variant-ligatures:none}
code{font-size:.86em;color:#F1C27D}
.app{height:100vh;display:flex;flex-direction:column}
/* header */
.hd{flex:0 0 64px;display:flex;align-items:center;gap:16px;padding:0 36px;border-bottom:1px solid var(--line)}
.hd svg{width:70px;height:auto}
.hd .nm{font-family:Roboto,sans-serif;font-weight:700;font-size:16px;color:var(--tx)}
.hd .nm small{display:block;font-weight:400;font-size:11.5px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.steps{margin-left:auto;display:flex;gap:26px;font-family:Roboto,sans-serif;font-size:14px;color:var(--mut)}
.steps span{padding:20px 0;border-bottom:2px solid transparent}
.steps span.on{color:var(--tx);border-color:var(--teal)}
.steps span.done{color:var(--teal2)}
/* main */
.main{flex:1;min-height:0;overflow:auto;padding:30px 36px 0}
.ey{font-family:Roboto,sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal2);margin:0}
h1{font-family:Roboto,sans-serif;font-weight:700;font-size:30px;line-height:1.2;margin:8px 0 6px;color:var(--tx)}
.sub{color:var(--tx2);margin:0 0 24px;max-width:62ch}
.g2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
.g2.even{grid-template-columns:1fr 1fr}
/* code */
.codebox{background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.codebox .ttl{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font-family:Roboto,sans-serif;font-size:13px;color:var(--mut)}
.codebox ol{list-style:none;margin:0;padding:10px 0;font-family:var(--mono);font-size:12.5px;line-height:1.72;font-variant-ligatures:none;counter-reset:n}
.codebox li{display:flex;padding:0 14px 0 10px;border-left:3px solid transparent;white-space:pre}
.codebox li::before{counter-increment:n;content:counter(n);width:24px;margin-right:12px;text-align:right;color:#5B7090}
.codebox li .t{white-space:pre;overflow:hidden}
.codebox li.hl{background:rgba(90,179,170,.12);border-left-color:var(--teal)}
.codebox li.hw{background:rgba(240,180,76,.13);border-left-color:var(--warn)}
.s{color:#F1C27D}.f{color:#8FC6FF}.k{color:#C8A2FF}
/* order rows */
.qt{font-family:Roboto,sans-serif;font-weight:700;font-size:17px;margin:0 0 4px}
.qh{color:var(--mut);font-size:15px;margin:0 0 14px}
.rows{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--s1);color:var(--tx);font-family:var(--mono);font-size:15px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--teal)}
.row .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.row .num{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1.5px dashed #4A6285;display:flex;align-items:center;justify-content:center;font-family:Roboto,sans-serif;font-weight:700;font-size:14px;color:transparent}
.row.on{border-color:var(--teal);background:rgba(90,179,170,.10)}
.row.on .num{border:0;background:var(--teal);color:#0D1626}
.reset{background:none;border:0;color:var(--tx2);font-size:15px;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.err{color:#FF9C92;font-size:15px;margin:8px 0 0}
/* choice cards */
.choices{display:grid;gap:12px}
.choice{display:flex;gap:16px;align-items:center;padding:16px 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--s1);cursor:pointer}
.choice:hover{border-color:var(--teal)}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice .rd{width:22px;height:22px;border-radius:50%;border:2px solid #5B7090;flex:0 0 auto}
.choice b{display:block;font-family:Roboto,sans-serif;font-size:17px}
.choice span.d{color:var(--tx2);font-size:15.5px}
.choice:has(input:checked){border-color:var(--teal);background:rgba(90,179,170,.10)}
.choice:has(input:checked) .rd{border-color:var(--teal);background:radial-gradient(var(--teal) 45%,transparent 50%)}
.choice:has(input:focus-visible){outline:3px solid var(--teal2);outline-offset:3px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pills .choice{padding:12px 18px;border-radius:999px}
.pills .choice b{font-size:15.5px;font-weight:500}
/* verdict cards */
.vcards{display:grid;gap:16px}
.vc{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.vc .top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.badge{font-family:Roboto,sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 12px}
.badge.ok{background:rgba(127,220,134,.15);color:var(--ok)}
.badge.no{background:rgba(240,180,76,.15);color:var(--warn)}
.vc h2{font-family:Roboto,sans-serif;font-size:19px;margin:0}
.vc p{margin:0;color:var(--tx2)}
.seqs{margin-top:12px;display:grid;gap:6px}
.seq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--mono);font-size:13.5px;color:var(--tx2)}
.seq .lb{font-family:Roboto,sans-serif;font-size:12.5px;color:var(--mut);width:52px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:999px;background:var(--s2);color:var(--tx);font-family:var(--mono);font-size:13px}
.chip i{width:8px;height:8px;border-radius:50%}
/* setup */
.stepsl{list-style:none;margin:0;padding:0;display:grid;gap:16px;counter-reset:s}
.stepsl li{display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:start;color:var(--tx2)}
.stepsl li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--s2);color:var(--tx);font-family:Roboto,sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center}
.stepsl b{color:var(--tx)}
.note{margin-top:22px;padding:14px 18px;border-radius:12px;background:rgba(240,180,76,.10);color:var(--tx);border:1px solid rgba(240,180,76,.35);font-size:16px}
.copy{background:var(--teal);color:#0D1626;border:0;border-radius:999px;padding:5px 14px;font-family:Roboto,sans-serif;font-weight:700;font-size:13px;cursor:pointer}
/* runs tracker */
.tracker{display:flex;gap:10px;margin:0 0 22px}
.tracker span{flex:1;height:6px;border-radius:3px;background:var(--s2)}
.tracker span.done{background:var(--teal)}
.tracker span.now{background:linear-gradient(90deg,var(--teal) 50%,var(--s2) 50%)}
/* compare */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.stat b{display:block;font-family:Roboto,sans-serif;font-size:40px;font-weight:700;line-height:1.05;color:var(--tx)}
.stat span{color:var(--tx2);font-size:15.5px}
.runlist{display:grid;gap:10px}
.runlist .seq .lb{width:60px}
.flag{font-family:Roboto,sans-serif;font-size:12px;font-weight:700;color:var(--warn);border:1px solid rgba(240,180,76,.45);border-radius:999px;padding:1px 9px}
.take{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.take .vc h2{font-size:18px;margin-bottom:6px}
/* footer */
.ft{flex:0 0 76px;display:flex;align-items:center;gap:18px;padding:0 36px;border-top:1px solid var(--line)}
.ft .pg{color:var(--mut);font-size:14px;font-family:Roboto,sans-serif;white-space:nowrap}
.ft .bar{flex:1;height:4px;border-radius:2px;background:var(--s2);overflow:hidden}
.ft .bar i{display:block;height:100%;background:var(--teal);transition:width .3s}
.btn{border:0;border-radius:999px;padding:13px 28px;font-family:Roboto,sans-serif;font-weight:700;font-size:16px;cursor:pointer;background:var(--red);color:#fff}
.btn:hover{background:#EE3124}
.btn[disabled]{background:#2A3B57;color:#8EA2B9;cursor:not-allowed}
.btn.gh{background:transparent;color:var(--tx2);border:1.5px solid var(--line)}
.btn.gh:hover{border-color:var(--teal);background:transparent}
@media (max-width:760px){body{overflow:auto}.app{height:auto}.g2,.g2.even,.stats,.take{grid-template-columns:1fr}.steps{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:920px){.codebox li{padding:0 4px 0 6px}.codebox ol{font-size:10.9px}.codebox li::before{width:18px;margin-right:8px}}
</style>

var LINES=['script end','mkdir finished','writeFile finished','unlink finished'];
var COL={'script end':'#7ED3C9','mkdir finished':'#F0B44C','writeFile finished':'#8FC6FF','unlink finished':'#FF8A80'};
var SAMPLES=[['script end','mkdir finished','unlink finished','writeFile finished'],['script end','writeFile finished','mkdir finished','unlink finished'],['script end','writeFile finished','unlink finished','mkdir finished']];
var CODE='const fs = require("fs");\n\nfs.mkdir("data", (err) => {\n  console.log("mkdir finished");\n  if (err) return;\n});\n\nfs.writeFile("data/info.txt", "Hello Async", (err) => {\n  console.log("writeFile finished");\n  if (err) return;\n});\n\nfs.unlink("data/info.txt", (err) => {\n  console.log("unlink finished");\n  if (err) return;\n});\n\nconsole.log("script end");';
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(l){var h=esc(l);h=h.replace(/"([^"]*)"/g,'<span class="s">"$1"</span>');h=h.replace(/\b(const|return|if)\b/g,'<span class="k">$1</span>');h=h.replace(/\b(require|mkdir|writeFile|unlink|log)\(/g,'<span class="f">$1</span>(');return h||' ';}
function codeBox(mode,extra){
  return '<div class="codebox"><div class="ttl"><span>index.js</span>'+(extra||'')+'</div><ol aria-label="index.js, line by line">'+CODE.split('\n').map(function(l,i){
    var c=''; if(mode==='log' && /console\.log/.test(l)) c='hl'; if(mode==='err' && /if \(err\)/.test(l)) c='hw';
    return '<li class="'+c+'"><span class="t">'+hl(l)+'</span></li>';}).join('')+'</ol></div>';
}
function short(l){return l.replace(' finished','');}
function chip(l){return '<span class="chip"><i style="background:'+COL[l]+'"></i>'+short(l)+'</span>';}
function seq(lb,o,flag){return '<div class="seq"><span class="lb">'+lb+'</span>'+o.map(chip).join('')+(flag?'<span class="flag">write before mkdir</span>':'')+'</div>';}
function key(o){return o.join('|');}
function wbm(o){return o.indexOf('writeFile finished')<o.indexOf('mkdir finished');}
function say(t){$('live').textContent='';setTimeout(function(){$('live').textContent=t;},40);}

/* screens */
var SC=['intro','order','error','feedback','setup'];for(var r=0;r<RUNS;r++)SC.push('run'+r);SC.push('compare','finish');
var cur=0, pred={order:[],err:null}, runs=[], score=0, temp={order:[],state:null}, checked=false;
function foot(label,disabled,back){
  $('pg').textContent=(cur+1)+' / '+SC.length;
  $('barI').style.width=Math.round(100*cur/(SC.length-1))+'%';
  var n=$('next');n.textContent=label;n.disabled=!!disabled;n.hidden=!label;
  $('back').hidden=!back;
}
function stepNav(i){[0,1,2].forEach(function(k){var e=$('st'+k);e.className=k===i?'on':(k<i?'done':'');if(k===i)e.setAttribute('aria-current','step');else e.removeAttribute('aria-current');});}
function go(i){cur=i;checked=false;$('main').scrollTop=0;render();$('main').focus();}
$('next').onclick=function(){handlers.next();};
$('back').onclick=function(){go(cur-1);};
var handlers={};

function orderPicker(arr,onch){
  var h='<div class="rows" role="group" aria-label="Lines, select in print order">';
  LINES.forEach(function(l){var p=arr.indexOf(l);h+='<button type="button" class="row'+(p>-1?' on':'')+'" data-l="'+l+'" aria-pressed="'+(p>-1)+'"><i class="dot" style="background:'+COL[l]+'"></i>'+l+'<span class="num" aria-hidden="true">'+(p>-1?p+1:'')+'</span>'+(p>-1?'<span class="sr">, position '+(p+1)+'</span>':'')+'</button>';});
  h+='</div><button type="button" class="reset" id="reset"'+(arr.length?'':' hidden')+'>Start the order again</button><p class="err" id="err" role="alert"></p>';
  return h;
}
function bindPicker(arr,onch){
  Array.prototype.forEach.call(document.querySelectorAll('.row'),function(b){b.onclick=function(){var l=b.getAttribute('data-l');if(arr.indexOf(l)>-1)return;arr.push(l);say(l+', position '+arr.length);onch(true,l);};});
  var rs=$('reset'); if(rs) rs.onclick=function(){arr.length=0;onch(true,null);say('Order cleared');};
}
function choiceList(name,opts,sel,cls){
  return '<div class="'+(cls||'choices')+'" role="radiogroup">'+opts.map(function(o,i){return '<label class="choice"><input type="radio" name="'+name+'" value="'+o.k+'"'+(sel===o.k?' checked':'')+'><span class="rd" aria-hidden="true"></span><span><b>'+o.t+'</b>'+(o.d?'<span class="d">'+o.d+'</span>':'')+'</span></label>';}).join('')+'</div>';
}

function render(){
  var s=SC[cur], m=$('main');
  if(s==='intro'){stepNav(0);
    m.innerHTML='<p class="ey">Self-study 16 · Activity</p><h1>Three jobs, handed off at once.</h1>'+
    '<p class="sub">Sections 2 to 4 of the lesson in one file: create a folder, write a file, delete the file. Each job prints a line when it is done. You will predict what the terminal shows, then run the real file five times.</p>'+
    '<div class="take">'+
    '<div class="vc"><h2>1 · Predict</h2><p>The order of four lines, and whether an error appears.</p></div>'+
    '<div class="vc"><h2>2 · Run it 5 times</h2><p>In Cursor. Record each run. Every run is checked.</p></div>'+
    '<div class="vc"><h2>3 · Compare</h2><p>Your prediction against what really happened.</p></div></div>'+
    '<p class="sub" style="margin-top:22px;color:var(--mut)">About 15 minutes. Have Cursor open.</p>';
    foot('Start');handlers.next=function(){go(1);};
  }
  else if(s==='order'){stepNav(0);
    var draw=function(){m.innerHTML='<p class="ey">Predict · 1 of 2</p><h1>In what order will the lines print?</h1>'+
      '<div class="g2">'+codeBox('log','<span>4 lines print</span>')+'<div><p class="qt">Select the lines in the order you expect</p><p class="qh">Tap the first line to print, then the second, and so on.</p>'+orderPicker(pred.order)+'</div></div>';
      bindPicker(pred.order,function(){draw();var b=document.querySelector('.row:not(.on)');(b||$('next')).focus();});foot('Next question',pred.order.length<4,true);};
    draw();handlers.next=function(){go(2);};
  }
  else if(s==='error'){stepNav(0);
    m.innerHTML='<p class="ey">Predict · 2 of 2</p><h1>If a job fails, will you see an error?</h1>'+
      '<div class="g2">'+codeBox('err','<span>look at the highlighted lines</span>')+'<div><p class="qt">Choose one</p><p class="qh">Each callback ends with the same line.</p>'+
      choiceList('err',[{k:'yes',t:'Yes',d:'A failed job prints its error.'},{k:'no',t:'No',d:'Nothing is printed, even if a job fails.'},{k:'crash',t:'It crashes',d:'The script stops at the first failed job.'}],pred.err)+'</div></div>';
    Array.prototype.forEach.call(document.querySelectorAll('input[name=err]'),function(x){x.onchange=function(){pred.err=x.value;$('next').disabled=false;};});
    foot('Check my prediction',!pred.err,true);handlers.next=function(){go(3);};
  }
  else if(s==='feedback'){stepNav(0);
    var f1=pred.order[0]==='script end', f2=pred.err==='no'; score=(f1?1:0)+(f2?1:0);
    var written=key(pred.order.filter(function(l){return l!=='script end';}))===key(['mkdir finished','writeFile finished','unlink finished']);
    m.innerHTML='<p class="ey">Your prediction · '+score+' of 2</p><h1>Here is what really happens.</h1>'+
      '<div class="vcards" role="status">'+
      '<div class="vc"><div class="top"><span class="badge '+(f1?'ok':'no')+'">'+(f1?'You got it':'Not quite')+'</span><h2>script end prints first</h2></div>'+
      '<p>It is the last line of the file, yet it prints before any job reports back. Node hands the three jobs off and moves straight on.'+(written?' You placed the jobs in the written order, but Node never promises that order.':'')+'</p>'+
      '<div class="seqs">'+seq('You',pred.order)+SAMPLES.map(function(o,k){return seq('Run '+(k+1),o);}).join('')+'</div></div>'+
      '<div class="vc"><div class="top"><span class="badge '+(f2?'ok':'no')+'">'+(f2?'You got it':'Not quite')+'</span><h2>No error is printed</h2></div>'+
      '<p><code>if (err) return;</code> leaves the callback without printing anything. A job can fail, and the terminal stays quiet.</p></div></div>';
    foot('Now run it in Cursor',false,false);handlers.next=function(){go(4);};
  }
  else if(s==='setup'){stepNav(1);
    m.innerHTML='<p class="ey">Run · Setup</p><h1>Set up the file in Cursor</h1><div class="g2 even"><div>'+
      '<ol class="stepsl"><li><span>Create an empty folder named <b class="m">async-lab</b> and open it in Cursor.</span></li>'+
      '<li><span>Create <b class="m">index.js</b>, paste the code and save.</span></li>'+
      '<li><span>In the terminal, run <b class="m">node index.js</b></span></li></ol>'+
      '<div class="note"><b>Before every run, delete the data folder.</b> Each run must start from an empty project.</div></div>'+
      codeBox('', '<button class="copy" type="button" id="cp">Copy code</button>')+'</div>';
    $('cp').onclick=function(){var b=$('cp');try{navigator.clipboard.writeText(CODE).then(function(){b.textContent='Copied';},function(){b.textContent='Select and copy';});}catch(e){b.textContent='Select and copy';}};
    foot('Record run 1',false,false);handlers.next=function(){go(5);};
  }
  else if(s.indexOf('run')===0){stepNav(1);
    var i=+s.slice(3);
    var tr='<div class="tracker" aria-hidden="true">'+Array.apply(null,{length:RUNS}).map(function(_,k){return '<span class="'+(k<i?'done':(k===i?'now':''))+'"></span>';}).join('')+'</div>';
    var drawR=function(){
      if(checked){ var r=runs[i], same=[]; for(var k=0;k<i;k++) if(key(runs[k].order)===key(r.order)) same.push(k+1);
        var d={}; runs.forEach(function(x){d[key(x.order)]=1;}); var n=Object.keys(d).length;
        m.innerHTML='<p class="ey">Run '+(i+1)+' of '+RUNS+'</p><h1>Run '+(i+1)+' checked</h1>'+tr+
          '<div class="vcards" role="status"><div class="vc"><div class="top"><span class="badge ok">Recorded</span><h2>script end came first</h2></div>'+
          '<div class="seqs">'+seq('Run '+(i+1),r.order,wbm(r.order))+'</div>'+
          '<p style="margin-top:10px">'+(i===0?'Your first run. Keep it in mind for the next ones.':(same.length?'Same order as run '+same.join(', ')+'. ':'A new order. ')+n+' different order'+(n>1?'s':'')+' so far.')+'</p></div>'+
          (wbm(r.order)?'<div class="vc"><div class="top"><span class="badge no">Look closer</span><h2>writeFile finished before mkdir</h2></div><p>In our test runs, every time that happened, writeFile had failed because data did not exist yet. Your terminal printed no error.</p></div>':'')+'</div>';
        foot(i<RUNS-1?'Record run '+(i+2):'Compare all runs',false,false);
        handlers.next=function(){temp={order:[],state:null};go(cur+1);};return;}
      m.innerHTML='<p class="ey">Run '+(i+1)+' of '+RUNS+'</p><h1>'+(i===0?'Run it and record what you see':'Delete data, run again, record')+'</h1>'+tr+
        '<div class="g2 even"><div><p class="qt">Order in the terminal</p><p class="qh">Tap the lines as they appear, top to bottom.</p>'+orderPicker(temp.order)+'</div>'+
        '<div><p class="qt">What is in the project folder now?</p><p class="qh">Look in Cursor\'s Explorer.</p>'+
        choiceList('st',[{k:'file',t:'data, with info.txt inside'},{k:'empty',t:'data, empty'},{k:'none',t:'No data folder'}],temp.state)+'</div></div>';
      bindPicker(temp.order,function(){drawR();});
      Array.prototype.forEach.call(document.querySelectorAll('input[name=st]'),function(x){x.onchange=function(){temp.state=x.value;upd();};});
      var upd=function(){$('next').disabled=!(temp.order.length===4&&temp.state);};
      foot('Check run '+(i+1),true,false);upd();
      handlers.next=function(){
        if(temp.order[0]!=='script end'){$('err').textContent='Check the terminal again: which line is at the very top? Start the order again and tap the lines as they appear.';return;}
        if(temp.state==='none'){$('err').textContent='mkdir always runs, so a data folder should be there. Check that you ran the command inside async-lab.';return;}
        runs[i]={order:temp.order.slice(),state:temp.state};checked=true;drawR();say('Run '+(i+1)+' checked.');};
    };
    drawR();
  }
  else if(s==='compare'){stepNav(2);
    var d={},sil=0; runs.forEach(function(r){d[key(r.order)]=1;if(wbm(r.order))sil++;}); var n=Object.keys(d).length;
    m.innerHTML='<p class="ey">Compare</p><h1>Your five runs</h1>'+
      '<div class="stats"><div class="stat"><b>5 / 5</b><span>runs printed script end first</span></div>'+
      '<div class="stat"><b>'+n+'</b><span>different order'+(n>1?'s':'')+' from the same file</span></div>'+
      '<div class="stat"><b>'+sil+'</b><span>run'+(sil===1?'':'s')+' where writeFile beat mkdir, silently</span></div></div>'+
      '<div class="vc"><div class="runlist">'+seq('You',pred.order)+runs.map(function(r,k){return seq('Run '+(k+1),r.order,wbm(r.order));}).join('')+'</div></div>'+
      (n===1?'<p class="sub" style="margin-top:14px">All five matched this time. That is luck, not a rule: on our test machine the same file gave 5 different orders in 200 runs.</p>':'');
    foot('What this means',false,false);handlers.next=function(){go(cur+1);};
  }
  else if(s==='finish'){stepNav(2);
    m.innerHTML='<p class="ey">Section 9 · Async mental model</p><h1>What you just saw</h1>'+
      '<div class="take"><div class="vc"><h2>Async code does not block</h2><p>script end printed before any job reported back.</p></div>'+
      '<div class="vc"><h2>Node continues handling other work</h2><p>It does not wait at fs.mkdir. It moves on and runs the callback later.</p></div>'+
      '<div class="vc"><h2>fs operations are delegated to OS</h2><p>Each job finishes when it is done. The written order is not a promise.</p></div></div>'+
      '<p class="sub" style="margin-top:24px;color:var(--tx)">So if writeFile must wait for mkdir, your code has to say so. That is the next step in the lesson.</p>';
    foot('Start over',false,false);handlers.next=function(){pred={order:[],err:null};runs=[];temp={order:[],state:null};go(0);};
    say('Activity complete.');
  }
}
render();
})();
</script>
</body>
</html>
