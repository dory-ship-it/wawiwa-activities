      doc.line(MARGIN, FOOT_Y - 3.4, PAGE_W - MARGIN, FOOT_Y - 3.4);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7.5);
      doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]);
      doc.text('© Wawiwa Tech | Confidential', MARGIN, FOOT_Y);
      doc.text('Page ' + i + ' of ' + total, PAGE_W - MARGIN, FOOT_Y, { align: 'right' });
    }
  }

  /* the report hero. Mission skin: the navy poster band with the gold
     Insight scoreline. Rise skin (PracticeCore.LABELS): a light header —
     white ground, navy title, teal rule — and NO scoreline or rank ever
     (points stay internal on rise). data.title overrides the default
     heading, which is how a scoped export (one case instead of the whole
     mission) names itself. */
  function drawHero(doc, activity, data) {
    var L = (window.PracticeCore || {}).LABELS
      || { reportTitle: 'Mission Report', scoreline: true };
    var meta = activity.meta || {};
    var kicker = clean([meta.program, meta.module, meta.lesson].filter(Boolean).join('  ·  '));
    var title = clean(data.title || (L.reportTitle + '  ·  ' + (meta.title || '')));
    var dark = !!L.scoreline; // mission = the dark poster hero
    var scoreline = dark ? data.scoreline : null;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(15);
    var titleLines = doc.splitTextToSize(title, CONTENT_W - 12);
    var heroH = 34 + titleLines.length * 6.6
      + (scoreline ? 9 : 0) + (data.level ? 10 : 0);

    if (dark) {
      doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]);
      doc.rect(0, 0, PAGE_W, heroH, 'F');
      doc.setFillColor(RED[0], RED[1], RED[2]);
      doc.rect(0, heroH, PAGE_W, 1.6, 'F');
    } else {
      // the light header: white ground, a short teal rule under the title
      doc.setFillColor(TEAL[0], TEAL[1], TEAL[2]);
      doc.rect(0, heroH, PAGE_W, 1.2, 'F');
    }

    drawWordmark(doc, MARGIN, 8);

    var y = 27;
    if (kicker) {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8.5);
      if (dark) doc.setTextColor(GOLD[0], GOLD[1], GOLD[2]);
      else doc.setTextColor(TEAL_DEEP[0], TEAL_DEEP[1], TEAL_DEEP[2]);
      doc.text(kicker.toUpperCase(), MARGIN, y);
    }
    y += 7;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(15);
    if (dark) doc.setTextColor(255, 255, 255);
    else doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
    doc.text(titleLines, MARGIN, y);
    y += titleLines.length * 6.6;

    if (scoreline) {
      doc.setFontSize(12);
      doc.setTextColor(GOLD[0], GOLD[1], GOLD[2]);
      var pts = String(scoreline.points);
      doc.text(pts, MARGIN, y);
      var x = MARGIN + doc.getTextWidth(pts) + 2;
      doc.setFontSize(9);
      doc.setTextColor(255, 255, 255);
      var of = scoreline.max ? 'of ' + scoreline.max + ' Insight' : 'Insight';
      doc.text(of, x, y);
      if (scoreline.rank) {
        x += doc.getTextWidth(of) + 5;
        drawChip(doc, x, y - 4, clean(scoreline.rank), [62, 134, 143]);
      }
      y += 9;
    }
    if (data.level) {
      var rgb = LEVEL_RGB[data.level.index] || LEVEL_RGB[1];
      drawChip(doc, MARGIN, y - 4.5, 'Overall level: ' + clean(data.level.label), rgb);
      y += 10;
    }
    return heroH + 10;
  }

  /* one report: hero + attached images + sections of cards, across pages */
  function buildDoc(activity, data) {
    var JsPDF = jsPdfCtor();
    var doc = new JsPDF({ unit: 'mm', format: 'a4', compress: true });
    var y = drawHero(doc, activity, data);

    function pageBreak(needed) {
      if (y + needed <= BOTTOM) return;
      doc.addPage();
      y = MARGIN + 4;
    }

    // attached diagrams (engine/attach.js data: {title, src, w, h}) ride at
    // the top of the report, full content width, the block title as caption;
    // drawn by jsPDF like everything else, so the export stays footer-free
    (data.attachments || []).forEach(function (att) {
      if (!att || !att.src || !(att.w > 0) || !(att.h > 0)) return;
      var drawW = CONTENT_W;
      var drawH = drawW * (att.h / att.w);
      var maxH = BOTTOM - (MARGIN + 4) - 9; // a full page minus the caption
      if (drawH > maxH) { drawH = maxH; drawW = drawH * (att.w / att.h); }
      pageBreak(drawH + 12);
      doc.setFillColor(RED[0], RED[1], RED[2]);
      doc.rect(MARGIN, y - 3.2, 7, 1.4, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
      doc.text(clean(att.title), MARGIN, y + 2.4);
      y += 7;
      try {
        doc.addImage(att.src, 'JPEG', MARGIN, y, drawW, drawH);
        y += drawH + 8;
      } catch (e) {
        // a malformed stored image never breaks the export of the writing
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(9.5);
        doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]);
        doc.text('The attached image could not be embedded.', MARGIN, y + 2);
        y += 8;
      }
    });

    // an empty box to write or draw in by hand (the blank template); a
    // ruled box when lines > 0, a plain frame for a diagram (lines = 0)
    function writingBox(x, w, h, lines) {
      pageBreak(h + 2);
      doc.setDrawColor(LINE[0], LINE[1], LINE[2]);
      doc.setLineWidth(0.3);
      doc.roundedRect(x, y, w, h, 1.5, 1.5, 'S');
      if (lines > 0) {
        var step = h / lines;
        doc.setLineWidth(0.2);
        for (var i = 1; i < lines; i++) {
          doc.line(x + 3, y + i * step, x + w - 3, y + i * step);
        }
      }
      y += h + 4;
    }

    // a heading with the red tick (sections, blank-template attachment slots)
    function sectionHeading(title, size) {
      doc.setFillColor(RED[0], RED[1], RED[2]);
      doc.rect(MARGIN, y - 3.2, 7, 1.4, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(size);
      doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]);
      var lines = doc.splitTextToSize(clean(title), CONTENT_W);
      doc.text(lines, MARGIN, y + 2.4);
      y += 9 + (lines.length - 1) * 5.4;
    }

    // a plain paragraph in the content column (section instructions)
    function paragraph(text, x, w) {
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.setTextColor(INK[0], INK[1], INK[2]);
      String(text).split('\n').forEach(function (para) {
        var lines = doc.splitTextToSize(clean(para), w);
        for (var i = 0; i < lines.length; i++) {
          pageBreak(5);
          doc.text(lines[i], x, y);
          y += 4.6;
        }
      });
      y += 2;
    }

    // blank-template slots for attached diagrams: the caption, the authored
    // instruction, and an empty frame to draw in
    (data.attachmentSlots || []).forEach(function (slot) {
      pageBreak(80);
      sectionHeading(slot.title, 11);
      if (slot.instruction) paragraph(slot.instruction, MARGIN, CONTENT_W);
      writingBox(MARGIN, CONTENT_W, 90, 0);
    });

    // a blank-template card keeps its heading, instructions and writing
    // box on one page: measure the whole card before starting it
    function blankCardHeight(card) {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10.5);
      var h = doc.splitTextToSize(clean(card.title), CONTENT_W - 7.5).length * 5 + 2.5;
      doc.setFontSize(9.5);
      (card.rows || []).forEach(function (row) {
        if (row.label) h += 4.6;
        h += doc.splitTextToSize(clean(row.value), CONTENT_W - 7.5).length * 4.6 + 1.4;
      });
      return h + card.writeLines * 7.5 + 6;
    }

    (data.sections || []).forEach(function (section) {
      // a blank-template section heading never sits alone at a page foot:
      // it moves with its instruction and its first card
      var first = (section.cards || [])[0];
      var keep = 16;
      if (first && first.writeLines) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9.5);
        keep += (section.intro ? doc.splitTextToSize(clean(section.intro), CONTENT_W).length * 4.6 + 2 : 0)
          + blankCardHeight(first);
      }
      pageBreak(keep);
      sectionHeading(section.title, 12);
      if (section.intro) paragraph(section.intro, MARGIN, CONTENT_W);

      (section.cards || []).forEach(function (card) {
        pageBreak(card.writeLines ? blankCardHeight(card) : 14);
        var x = MARGIN;
        if (card.num !== undefined && card.num !== null) {
          doc.setFillColor(RED[0], RED[1], RED[2]);
          doc.circle(x + 2.6, y + 0.6, 2.6, 'F');
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8.5);
          doc.setTextColor(255, 255, 255);
          doc.text(String(card.num), x + 2.6, y + 1.8, { align: 'center' });
          x += 7.5;
        }
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10.5);
        doc.setTextColor(INK[0], INK[1], INK[2]);
        var tagW = card.tag ? doc.getTextWidth(card.tag) + 9 : 0;
        // an untitled card (a blank-template info card) has no heading line
        var headLines = card.title
          ? doc.splitTextToSize(clean(card.title), CONTENT_W - (x - MARGIN) - tagW) : [];
        if (headLines.length) doc.text(headLines, x, y + 2);
        if (card.tag) {
          drawChip(doc, PAGE_W - MARGIN - tagW + 3, y - 2,
            clean(card.tag), TAG_RGB[card.tag] || SLATE);
        }
        if (headLines.length) y += headLines.length * 5 + 2.5;

        (card.rows || []).forEach(function (row) {
          var rowX = MARGIN + 7.5;
          var rowW = CONTENT_W - 7.5;
          var value = clean(row.value);
          doc.setFontSize(9.5);
          if (row.label) {
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(SLATE[0], SLATE[1], SLATE[2]);
            pageBreak(6);
            doc.text(clean(row.label), rowX, y);
            y += 4.6;
          }
          doc.setFont('helvetica', row.empty ? 'italic' : 'normal');
          var g = row.empty ? SLATE : INK;
          doc.setTextColor(g[0], g[1], g[2]);
          var lines = doc.splitTextToSize(value, rowW);
          for (var i = 0; i < lines.length; i++) {
            pageBreak(5);
            doc.text(lines[i], rowX, y);
            y += 4.6;
          }
          y += 1.4;
        });

        if (card.writeLines) {
          writingBox(MARGIN + 7.5, CONTENT_W - 7.5, card.writeLines * 7.5, card.writeLines);
          y += 2;
          return;
        }

        doc.setDrawColor(LINE[0], LINE[1], LINE[2]);
        doc.setLineWidth(0.25);
        if (y + 4 <= BOTTOM) doc.line(MARGIN, y, PAGE_W - MARGIN, y);
        y += 6;
      });
      y += 2;
    });

    drawPageFooters(doc);
    return doc;
  }

  function fileName(activity, slug, kind) {
    var id = ((activity.meta || {}).id || 'activity').replace(/[^a-z0-9-]/gi, '-');
    var part = slug ? '-' + String(slug).replace(/[^a-z0-9-]/gi, '-') : '';
    return 'Wawiwa-' + id + part + '-' + (kind || 'report') + '.pdf';
  }

  /* the one public entry: draw and download. Works inside an iframe embed;
     if the host frame blocks downloads, fall back to opening the blob in a
     new tab (still our PDF, still no browser footer). */
  function saveReport(activity, data) {
    if (!jsPdfCtor()) { window.print(); return; } // vendored lib missing: last resort
    var doc = buildDoc(activity, data || {});
    try {
      doc.save(fileName(activity, data && data.fileSlug, data && data.fileKind));
    } catch (e) {
      try { window.open(doc.output('bloburl'), '_blank'); } catch (e2) { /* blocked twice: give up quietly */ }
    }
  }

  /* a generic data builder for chrome that only has activity + answers
     (core.js renderFooter): every section's fields and prompts, answered
     or not, in spec order. Formats with a richer report build their own. */
  function genericData(activity, state) {
    var sections = [];
    (activity.sections || []).forEach(function (section) {
      var items = section.type === 'fields' ? (section.fields || [])
        : (section.type === 'ordered_points' ? (section.prompts || []) : []);
      if (!items.length) return;
      sections.push({
        title: section.title,
        cards: items.map(function (item, i) {
          var text = ((state.answers || {})[item.id] || '').trim();
          return {
            num: i + 1,
            title: item.label,
            rows: [{ value: text || 'Not answered yet.', empty: !text }]
          };
        })
      });
    });
    return { sections: sections };
  }

  /* the blank template (instructors asked for it, NewTech, 22 Oct 2026):
     the same branded PDF built from the SPEC ALONE, never from state, so it
     carries no student answer, no tag, no score, and no coach reply, and it
     works before Start. Headings, the intro, the PII notice, each section's
     instruction, each field's label + instructions, and an empty ruled box
     per field; read-only card sections ride as information. A "cases"
     workbook numbers fields per case, every other spec runs one count. */
  function blankData(activity) {
    var intro = activity.intro || {};
    var notice = (activity.safety || {}).student_notice;
    var perCase = !!(activity.meta && activity.meta.layout === 'cases');
    var sections = [];
    var number = 0;

    var about = [];
    if (intro.headline || intro.body) {
      about.push({ title: intro.headline || '', rows: intro.body ? [{ value: intro.body }] : [] });
    }
    if (notice) {
      about.push({ title: 'Before you start: no personal data.', rows: [{ value: notice }] });
    }
    if (about.length) sections.push({ title: 'About this activity', cards: about });

    (activity.sections || []).forEach(function (section) {
      if (section.type === 'card') {
        var rows = [];
        if (section.body) rows.push({ value: section.body });
        if ((section.bullets || []).length) {
          rows.push({ value: section.bullets.map(function (b) { return '- ' + b; }).join('\n') });
        }
        if (section.footer) rows.push({ value: section.footer });
        sections.push({ title: section.title, cards: [{ title: '', rows: rows }] });
        return;
      }
      var items = section.type === 'fields' ? (section.fields || [])
        : (section.type === 'ordered_points' ? (section.prompts || []) : []);
      if (!items.length) return;
      if (perCase) number = 0;
      sections.push({
        title: section.title,
        intro: (section.instruction || '').trim(),
        cards: items.map(function (item) {
          number += 1;
          var help = (item.help || '').trim();
          return {
            num: number,
            title: item.label,
            rows: help ? [{ label: 'Instructions', value: help }] : [],
            writeLines: section.type === 'ordered_points' ? 3 : 6
          };
        })
      });
    });

    return {
      title: 'Blank template  ·  ' + ((activity.meta || {}).title || ''),
      fileSlug: 'blank',
      fileKind: 'template',
      attachmentSlots: (activity.attachments || []).map(function (att) {
        return { title: att.title, instruction: att.instruction };
      }),
      sections: sections
    };
  }

  function saveBlank(activity) {
    saveReport(activity, blankData(activity));
  }

  window.PracticeExport = {
    saveReport: saveReport,
    saveBlank: saveBlank,
    blankData: blankData,
    genericData: genericData,
    _clean: clean,
    _fileName: fileName
  };
})();

/*
 * Practice Studio, the Mission experience skin (Experience Library Phase E1).
 *
 * A shared design layer every format inherits: the scene-based layout
 * primitive (one thing on screen at a time, full-bleed, a calm zone for
 * text), the Wawiwa robot mentor as the visible face of the coach, the
 * Insight points + medallion + journey-map progress system, restrained
 * cinematic motion, and the designed one-page report export.
 *
 * Locked visual target: design-samples/wawiwa-mission-workbook-mockup.html
 * and wawiwa-mission-scenario-game.html. Palette and motif come from the
 * Wawiwa Image Style System.
 *
 * Rendering split (hybrid, locked): everything in this file is authored
 * SVG/CSS (crisp, offline, localizable). Each scene also has a raster
 * background slot: when a baked image is present (window.ASSETS), it renders
 * full-bleed under the scrim; when absent, the flat CSS/SVG poster backdrop
 * (teal/red/navy blocks + white line-art icons) fills in with the identical
 * layout, so Phase E2 backgrounds drop in with no rework.
 *
 * No mechanics live here. Formats keep their own checks, coach calls,
 * autosave, review, and passback; this layer only draws and counts.
 * No network code; nothing here fetches anything, ever.
 */
(function () {
  'use strict';

  var C = window.PracticeCore;
  var el = C.el;

  function reducedMotion() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) { return false; }
  }

  /* ================= the Wawiwa robot mentor (authored SVG) ================= */
  /* The friendly white robot with the teal + red eyes, per the Image Style
     System: rounded, approachable, identical in every appearance. */

  var ROBOT_MARKUP =
    '<rect x="14" y="18" width="36" height="30" rx="9" fill="#fff" stroke="#255777" stroke-width="2.5"/>'
    + '<rect x="20" y="25" width="24" height="14" rx="5" fill="#255777"/>'
    + '<circle cx="27" cy="32" r="3" fill="#5AB3AA"/><circle cx="37" cy="32" r="3" fill="#EE3124"/>'
    + '<path d="M28 36.5q4 2.6 8 0" fill="none" stroke="#5AB3AA" stroke-width="1.6" stroke-linecap="round"/>'
    + '<line x1="32" y1="10" x2="32" y2="18" stroke="#255777" stroke-width="2.5"/>'
    + '<circle cx="32" cy="9" r="3.2" fill="#EE3124"/>'
    + '<rect x="9" y="30" width="5" height="10" rx="2.5" fill="#3E868F"/>'
    + '<rect x="50" y="30" width="5" height="10" rx="2.5" fill="#3E868F"/>'
    + '<rect x="22" y="48" width="20" height="6" rx="3" fill="#255777"/>';

  function mentor(size, className) {
    return C.svgEl(
      '<svg viewBox="0 0 64 64" width="' + size + '" height="' + size + '" role="img" aria-label="Wawiwa AI Coach">'
      + ROBOT_MARKUP + '</svg>',
      className || 'm-bot');
  }

  /* small brand glyphs the skin uses (SVG, never emoji: crisp and printable).
     All decorative: the adjacent text carries the meaning (WCAG 1.1.1). */
  var GLYPH = {
    star: '<svg viewBox="0 0 20 20" width="15" height="15" fill="#F4B41A" aria-hidden="true"><path d="M10 1.6l2.5 5.2 5.7.7-4.2 3.9 1.1 5.6L10 14.2 4.9 17l1.1-5.6L1.8 7.5l5.7-.7z"/></svg>',
    medal: '<svg viewBox="0 0 64 64" width="44" height="44" aria-hidden="true"><circle cx="32" cy="26" r="17" fill="#EE3124"/><circle cx="32" cy="26" r="17" fill="none" stroke="#F4B41A" stroke-width="4"/><circle cx="32" cy="26" r="11.5" fill="#2b6f74"/><path d="M25.5 26l4.6 4.6 8.4-10.4" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 40l-3.4 15 11.4-6.4L43.4 55 40 40z" fill="#F4B41A"/></svg>',
    magnify: '<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>',
    lock: '<svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4.5" y="9" width="11" height="8" rx="2"/><path d="M7 9V6.5a3 3 0 016 0V9"/></svg>',
    check: '<svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>'
  };

  /* ================= the poster backdrop (background layer + slot) ================= */
  /* Layer order per the Image Style System: raster background slot (baked,
     E2) OR the flat CSS/SVG poster fallback, then the white line-art icon
     motif, then a scrim, then the SVG foreground and UI. */

  var PALETTES = [
    ['#5AB3AA', '#255777', '#EE3124'],
    ['#3E868F', '#EE3124', '#255777'],
    ['#255777', '#5AB3AA', '#F4B41A'],
    ['#EE3124', '#3E868F', '#255777'],
    ['#5AB3AA', '#EE3124', '#3E868F'],
    ['#255777', '#F4B41A', '#5AB3AA']
  ];

  function iconLayerMarkup() {
    // scattered white line-art tech shapes, the poster motif
    var s = '';
    for (var i = 0; i < 64; i++) {
      var x = Math.random() * 100, y = Math.random() * 100;
      var sz = 1.4 + Math.random() * 3, r = Math.random() * 360, sh = i % 4, g = '';
      if (sh === 0) {
        g = '<circle r="' + (sz / 2) + '" fill="none" stroke="#fff" stroke-width=".5"/>'
          + '<circle r="' + (sz / 7) + '" fill="#fff"/>';
      } else if (sh === 1) {
        g = '<rect x="' + (-sz / 2) + '" y="' + (-sz / 2) + '" width="' + sz + '" height="' + sz
          + '" rx=".6" fill="none" stroke="#fff" stroke-width=".5"/>';
      } else if (sh === 2) {
        g = '<path d="M' + (-sz / 2) + ' 0 A ' + (sz / 2) + ' ' + (sz / 2) + ' 0 0 1 ' + (sz / 2)
          + ' 0" fill="none" stroke="#fff" stroke-width=".5"/><circle r=".4" fill="#fff"/>';
      } else {
        g = '<line x1="' + (-sz / 2) + '" y1="0" x2="' + (sz / 2) + '" y2="0" stroke="#fff" stroke-width=".5"/>'
          + '<line x1="0" y1="' + (-sz / 2) + '" x2="0" y2="' + (sz / 2) + '" stroke="#fff" stroke-width=".5"/>';
      }
      s += '<g transform="translate(' + x + ' ' + y + ') rotate(' + r + ')">' + g + '</g>';
    }
    return s;
  }

  function buildBackdrop(host) {
    var bg = el('div', 'm-stage-bg');
    var img = el('div', 'm-bg-slot'); // the raster background slot (E2)
    bg.appendChild(img);
    var blobs = el('div', 'm-bg-blobs');
    bg.appendChild(blobs);
    host.appendChild(bg);
    var icons = C.svgEl(
      '<svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true">'
      + iconLayerMarkup() + '</svg>', 'm-icons');
    host.appendChild(icons);
    host.appendChild(el('div', 'm-scrim'));

    return {
      /* set(index, rasterSrc): rasterSrc is a spec image reference; when it
         resolves through the baked asset map the raster fills the slot and
         the poster blobs step back. Layout is identical either way. */
      set: function (index, rasterSrc) {
        var p = PALETTES[((index % PALETTES.length) + PALETTES.length) % PALETTES.length];
        bg.style.background = 'linear-gradient(135deg, ' + p[1] + ' 0%, ' + p[0] + ' 100%)';
        blobs.textContent = '';
        [['46vw', '-8vw', '-10vw', p[2], '', ''],
         ['38vw', '', '-12vw', p[0], '-6vw', '.85'],
         ['26vw', '', '-8vw', p[1], '24vw', '.7']].forEach(function (b, i) {
          var blob = el('div', 'm-blob');
          blob.style.width = b[0]; blob.style.height = b[0];
          if (i === 0) { blob.style.left = b[1]; blob.style.top = b[2]; }
          else if (i === 1) { blob.style.right = b[4]; blob.style.bottom = b[2]; }
          else { blob.style.right = b[4]; blob.style.top = b[2]; }
          blob.style.background = b[3];
          if (b[5]) blob.style.opacity = b[5];
          blobs.appendChild(blob);
        });
        var raster = rasterSrc ? C.imageEl(rasterSrc, 'm-bg-img') : null;
        img.textContent = '';
        if (raster) img.appendChild(raster);
        bg.classList.toggle('m-has-raster', !!raster);
      }
    };
  }

  /* ================= points, medallion, journey (the progress system) ================= */

  /* Points come from activity-spec events, never from a lesson hardcode.
     The mapping can be overridden per activity via spec.mission.points. */
  var POINT_DEFAULTS = {
    strong: 40,   // a strong decision
    mixed: 15,    // a mixed decision
    weak: 0,      // a weak decision still teaches, but earns nothing
    field_ready: 25,  // a canvas field passing its check
    prompt_ready: 10  // a pitch point passing its check
  };

  function pointsConfig(activity) {
    var cfg = {};
    var override = (activity.mission || {}).points || {};
    Object.keys(POINT_DEFAULTS).forEach(function (k) {
      cfg[k] = (typeof override[k] === 'number') ? override[k] : POINT_DEFAULTS[k];
    });
    return cfg;
  }

  function buildMedallion(total, label) {
    var CIRC = 138.2;
    var labelBase = label || C.LABELS.progressLabel;
    var wrap = C.svgEl(
      '<svg viewBox="0 0 52 52" width="46" height="46" class="m-medal-svg" role="img" aria-label="'
      + labelBase + ': 0 of ' + total + '">'
      + '<circle class="m-medal-track" cx="26" cy="26" r="22" fill="none" stroke-width="5"/>'
      + '<circle class="m-medal-fill" cx="26" cy="26" r="22" fill="none" stroke-width="5" stroke-linecap="round"'
      + ' stroke-dasharray="' + CIRC + '" stroke-dashoffset="' + CIRC + '" transform="rotate(-90 26 26)"/>'
      + '<text class="m-medal-lbl" x="26" y="30" text-anchor="middle">0/' + total + '</text></svg>',
      'm-medallion');
    return {
      node: wrap,
      set: function (done, totalNow) {
        var t = totalNow || total || 1;
        var fill = wrap.querySelector('.m-medal-fill');
        var lbl = wrap.querySelector('.m-medal-lbl');
        fill.style.strokeDashoffset = String(CIRC * (1 - Math.min(done, t) / t));
        lbl.textContent = done + '/' + t;
        // the accessible name tracks the visible count (WCAG 1.1.1)
        var svg = wrap.querySelector('svg');
        if (svg) svg.setAttribute('aria-label', labelBase + ': ' + done + ' of ' + t);
        wrap.classList.toggle('m-medal-full', done >= t);
      }
    };
  }

  /* The journey map: one node per stop; nodes light up while active and lock
     in gold when done. Rendered as HUD dots (game) or a board rail (canvas). */
  function buildJourneyDots(items, onNav) {
    var wrap = el('div', 'm-journey');
    var nodes = {};
    items.forEach(function (item) {
      var n = el(onNav ? 'button' : 'span', 'm-node');
      if (onNav) {
        n.type = 'button';
        // a dot button has no visible text: name it programmatically
        n.setAttribute('aria-label', item.label || 'Stop');
        n.addEventListener('click', function () { onNav(item.id); });
      }
      n.title = item.label || '';
      wrap.appendChild(n);
      nodes[item.id] = n;
    });
    return {
      node: wrap,
      /* state: 'todo' | 'active' | 'done' */
      set: function (id, stateName) {
        var n = nodes[id];
        if (!n) return;
        n.className = 'm-node' + (stateName !== 'todo' ? ' m-node-' + stateName : '');
      }
    };
  }

  /* ================= the top bar HUD ================= */

  function buildHud(activity, opts) {
    opts = opts || {};
    var meta = activity.meta;
    var bar = el('div', 'm-topbar');
    bar.appendChild(C.svgEl(C.SVG.logo, 'm-logo'));
    var brand = el('div', 'm-brandline');
    brand.appendChild(el('span', 'm-brand-k',
      [meta.program, meta.module, meta.lesson].filter(Boolean).join('  ·  ')));
    brand.appendChild(el('span', 'm-brand-t', meta.title));
    bar.appendChild(brand);

    var hudRight = el('div', 'm-hud');
    (opts.extras || []).forEach(function (x) { hudRight.appendChild(x); });

    // the Insight chip is a mission element: the rise skin computes points
    // internally but never displays them (C.LABELS.insightHud is false)
    var chip = null, pts = null;
    if (C.LABELS.insightHud) {
      chip = el('div', 'm-chip');
      chip.appendChild(C.svgEl(GLYPH.star, 'm-chip-ic'));
      pts = el('b', null, '0');
      chip.appendChild(pts);
      chip.appendChild(el('span', null, 'Insight'));
      hudRight.appendChild(chip);
    }

    var medallion = buildMedallion(opts.total || 1, opts.progressLabel);
    if (opts.progressLabel) medallion.node.title = opts.progressLabel;
    hudRight.appendChild(medallion.node);

    var journey = null;
    if (opts.journeyItems) {
      journey = buildJourneyDots(opts.journeyItems, opts.onNav);
      hudRight.appendChild(journey.node);
    }
    bar.appendChild(hudRight);

    var current = 0;
    return {
      node: bar,
      medallion: medallion,
      journey: journey,
      setPoints: function (n) {
        n = Math.max(0, n | 0);
        if (n !== current) {
          if (chip) {
            pts.textContent = String(n);
            if (!reducedMotion()) {
              chip.classList.remove('m-chip-bump');
              void chip.offsetWidth;
              chip.classList.add('m-chip-bump');
            }
          }
          current = n;
        }
      }
    };
  }

  /* ================= the reward toast (a beat, not a blocker) ================= */

  var toastNode = null, toastTimer = null;
  function toast(title, points) {
    if (!C.LABELS.toast) return; // the rise skin never toasts points
    if (!toastNode) {
      toastNode = el('div', 'm-toast');
      toastNode.setAttribute('role', 'status');
      document.body.appendChild(toastNode);
    }
    toastNode.textContent = '';
    toastNode.appendChild(C.svgEl(GLYPH.medal, 'm-toast-medal'));
    toastNode.appendChild(el('div', 'm-toast-big', title));
    if (points) toastNode.appendChild(el('div', 'm-toast-pts', (points > 0 ? '+' : '') + points + ' Insight'));
    toastNode.classList.add('m-toast-show');
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      toastNode.classList.remove('m-toast-show');
    }, reducedMotion() ? 2400 : 1700);
  }

  /* ================= the mentor coach panel ================= */
  /* The visible face of the coach. say() shows the per-scene line; formats
     keep routing their existing feedback text through it unchanged. */

  function buildCoachPanel(opts) {
    opts = opts || {};
    var card = el('div', 'm-coach-card');
    var who = el('div', 'm-coach-who');
    who.appendChild(mentor(44));
    var names = el('div', 'm-coach-names');
    names.appendChild(el('b', null, 'Wawiwa AI Coach'));
    names.appendChild(el('span', null, opts.subtitle || 'riding along'));
    who.appendChild(names);
    card.appendChild(who);
    var line = el('p', 'm-coach-line', opts.line || '');
    card.appendChild(line);

    var wrap = el('div', 'm-coach');
    wrap.appendChild(card);
    var goal = null, reward = null;
    return {
      node: wrap,
      say: function (text) { line.textContent = text || ''; },
      goal: function (label, text) {
        if (!goal) {
          goal = el('div', 'm-goal');
          goal.appendChild(el('div', 'm-goal-k', label));
          goal.appendChild(el('p', 'm-goal-p', text));
          wrap.appendChild(goal);
        } else {
          goal.querySelector('.m-goal-k').textContent = label;
          goal.querySelector('.m-goal-p').textContent = text;
        }
      },
      reward: function (text) {
        if (C.LABELS.reward === null) return; // no reward chips on rise
        if (!reward) {
          reward = el('div', 'm-reward');
          reward.appendChild(C.svgEl(GLYPH.star, 'm-chip-ic'));
          reward.appendChild(el('span', null, text));
          wrap.appendChild(reward);
        } else {
          reward.lastChild.textContent = text;
        }
      }
    };
  }

  /* ================= the scene primitive + the stage ================= */
  /* One thing on screen at a time: a full-bleed backdrop, and a single calm
     white panel (the scene card) swapped with a cinematic but restrained
     beat. Reduced motion swaps instantly. */

  var SWAP_MS = 460;

  /* On step/case navigation, focus moves to the heading of the new scene so
     keyboard and screen-reader users land where the sighted eye lands
     (WCAG 2.4.3). The heading takes tabindex="-1" (focusable by script
     only, never in the tab order). */
  function focusHeading(sceneNode) {
    if (!sceneNode) return;
    var heading = sceneNode.querySelector('.m-scene-title')
      || sceneNode.querySelector('h1, h2');
    if (!heading) return;
    heading.setAttribute('tabindex', '-1');
    try { heading.focus({ preventScroll: false }); } catch (e) { heading.focus(); }
  }

  function buildScene(opts) {
    opts = opts || {};
    var scene = el('section', 'm-scene' + (opts.className ? ' ' + opts.className : ''));
    var head = null, body = el('div', 'm-scene-body'), foot = null;
    if (opts.badge || opts.title) {
      head = el('div', 'm-scene-head');
      if (opts.badge) head.appendChild(el('span', 'm-badge', opts.badge));
      var hwrap = el('div', 'm-scene-headings');
      if (opts.eyebrow) hwrap.appendChild(el('div', 'm-eyebrow', opts.eyebrow));
      if (opts.title) hwrap.appendChild(el('h1', 'm-scene-title', opts.title));
      head.appendChild(hwrap);
      scene.appendChild(head);
    }
    scene.appendChild(body);
    return {
      node: scene,
      body: body,
      foot: function () {
        if (!foot) {
          foot = el('div', 'm-scene-foot');
          scene.appendChild(foot);
        }
        return foot;
      }
    };
  }

  function buildStage(host) {
    var wrap = el('div', 'm-stagewrap');
    host.appendChild(wrap);
    return {
      node: wrap,
      swap: function (sceneNode) {
        var old = wrap.firstElementChild;
        if (reducedMotion()) {
          wrap.textContent = '';
          wrap.appendChild(sceneNode);
          return;
        }
        sceneNode.classList.add('m-enter');
        wrap.appendChild(sceneNode);
        if (old) {
          old.classList.add('m-exit');
          window.setTimeout(function () { if (old.parentNode) old.remove(); }, SWAP_MS);
        }
      }
    };
  }

  /* The full app shell: backdrop + topbar + stage, taking over the viewport.
     Formats call this once, then swap scenes on the stage. */
  function buildShell(rootNode, activity, hudOpts) {
    document.body.classList.add('mission-active');
    // the backdrop layers are fixed and siblings of the app, so the scrim
    // sits between the poster and the UI, never over the UI
    var backdrop = buildBackdrop(rootNode);
    var app = el('div', 'm-app');
    var hud = buildHud(activity, hudOpts);
    app.appendChild(hud.node);
    var main = el('div', 'm-main');
    app.appendChild(main);
    rootNode.appendChild(app);
    return { app: app, main: main, backdrop: backdrop, hud: hud };
  }

  /* ================= the designed report (one page, on-brand) ================= */
  /* A designed artifact, not a form printout: poster hero with the motif and
     the medal, a score line, then case cards. Formats hand rows in; nothing
     about a specific lesson lives here. */

  function buildReportSheet(activity, data) {
    var container = document.querySelector('.container') || document.body;
    var old = container.querySelector('.m-report-sheet');
    if (old) old.remove();
    var sheet = el('div', 'm-report-sheet');

    var hero = el('div', 'm-rep-hero');
    hero.appendChild(el('div', 'm-rep-motif'));
    var inner = el('div', 'm-rep-hero-inner');
    inner.appendChild(C.svgEl(C.SVG.logo, 'm-rep-logo'));
    var meta = activity.meta;
    inner.appendChild(el('div', 'm-rep-kicker',
      [meta.program, meta.module, meta.lesson].filter(Boolean).join('  ·  ')));
    inner.appendChild(el('h1', 'm-rep-title', C.LABELS.reportTitle + '  ·  ' + meta.title));
    if (data.scoreline && C.LABELS.scoreline) {
      var score = el('div', 'm-rep-score');
      score.appendChild(el('span', 'm-rep-score-n', String(data.scoreline.points)));
      score.appendChild(el('span', 'm-rep-score-of',
        data.scoreline.max ? 'of ' + data.scoreline.max + ' Insight' : 'Insight'));
      if (data.scoreline.rank) score.appendChild(el('span', 'm-rep-rank', data.scoreline.rank));
      inner.appendChild(score);
    }
    if (data.level) {
      inner.appendChild(el('div', 'm-rep-level m-rep-level-' + data.level.index, data.level.label));
    }
    hero.appendChild(inner);
    var medal = C.svgEl(GLYPH.medal, 'm-rep-medal');
    hero.appendChild(medal);
    sheet.appendChild(hero);

    (data.sections || []).forEach(function (section) {
      var block = el('div', 'm-rep-section');
      block.appendChild(el('h2', 'm-rep-section-title', section.title));
      var grid = el('div', 'm-rep-cards' + (section.wide ? ' m-rep-wide' : ''));
      (section.cards || []).forEach(function (cardData) {
        var card = el('div', 'm-rep-card');
        var headRow = el('div', 'm-rep-card-head');
        if (cardData.num) headRow.appendChild(el('span', 'm-rep-card-num', String(cardData.num)));
        headRow.appendChild(el('span', 'm-rep-card-title', cardData.title));
        if (cardData.tag) {
          var t = el('span', 'm-rep-tag m-rep-tag-' + cardData.tag.toLowerCase(), cardData.tag);
          headRow.appendChild(t);
        }
        card.appendChild(headRow);
        (cardData.rows || []).forEach(function (row) {
          var r = el('div', 'm-rep-row');
          if (row.label) r.appendChild(el('b', 'm-rep-row-label', row.label + ' '));
          r.appendChild(el('span', 'm-rep-row-value' + (row.empty ? ' m-rep-empty' : ''), row.value));
          card.appendChild(r);
        });
        grid.appendChild(card);
      });
      block.appendChild(grid);
      sheet.appendChild(block);
    });

    var foot = el('div', 'm-rep-foot');
    foot.appendChild(el('span', null, '© Wawiwa Tech | Confidential'));
    sheet.appendChild(foot);
    container.appendChild(sheet);
    document.body.classList.add('has-mission-report');
  }

  window.PracticeMission = {
    reducedMotion: reducedMotion,
    mentor: mentor,
    GLYPH: GLYPH,
    PALETTES: PALETTES,
    pointsConfig: pointsConfig,
    buildBackdrop: buildBackdrop,
    buildMedallion: buildMedallion,
    buildJourneyDots: buildJourneyDots,
    buildHud: buildHud,
    buildCoachPanel: buildCoachPanel,
    buildScene: buildScene,
    buildStage: buildStage,
    focusHeading: focusHeading,
    buildShell: buildShell,
    toast: toast,
    buildReportSheet: buildReportSheet
  };
})();

/*
 * Practice Studio — the personal path (Experience Library Phase E4).
 *
 * One shared outcome component for every format (coached_canvas,
 * branching_scenario, game_3d): at the end of an activity it evaluates the
 * student's OWN answers and choices against the rubric and the spec's
 * outcome_logic, deterministically and locally, and produces the "Your path"
 * recap: what went well, the specific gaps in severity order, the exact
 * "revisit this" pointers, and the matched resources from the activity's
 * vetted resources_pool (gap to topic to resources). The same data feeds the
 * designed end screen and the jsPDF report.
 *
 * Scope rules, non-negotiable:
 *  - HOME ONLY: the whole block exists only when meta.context is "home".
 *    Class activities never show a personal path or resources.
 *  - Computed in the browser, from the current session only. Nothing is
 *    stored, nothing is sent. The one optional network touch is the coach
 *    PHRASING the same recommendation through the existing proxy (live.js);
 *    the text sent is built from spec-authored labels, never student text.
 *  - The runtime never fetches the web: resources are baked links the
 *    student may click (plain navigation, new tab), exactly like the
 *    per-field resources.
 *  - An activity with no outcome_logic degrades to a neutral, encouraging
 *    recap: no errors, no empty section.
 *
 * Condition grammar (spec outcome_logic[].when, validated by build.py):
 *   rubric_weak:<id> | rubric_revise:<id> | field_weak:<id>
 *   | decision_weak:<scene id> | choice:<scene id>=<option id>
 *   | hotspots_skipped | all_strong
 */
(function () {
  'use strict';

  var C = window.PracticeCore;
  var M = window.PracticeMission;
  var FB = window.PracticeFeedback;
  var el = C.el;

  var FOCUS_CAP = 3; // severity order = authored order; capped to stay actionable

  function enabled(activity) {
    return ((activity.meta || {}).context) === 'home';
  }

  /* ---------- condition evaluation (pure, deterministic) ---------- */

  function rubricRow(evalResult, id) {
    return (evalResult.rubric || []).filter(function (r) { return r.id === id; })[0] || null;
  }

  function rubricTag(evalResult, id) {
    var row = rubricRow(evalResult, id);
    return row ? row.tag : null;
  }

  // a criterion with unanswered feeding fields (empty or non-answers) is
  // not fully evidenced: no focus card may coach it until the work is in
  function rubricIncomplete(evalResult, id) {
    var row = rubricRow(evalResult, id);
    return !!row && row.complete === false;
  }

  function conditionMet(when, activity, evalResult, answers, extras) {
    if (when === 'all_strong') {
      return evalResult.overall.levelIndex === 0;
    }
    if (when === 'hotspots_skipped') {
      return !!(extras && extras.hotspotsSkipped);
    }
    var kind = when.split(':')[0];
    var arg = when.slice(kind.length + 1);
    if (kind === 'rubric_weak') {
      if (rubricIncomplete(evalResult, arg)) return false;
      var t = rubricTag(evalResult, arg);
      return t === 'Light' || t === 'Revise';
    }
    if (kind === 'rubric_revise') {
      if (rubricIncomplete(evalResult, arg)) return false;
      return rubricTag(evalResult, arg) === 'Revise';
    }
    if (kind === 'field_weak') {
      // a field without a real answer (empty or "asdf") is "not answered",
      // never "weak": it belongs to the missing-count line, and a focus
      // card must not coach absent work
      var f = (evalResult.fields || {})[arg];
      return !!f && !f.empty && !f.nonAnswer && f.tag !== 'Ready';
    }
    if (kind === 'decision_weak') {
      var d = (evalResult.decisions || {})[arg];
      return !!d && !d.empty && d.tag !== 'Ready';
    }
    if (kind === 'choice') {
      var parts = arg.split('=');
      return (answers || {})['decision:' + parts[0]] === parts[1];
    }
    return false; // unknown condition kinds never fire
  }

  /* ---------- the computation ---------- */

  function rankFor(activity, points, max) {
    var bands = activity.outcome_ranks || [];
    if (!bands.length || !max) return null;
    var pct = Math.round(100 * points / max);
    for (var i = 0; i < bands.length; i++) {
      if (pct >= (bands[i].min_pct || 0)) return bands[i].label;
    }
    return null;
  }

  /* compute(activity, checks, answers, opts) -> the path, or null when the
     activity is not a home activity. opts: { points, max, extras } */
  function compute(activity, checks, answers, opts) {
    if (!enabled(activity)) return null;
    opts = opts || {};
    var evalResult = FB.evaluateActivity(activity, checks, answers);
    var rules = activity.outcome_logic || [];

    // "unanswered" counts fields without a REAL answer: blank, whitespace,
    // and non-answers like "asdf" are the same absence of evidence
    var missing = (evalResult.overall.unansweredCount || 0)
      + (evalResult.overall.unansweredPointCount || 0);
    var incomplete = missing > 0;

    var focus = [];
    var positive = null;
    rules.forEach(function (rule) {
      if (!conditionMet(rule.when, activity, evalResult, answers, opts.extras)) return;
      if (rule.when === 'all_strong') {
        // an incomplete canvas can never be told it is Ready: the positive
        // branch is suppressed entirely while required work is unanswered
        if (!positive && !incomplete) positive = rule;
        return;
      }
      if (focus.length >= FOCUS_CAP) return;
      focus.push({
        focus: rule.focus,
        review: rule.review || null,
        reviewLabel: rule.review ? FB.routeLabel(rule.review, activity) : null,
        resources: FB.resolveResources(rule.resources, activity)
      });
    });
    if (focus.length) positive = null; // gaps outrank the positive path

    var strengths = (evalResult.rubric || []).filter(function (r) {
      return r.tag === 'Ready';
    }).map(function (r) { return r.name; });

    return {
      evalResult: evalResult,
      neutral: !rules.length,
      incomplete: incomplete,
      missing: missing,
      strengths: strengths,
      focus: focus,
      positive: positive ? {
        focus: positive.focus,
        resources: FB.resolveResources(positive.resources, activity)
      } : null,
      rank: rankFor(activity, opts.points || 0, opts.max || 0)
    };
  }

  /* the leading line of an incomplete path: what is missing comes first,
     before any coaching, on every surface (screen, PDF, coach phrasing) */
  function missingLine(result) {
    // "without a real answer" reads correctly for both causes: a blank
    // field and one holding a filler like "asdf"
    var n = result.missing;
    return n === 1
      ? 'You have 1 field without a real answer yet. Fill it in, then run the review again.'
      : 'You have ' + n + ' fields without a real answer yet. Fill those in, then run the review again.';
  }

  /* the deterministic path as plain text: the PDF rows and the coach
     phrasing call both read from this same content */
  function summaryText(result) {
    var lines = [];
    if (result.incomplete) {
      lines.push(missingLine(result));
    }
    if (result.strengths.length) {
      lines.push('What went well: ' + result.strengths.join('; ') + '.');
    }
    result.focus.forEach(function (f, i) {
      var line = 'Focus ' + (i + 1) + ': ' + f.focus;
      if (f.reviewLabel) line += ' Revisit: ' + f.reviewLabel + '.';
      if (f.resources.length) {
        line += ' Resources: ' + f.resources.map(function (r) { return r.title; }).join('; ') + '.';
      }
      lines.push(line);
    });
    if (result.positive) {
      var p = 'Outcome: ' + result.positive.focus;
      if (result.positive.resources.length) {
        p += ' Resources: ' + result.positive.resources.map(function (r) { return r.title; }).join('; ') + '.';
      }
      lines.push(p);
    }
    if (result.neutral) {
      lines.push(neutralLine(result));
    }
    if (result.rank) lines.push('Rank: ' + result.rank + '.');
    return lines.join('\n');
  }

  /* the neutral recap line, aware of whether the work is actually done */
  function neutralLine(result) {
    return result.incomplete
      ? C.LABELS.pathNeutral
      : 'The whole activity is complete. Keep the same standard on the next one: concrete, grounded, in your own words.';
  }

  /* ---------- the designed "Your path" block (Mission skin) ---------- */

  function resourceRows(host, resources) {
    resources.forEach(function (res) {
      var row = el('div', 'm-path-res');
      var link = el('a', 'resource-link', res.title);
      link.href = res.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      row.appendChild(link);
      if (res['for']) row.appendChild(el('span', 'resource-for', res['for']));
      host.appendChild(row);
    });
  }

  /* buildPathBlock(activity, state, opts) -> node or null.
     opts: { points, max, extras, onNav } */
  function buildPathBlock(activity, state, opts) {
    if (!enabled(activity)) return null;
    opts = opts || {};
    var result = compute(activity, state.checks, state.answers, opts);
    if (!result) return null;
    state.lastPath = result; // the report reads the same computation

    var block = el('div', 'm-path');
    var head = el('div', 'm-path-head');
    head.appendChild(M.mentor(40, 'm-path-bot'));
    var headText = el('div', 'm-path-headings');
    headText.appendChild(el('h3', 'm-path-title', 'Your path'));
    headText.appendChild(el('p', 'm-path-sub',
      'Computed from your own answers, on this device, this session only.'));
    head.appendChild(headText);
    if (result.rank) head.appendChild(el('span', 'm-path-rank', result.rank));
    block.appendChild(head);

    // the path leads with what is missing: the count line renders above
    // everything else, and no card below may claim work that is not there
    if (result.incomplete) {
      block.appendChild(el('p', 'm-path-missing', missingLine(result)));
    }

    if (result.strengths.length) {
      var strong = el('div', 'm-path-strong');
      strong.appendChild(el('div', 'm-path-k', 'What you did well'));
      var chips = el('div', 'm-path-chips');
      result.strengths.forEach(function (name) {
        chips.appendChild(el('span', 'm-path-chip', name));
      });
      strong.appendChild(chips);
      block.appendChild(strong);
    }

    if (result.focus.length) {
      var list = el('div', 'm-path-list');
      list.appendChild(el('div', 'm-path-k', 'Focus next on'));
      result.focus.forEach(function (f, i) {
        var card = el('div', 'm-path-card');
        var row = el('div', 'm-path-row');
        row.appendChild(el('span', 'm-path-num', String(i + 1)));
        var body = el('div', 'm-path-body');
        body.appendChild(el('p', 'm-path-focus', f.focus));
        if (f.reviewLabel) {
          // the lesson/topic name is bold AND accent-colored (>=4.5:1), so it
          // reads without color too; the sentence around it stays normal
          var review = el('p', 'm-path-review', 'Revisit: ');
          review.appendChild(el('strong', 'm-path-target', f.reviewLabel));
          body.appendChild(review);
        }
        if (f.resources.length) resourceRows(body, f.resources);
        row.appendChild(body);
        card.appendChild(row);
        list.appendChild(card);
      });
      block.appendChild(list);
    } else if (result.positive) {
      var pos = el('div', 'm-path-positive');
      pos.appendChild(el('p', 'm-path-focus', result.positive.focus));
      if (result.positive.resources.length) {
        var extra = el('div', 'm-path-body');
        extra.appendChild(el('div', 'm-path-k', 'If you want to go deeper'));
        resourceRows(extra, result.positive.resources);
        pos.appendChild(extra);
      }
      block.appendChild(pos);
    } else {
      // graceful degrade: no outcome_logic (or nothing matched) — a neutral,
      // encouraging recap, never an error or an empty section
      block.appendChild(el('p', 'm-path-focus', neutralLine(result)));
    }

    // optional coach phrasing: same recommendation, mentor voice. Off = the
    // deterministic version above stands as-is.
    if (C.liveOn()) {
      var coachOut = C.liveRegion();
      var btnRow = el('div', 'btn-row');
      btnRow.appendChild(C.coachButton(state, 'Hear it from the coach', function (b) {
        b.disabled = true;
        C.coachThinking(coachOut);
        window.PracticeLive.coachPath(activity, summaryText(result))
          .then(function (r) {
            b.disabled = false;
            C.coachBlock(coachOut, r.text, null, activity);
            state.lastPathCoachText = r.text || '';
          })
          .catch(function (err) {
            b.disabled = false;
            C.coachFallback(state, coachOut, err, null);
          });
      }));
      block.appendChild(btnRow);
      block.appendChild(coachOut);
    }
    return block;
  }

  /* ---------- the report section (screen sheet + jsPDF, one data model) ---------- */

  /* reportSection(activity, state, opts) -> a section for the shared report
     data model, or null (class context / nothing to say). Always the
     deterministic version; the coach phrasing rides along when it was asked. */
  function reportSection(activity, state, opts) {
    if (!enabled(activity)) return null;
    var result = state.lastPath
      || compute(activity, state.checks, state.answers, opts || {});
    if (!result) return null;

    var cards = [];
    if (result.incomplete) {
      // the printed record is as honest as the screen: the missing work
      // leads, before any strength or focus card
      cards.push({ title: 'Still unanswered', rows: [{ value: missingLine(result) }] });
    }
    if (result.strengths.length) {
      cards.push({
        title: 'What you did well',
        tag: 'Ready',
        rows: [{ value: result.strengths.join('; ') }]
      });
    }
    result.focus.forEach(function (f, i) {
      var rows = [{ value: f.focus }];
      if (f.reviewLabel) rows.push({ label: 'Revisit:', value: f.reviewLabel });
      f.resources.forEach(function (r) {
        rows.push({ label: 'Resource:', value: r.title + (r['for'] ? ' (' + r['for'] + ')' : '') + ' - ' + r.url });
      });
      cards.push({ num: i + 1, title: 'Focus next', rows: rows });
    });
    if (!result.focus.length) {
      var posRows = [{
        value: result.positive ? result.positive.focus : neutralLine(result)
      }];
      ((result.positive || {}).resources || []).forEach(function (r) {
        posRows.push({ label: 'Resource:', value: r.title + ' - ' + r.url });
      });
      cards.push({ title: 'Where you stand', tag: result.positive ? 'Ready' : null, rows: posRows });
    }
    if (state.lastPathCoachText) {
      cards.push({ title: 'The coach’s phrasing', rows: [{ value: state.lastPathCoachText }] });
    }

    // "Your personal path" in the report: the branching formats already use
    // a "Your path" section for the scenes traveled
    var title = 'Your personal path' + (result.rank ? '  ·  ' + result.rank : '');
    return { title: title, cards: cards, wide: true };
  }

  window.PracticeOutcome = {
    enabled: enabled,
    compute: compute,
    summaryText: summaryText,
    buildPathBlock: buildPathBlock,
    reportSection: reportSection,
    _conditionMet: conditionMet,
    _missingLine: missingLine
  };
})();

/*
 * Practice Studio — client-side image attachment (the L5 diagram block).
 *
 * A spec declares attachments at the top level:
 *   "attachments": [{ "id": "att_diagram", "title": "...", "instruction": "..." }]
 * and coached_canvas renders one labelled attach control per entry at the top
 * of the work screen. Everything is client-only: the student picks or drops a
 * PNG/JPG, it is downscaled on a canvas (longest edge capped, re-encoded as
 * JPEG) and stored as a data URL INSIDE the answers blob, so the ordinary
 * autosave, restore, and "Clear my work" all cover it. The image never leaves
 * the browser except inside the PDF the student saves (engine/export.js draws
 * it with the vendored jsPDF). No network code lives here, ever.
 *
 * Storage form (one answers key per attachment id):
 *   answers[att.id] = JSON string {"kind":"attachment","src":dataURL,"w":n,"h":n}
 * Attachments are not fields: they carry no points, no rubric weight, and do
 * not gate Ready — some students draw on paper and photograph it, others skip.
 */
(function () {
  'use strict';

  var MAX_EDGE = 1600;     // longest image edge after downscale, px
  var JPEG_QUALITY = 0.7;  // re-encode quality; keeps the stored copy small

  function isImageType(type) {
    return type === 'image/png' || type === 'image/jpeg';
  }

  /* cap the longest edge, keeping the aspect ratio (pure, tested) */
  function capDimensions(w, h, maxEdge) {
    var cap = maxEdge || MAX_EDGE;
    var longest = Math.max(w, h);
    if (!longest || longest <= cap) return { w: w, h: h, scaled: false };
    var k = cap / longest;
    return {
      w: Math.max(1, Math.round(w * k)),
      h: Math.max(1, Math.round(h * k)),
      scaled: true
    };
  }

  /* the stored answers value for an attachment, or null when the value is
     ordinary text / missing / malformed (pure, tested) */
  function parseStored(value) {
    if (typeof value !== 'string' || value.charAt(0) !== '{') return null;
    try {
      var obj = JSON.parse(value);
      if (obj && obj.kind === 'attachment'
        && typeof obj.src === 'string' && /^data:image\/jpeg[;,]/.test(obj.src)
        && obj.w > 0 && obj.h > 0) {
        return obj;
      }
    } catch (e) { /* an ordinary text answer, not an attachment */ }
    return null;
  }

  /* every declared attachment that holds an image, in spec order — the shape
     engine/export.js draws and reportData ships (pure, tested) */
  function attachmentData(activity, state) {
    var out = [];
    ((activity && activity.attachments) || []).forEach(function (att) {
      var stored = parseStored(((state || {}).answers || {})[att.id]);
      if (stored) out.push({ title: att.title, src: stored.src, w: stored.w, h: stored.h });
    });
    return out;
  }

  /* ---------- browser-only below: read, downscale, render ---------- */

  function readAndDownscale(file, done) {
    if (!file || !isImageType(file.type)) {
      done('That file is not a PNG or JPG image. Export your diagram as PNG or JPG and try again.');
      return;
    }
    var reader = new FileReader();
    reader.onerror = function () { done('That file could not be read. Try a different copy.'); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { done('That file does not open as an image. Export it as PNG or JPG and try again.'); };
      img.onload = function () {
        try {
          var dims = capDimensions(img.naturalWidth, img.naturalHeight, MAX_EDGE);
          var canvas = document.createElement('canvas');
          canvas.width = dims.w;
          canvas.height = dims.h;
          var ctx = canvas.getContext('2d');
          // JPEG has no transparency: white paper behind a transparent PNG
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, dims.w, dims.h);
          ctx.drawImage(img, 0, 0, dims.w, dims.h);
          done(null, {
            kind: 'attachment',
            src: canvas.toDataURL('image/jpeg', JPEG_QUALITY),
            w: dims.w,
            h: dims.h
          }, dims.scaled);
        } catch (e) {
          done('That image could not be processed. Try a smaller PNG or JPG.');
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  /* the labelled attach control: real <label> tied to the file input (the
     input itself is the keyboard path), drag-and-drop as an extra, thumbnail
     with alt text, Replace / Remove buttons, and a live status line */
  function buildEditor(state, activity, att, opts) {
    opts = opts || {};
    var C = window.PracticeCore;
    var el = C.el;

    var block = el('div', 'm-attach');
    block.id = 'attach-' + att.id;
    block.appendChild(el('h3', 'm-fieldblock-title', att.title));

    if (att.instruction) {
      var instr = el('div', 'm-instructions');
      var ik = el('div', 'm-instructions-k');
      ik.appendChild(el('span', null, 'Instructions'));
      instr.appendChild(ik);
      instr.appendChild(el('p', 'm-instructions-p', att.instruction));
      block.appendChild(instr);
    }

    var zone = el('div', 'm-attach-zone');
    var label = el('label', 'm-attach-label', 'Attach your diagram (PNG or JPG)');
    var inputId = 'attach-input-' + att.id;
    label.htmlFor = inputId;
    zone.appendChild(label);
    var input = el('input', 'm-attach-input');
    input.type = 'file';
    input.id = inputId;
    input.accept = 'image/png,image/jpeg';
    zone.appendChild(input);
    zone.appendChild(el('p', 'm-attach-hint',
      'Pick a file or drop it here. It stays on this device and saves into your PDF.'));
    block.appendChild(zone);

    var status = el('p', 'm-attach-status');
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');
    block.appendChild(status);

    var preview = el('div', 'm-attach-preview');
    block.appendChild(preview);

    function persisted() {
      try {
        var raw = localStorage.getItem('practice-studio:' + activity.meta.id);
        return !!raw && JSON.parse(raw)[att.id] === state.answers[att.id];
      } catch (e) { return false; }
    }

    function renderPreview() {
      preview.textContent = '';
      var stored = parseStored(state.answers[att.id]);
      zone.classList.toggle('m-attach-zone-filled', !!stored);
      if (!stored) return;
      var fig = el('figure', 'm-attach-fig');
      var img = el('img', 'm-attach-thumb');
      img.src = stored.src;
      img.alt = att.title;
      fig.appendChild(img);
      var row = el('div', 'btn-row');
      var replace = el('button', 'btn btn-ghost', 'Replace');
      replace.type = 'button';
      replace.addEventListener('click', function () { input.click(); });
      row.appendChild(replace);
      var remove = el('button', 'btn btn-ghost-danger', 'Remove');
      remove.type = 'button';
      remove.addEventListener('click', function () {
        delete state.answers[att.id];
        C.saveAnswers(activity, state.answers);
        input.value = '';
        status.textContent = 'Attachment removed.';
        renderPreview();
        if (opts.onChange) opts.onChange();
      });
      row.appendChild(remove);
      fig.appendChild(row);
      preview.appendChild(fig);
    }

    function accept(file) {
      status.textContent = 'Reading the image...';
      readAndDownscale(file, function (err, stored, scaled) {
        if (err) { status.textContent = err; return; }
        state.answers[att.id] = JSON.stringify(stored);
        C.saveAnswers(activity, state.answers);
        var note = scaled ? ' It was downscaled to keep the page fast.' : '';
        if (!persisted()) {
          // near the storage quota: keep the in-session copy, never crash
          note += ' It is too large to keep saved on this device, so re-attach'
            + ' it if you reload; it still lands in your PDF.';
        }
        status.textContent = 'Diagram attached.' + note;
        renderPreview();
        if (opts.onChange) opts.onChange();
      });
    }

    input.addEventListener('change', function () {
      if (input.files && input.files[0]) accept(input.files[0]);
    });
    zone.addEventListener('dragover', function (e) {
      e.preventDefault();
      zone.classList.add('m-attach-zone-over');
    });
    zone.addEventListener('dragleave', function () {
      zone.classList.remove('m-attach-zone-over');
    });
    zone.addEventListener('drop', function (e) {
      e.preventDefault();
      zone.classList.remove('m-attach-zone-over');
      var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) accept(file);
    });

    renderPreview();
    return block;
  }

  window.PracticeAttach = {
    isImageType: isImageType,
    capDimensions: capDimensions,
    parseStored: parseStored,
    attachmentData: attachmentData,
    buildEditor: buildEditor
  };
})();

/*
 * Practice Studio format: branching_scenario, the Mission decision game.
 *
 * Rendered through the shared Mission skin (engine/mission.js): a full-bleed
 * poster backdrop with a per-scene raster slot, one calm scene card at a
 * time, the robot mentor voicing the existing feedback text, Insight points,
 * a medallion that fills, a journey map that locks in gold, a
 * consequence-reveal beat, and a designed Mission Report PDF.
 *
 * Every mechanic is unchanged: decisions resolve through
 * PracticeFeedback.evaluateDecision, reflections through the shared
 * fieldEditor, the review through evaluateActivity + the shared level banner
 * (which is also where passback hooks), autosave through the same answer
 * keys. This file is presentation only.
 */
(function () {
  'use strict';

  var C = window.PracticeCore;
  var M = window.PracticeMission;
  var FB = window.PracticeFeedback;
  var el = C.el;
  var PATH_KEY = '_scenePath';

  /* ---------- spec helpers (unchanged mechanics) ---------- */

  function scenesOf(activity) { return FB.collectScenes(activity); }

  function sceneById(activity, id) {
    return scenesOf(activity).filter(function (s) { return s.id === id; })[0] || null;
  }

  function nextSceneId(activity, scene, option) {
    if (option && option.goto !== undefined) return option.goto;
    var all = scenesOf(activity);
    var idx = all.indexOf(scene);
    return idx >= 0 && idx + 1 < all.length ? all[idx + 1].id : null;
  }

  /* ---------- Insight points: spec-driven, derived from decisions ---------- */

  function optionPoints(option, cfg) {
    if (typeof option.points === 'number') return option.points;
    return cfg[option.quality] || 0;
  }

  function decidedOption(activity, scene, state) {
    var chosenId = state.answers[FB.decisionKey(scene)];
    if (!chosenId) return null;
    return (scene.decision.options || []).filter(function (o) {
      return o.id === chosenId;
    })[0] || null;
  }

  function tallyPoints(activity, state, cfg) {
    var total = 0;
    scenesOf(activity).forEach(function (scene) {
      var option = decidedOption(activity, scene, state);
      if (option) total += optionPoints(option, cfg);
    });
    return total;
  }

  function maxPointsOnPath(activity, state, cfg) {
    var max = 0;
    (state.answers[PATH_KEY] || []).forEach(function (sceneId) {
      var scene = sceneById(activity, sceneId);
      if (!scene) return;
      max += Math.max.apply(null, (scene.decision.options || []).map(function (o) {
        return optionPoints(o, cfg);
      }).concat([0]));
    });
    return max;
  }

  /* ---------- HUD refresh: points, medallion, journey ---------- */

  var RECAP_NODE = '_recap';

  function refreshHud(activity, state) {
    var cfg = state.missionPoints;
    state.shell.hud.setPoints(tallyPoints(activity, state, cfg));
    var all = scenesOf(activity);
    var decided = all.filter(function (s) { return !!decidedOption(activity, s, state); });
    state.shell.hud.medallion.set(state.atEnding ? all.length : decided.length, all.length);
    var journey = state.shell.hud.journey;
    if (journey) {
      all.forEach(function (s) {
        var isDecided = !!decidedOption(activity, s, state);
        var isCurrent = !state.atEnding && state.currentSceneId === s.id;
        journey.set(s.id, isCurrent ? 'active' : (isDecided ? 'done' : 'todo'));
      });
      journey.set(RECAP_NODE, state.atEnding ? 'done' : 'todo');
    }
  }

  /* ---------- the title scene ---------- */

  function buildTitleScene(activity, state, onStart) {
    var scene = M.buildScene({
      eyebrow: [activity.meta.program, activity.meta.module].filter(Boolean).join('  ·  '),
      title: activity.meta.title
    });
    scene.node.querySelector('.m-scene-title').classList.add('m-scene-title-big');
    if (activity.intro && activity.intro.body) {
      scene.body.appendChild(el('p', 'm-lead', activity.intro.body));
    }

    var say = el('div', 'm-mentor-say');
    say.appendChild(M.mentor(50));
    var sayBody = el('div');
    sayBody.appendChild(el('b', null, 'Wawiwa AI Coach'));
    sayBody.appendChild(el('div', 'm-mentor-text',
      'I ride along on every stop. Read the scene, make your call, and I will tell you where it lands.'));
    say.appendChild(sayBody);
    scene.body.appendChild(say);

    var chips = el('div', 'meta-chips title-chips');
    if (activity.meta.estimated_minutes) {
      chips.appendChild(el('span', 'meta-chip', activity.meta.estimated_minutes + ' min'));
    }
    chips.appendChild(el('span', 'meta-chip', scenesOf(activity).filter(function (s) {
      return !/detour/i.test(s.kicker || '');
    }).length + ' decisions'));
    chips.appendChild(el('span', 'meta-chip' + (C.liveOn() ? ' meta-chip-live' : ''),
      C.liveOn() ? 'Live coach' : 'Local coach'));
    scene.body.appendChild(chips);

    // the PII rule, one glance; the full authored notice one tap away
    var safety = el('div', 'safety-mini game-safety');
    var line = el('button', 'safety-line');
    line.type = 'button';
    line.appendChild(C.svgEl(C.SVG.shield, 'safety-glyph'));
    line.appendChild(el('span', null, 'No real names, IDs, or secrets. Generalize.'));
    var full = el('div', 'safety-full');
    full.appendChild(el('p', null, (activity.safety || {}).student_notice || ''));
    var clearBtn = el('button', 'btn btn-ghost btn-small', 'Clear my work');
    clearBtn.type = 'button';
    clearBtn.addEventListener('click', function () {
      if (window.confirm('Delete everything you wrote on this device? This cannot be undone.')) {
        C.clearAnswers(activity);
        window.location.reload();
      }
    });
    full.appendChild(clearBtn);
    line.addEventListener('click', function () { full.classList.toggle('safety-open'); });
    safety.appendChild(line);
    safety.appendChild(full);
    scene.body.appendChild(safety);

    var foot = scene.foot();
    foot.appendChild(el('span', 'm-spacer'));
    var started = (state.answers[PATH_KEY] || []).length > 0;
    var start = el('button', 'btn btn-primary btn-large', started ? 'Continue your mission' : 'Start the mission');
    start.type = 'button';
    start.addEventListener('click', onStart);
    foot.appendChild(start);
    return scene.node;
  }

  /* ---------- one scene card at a time ---------- */

  function buildSceneCard(activity, state, scene, onAdvance) {
    var all = scenesOf(activity);
    var stop = all.indexOf(scene) + 1;
    var card = M.buildScene({
      badge: 'Stop ' + stop + ' / ' + all.length,
      eyebrow: scene.kicker || 'Decision',
      title: scene.title
    });
    if (scene.setup) card.body.appendChild(el('p', 'm-lead', scene.setup));
    card.body.appendChild(el('p', 'm-ask', scene.decision.prompt));

    var choices = el('div', 'm-choices');
    card.body.appendChild(choices);

    // the consequence beat: the mentor reacts inside the calm zone; a live
    // region so the verdict is announced when it appears (WCAG 4.1.3)
    var cq = el('div', 'm-cq');
    cq.setAttribute('aria-live', 'polite');
    card.body.appendChild(cq);

    function showConsequence(option, isFresh) {
      var d = FB.evaluateDecision(scene, option.id, activity, state.checks);
      cq.textContent = '';
      cq.classList.remove('m-cq-shown');
      void cq.offsetWidth; // restart the reveal beat
      cq.classList.add('m-cq-shown');

      var who = el('div', 'm-cq-who');
      who.appendChild(M.mentor(30));
      who.appendChild(el('b', null, 'Wawiwa AI Coach'));
      who.appendChild(C.tagPill(d.tag));
      (option.routes_to || []).forEach(function (key) {
        var num = (key.match(/\d+/) || [''])[0];
        var route = el('span', 'route-chip');
        route.title = (activity.lesson_map || {})[key] || key;
        route.appendChild(el('span', null, 'Lesson ' + num));
        who.appendChild(route);
      });
      cq.appendChild(who);
      cq.appendChild(el('p', 'm-cq-text', option.consequence));
      var pts = optionPoints(option, state.missionPoints);
      cq.appendChild(el('div', 'm-cq-pts' + (pts > 0 ? '' : ' m-cq-pts-none'),
        pts > 0 ? '+' + pts + ' Insight' : 'No Insight this time, but now you know.'));
      if (d.resources && d.resources.length) {
        var reads = el('div', 'cq-resources');
        C.appendResources(reads, d.resources);
        cq.appendChild(reads);
      }

      if (scene.reflection) {
        var editor = C.fieldEditor(state, activity, scene.reflection, {
          embedded: true,
          badge: '✎',
          checkLabel: 'Check'
        });
        editor.card.classList.add('game-reflect');
        cq.appendChild(editor.card);
      }

      var nextId = nextSceneId(activity, scene, option);
      var row = el('div', 'm-cq-actions');
      var advance = el('button', 'btn btn-primary', nextId ? 'Continue' : 'See the mission report');
      advance.type = 'button';
      advance.addEventListener('click', function () { onAdvance(nextId); });
      row.appendChild(advance);
      cq.appendChild(row);

      if (isFresh) {
        refreshHud(activity, state);
        if (pts > 0) M.toast(d.tag === 'Ready' ? 'A sharp call' : 'Call logged', pts);
      }
    }

    var letters = ['A', 'B', 'C', 'D'];
    (scene.decision.options || []).forEach(function (option, i) {
      var tile = el('button', 'm-choice');
      tile.type = 'button';
      tile.appendChild(el('span', 'm-choice-key', letters[i] || '•'));
      tile.appendChild(el('span', 'm-choice-label', option.label));
      tile.addEventListener('click', function () {
        if (state.answers[FB.decisionKey(scene)]) return; // a call commits once
        state.answers[FB.decisionKey(scene)] = option.id;
        C.saveAnswers(activity, state.answers);
        Array.prototype.forEach.call(choices.children, function (c) {
          c.classList.add('m-choice-dim');
          c.classList.add('m-choice-lock');
        });
        tile.classList.remove('m-choice-dim');
        tile.classList.add('m-choice-committed');
        showConsequence(option, true);
      });
      choices.appendChild(tile);
    });

    var foot = card.foot();
    foot.appendChild(el('span', 'm-foot-note', scene.kicker || ''));
    foot.appendChild(el('span', 'm-spacer'));
    foot.appendChild(el('span', 'm-foot-note', 'Stop ' + stop + ' of ' + all.length));

    // resume: a decision already made on this scene replays its consequence
    var chosen = decidedOption(activity, scene, state);
    if (chosen) {
      Array.prototype.forEach.call(choices.children, function (c, i) {
        var isChosen = (scene.decision.options[i] || {}).id === chosen.id;
        c.classList.add('m-choice-lock');
        c.classList.toggle('m-choice-committed', isChosen);
        c.classList.toggle('m-choice-dim', !isChosen);
      });
      showConsequence(chosen, false);
    }
    return card.node;
  }

  /* ---------- the ending: the mission report scene ---------- */

  function rankFor(activity, pts, max) {
    if (!max) return null;
    var pct = Math.round(100 * pts / max);
    var ranks = ((activity.mission || {}).ranks || []);
    for (var i = 0; i < ranks.length; i++) {
      if (pct >= (ranks[i].min_pct || 0)) return ranks[i].label;
    }
    return null;
  }

  function buildEndingScene(activity, state) {
    var cfg = state.missionPoints;
    var pts = tallyPoints(activity, state, cfg);
    var max = maxPointsOnPath(activity, state, cfg);
    var rank = rankFor(activity, pts, max);

    var scene = M.buildScene({
      eyebrow: 'End of the mission',
      title: 'Where your path led'
    });

    var scoreline = el('div', 'm-scoreline');
    scoreline.appendChild(el('span', 'm-score-n', String(pts)));
    var scoreRest = el('span', 'm-score-of', 'of ' + max + ' Insight');
    scoreline.appendChild(scoreRest);
    if (rank) scoreline.appendChild(el('span', 'm-rank', rank));
    scene.body.appendChild(scoreline);

    var recap = el('div', 'm-recap');
    (state.answers[PATH_KEY] || []).forEach(function (sceneId, i) {
      var s = sceneById(activity, sceneId);
      if (!s) return;
      var d = FB.evaluateDecision(s, state.answers[FB.decisionKey(s)], activity, state.checks);
      var row = el('div', 'm-recap-row');
      row.appendChild(el('span', 'm-recap-step', String(i + 1)));
      var body = el('div', 'm-recap-body');
      body.appendChild(el('div', 'm-recap-title', s.title));
      if (d.option) body.appendChild(el('div', 'm-recap-choice', d.option.label));
      row.appendChild(body);
      row.appendChild(d.tag ? C.tagPill(d.tag) : el('span', 'tag-pill tag-none', '·'));
      recap.appendChild(row);
    });
    scene.body.appendChild(recap);

    var btn = el('button', 'btn btn-teal', 'Review my scenario');
    btn.type = 'button';
    var out = C.liveRegion('review-out');
    var coachOut = C.liveOn() ? C.liveRegion() : null;

    btn.addEventListener('click', function () {
      out.textContent = '';
      var evalResult = FB.evaluateActivity(activity, state.checks, state.answers);
      state.lastEval = evalResult;
      out.appendChild(C.levelBanner(evalResult));
      out.appendChild(C.rubricBox(evalResult));
      out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    var btnRow = el('div', 'btn-row ending-actions');
    btnRow.appendChild(btn);
    if (coachOut) {
      btnRow.appendChild(C.coachButton(state, 'Mentor debrief', function (b) {
        b.disabled = true;
        C.coachThinking(coachOut);
        window.PracticeLive.coachCanvas(activity, state.answers)
          .then(function (r) { b.disabled = false; C.coachBlock(coachOut, r.text, null, activity); })
          .catch(function (err) { b.disabled = false; C.coachFallback(state, coachOut, err, function () { btn.click(); }); });
      }));
    }
    scene.body.appendChild(btnRow);
    if (coachOut) scene.body.appendChild(coachOut);
    scene.body.appendChild(out);

    // the personal path (E4): home activities only; the component gates on
    // meta.context, so class games render nothing here
    var pathBlock = window.PracticeOutcome.buildPathBlock(activity, state, {
      points: pts,
      max: max
    });
    if (pathBlock) scene.body.appendChild(pathBlock);

    var foot = scene.foot();
    var restartBtn = el('button', 'btn btn-ghost', 'Play a different path');
    restartBtn.type = 'button';
    restartBtn.addEventListener('click', function () {
      if (!window.confirm('Start over? Decisions reset; reflections stay saved.')) return;
      scenesOf(activity).forEach(function (s) { delete state.answers[FB.decisionKey(s)]; });
      state.answers[PATH_KEY] = [];
      C.saveAnswers(activity, state.answers);
      window.location.reload();
    });
    foot.appendChild(restartBtn);
    foot.appendChild(el('span', 'm-spacer'));
    var printBtn = el('button', 'btn btn-primary');
    printBtn.type = 'button';
    printBtn.appendChild(C.svgEl(C.SVG.download, 'btn-icon'));
    printBtn.appendChild(el('span', null, 'Save the mission report (PDF)'));
    printBtn.addEventListener('click', function () {
      // code-generated PDF: no browser print footer, embed-safe
      window.PracticeExport.saveReport(activity, reportData(activity, state));
    });
    foot.appendChild(printBtn);
    return scene.node;
  }

  /* ---------- the designed export: the Mission Report ---------- */

  /* one data model feeds both the on-screen report sheet (browser print
     path) and the code-generated PDF (engine/export.js) */
  function reportData(activity, state) {
    var cfg = state.missionPoints;
    var pts = tallyPoints(activity, state, cfg);
    var max = maxPointsOnPath(activity, state, cfg);

    var pathCards = [];
    (state.answers[PATH_KEY] || []).forEach(function (sceneId, i) {
      var s = sceneById(activity, sceneId);
      if (!s) return;
      var d = FB.evaluateDecision(s, state.answers[FB.decisionKey(s)], activity, state.checks);
      var rows = [];
      if (d.option) {
        rows.push({ label: 'Your call:', value: d.option.label });
        rows.push({ label: 'Where it led:', value: d.option.consequence });
      } else {
        rows.push({ value: 'No call made on this stop.', empty: true });
      }
      pathCards.push({ num: i + 1, title: s.title, tag: d.tag || null, rows: rows });
    });

    var reflectionCards = [];
    FB.collectFields(activity).forEach(function (field, i) {
      var text = (state.answers[field.id] || '').trim();
      reflectionCards.push({
        num: i + 1,
        title: field.label,
        rows: [{ value: text || 'Not written yet.', empty: !text }]
      });
    });

    var level = state.lastEval ? {
      index: state.lastEval.overall.levelIndex,
      label: state.lastEval.overall.level
    } : null;

    var sections = [
      { title: 'Your path', cards: pathCards, wide: true },
      { title: 'Your reflections', cards: reflectionCards }
    ];
    // the personal path rides in the same report (home activities only)
    var pathSection = window.PracticeOutcome.reportSection(activity, state, {
      points: pts,
      max: max
    });
    if (pathSection) sections.push(pathSection);

    return {
      scoreline: { points: pts, max: max, rank: rankFor(activity, pts, max) },
      level: level,
      sections: sections
    };
  }

  function buildReport(activity, state) {
    M.buildReportSheet(activity, reportData(activity, state));
  }

  /* ---------- the format ---------- */

  function renderBranchingScenario(rootNode, activity, checks, state) {
    if (!Array.isArray(state.answers[PATH_KEY])) state.answers[PATH_KEY] = [];
    state.missionPoints = M.pointsConfig(activity);

    var all = scenesOf(activity);
    var journeyItems = all.map(function (s) {
      return { id: s.id, label: s.title };
    }).concat([{ id: RECAP_NODE, label: 'Mission report' }]);

    state.shell = M.buildShell(rootNode, activity, {
      total: all.length,
      journeyItems: journeyItems
    });
    var stage = M.buildStage(state.shell.main);
