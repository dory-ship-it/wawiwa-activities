      });
    }
    if (rule.has_number !== undefined) {
      return /\d/.test(text) === !!rule.has_number;
    }
    if (rule.count_min) {
      var re = new RegExp(rule.count_min.regex, 'g');
      var m = (text || '').match(re);
      return (m ? m.length : 0) >= rule.count_min.min;
    }
    if (rule.each_line_contains_any) {
      var cfg = rule.each_line_contains_any;
      var minW = cfg.min_line_words || 1;
      var lines = (text || '').split(/\n+/).filter(function (l) {
        return words(l).length >= minW;
      });
      if (!lines.length) return containsAny(text || '', cfg.terms);
      return lines.every(function (l) { return containsAny(l, cfg.terms); });
    }
    if (rule.no_pii !== undefined) {
      return (detectPII(text).length === 0) === !!rule.no_pii;
    }
    if (rule.regex) {
      return new RegExp(rule.regex, 'i').test(text || '');
    }
    return true; // unknown rule kinds never block the student
  }

  /* ---------- routing ---------- */

  function lessonLabel(key, lessonMap) {
    var name = (lessonMap || {})[key] || key;
    var num = (key.match(/\d+/) || [null])[0];
    return num ? 'Lesson ' + num + ' (' + name + ')' : name;
  }

  // A routes_to key may point at a section (finer) or a lesson. Section
  // names resolve as-is; lesson keys keep the "Lesson N (name)" form.
  function routeLabel(key, activity) {
    var sections = activity.section_map || {};
    if (sections[key]) return sections[key];
    return lessonLabel(key, activity.lesson_map);
  }

  // The routing text stays one string; targets carries the resolved lesson or
  // topic names so the renderer can emphasize them inside the sentence (v2e).
  function routingLine(field, activity, strings) {
    var routes = field.routes_to || [];
    if (!routes.length) return null;
    var labels = routes.map(function (k) {
      return routeLabel(k, activity);
    });
    return {
      text: fmt(strings.routing_line, { lessons: labels.join(' and ') }),
      targets: labels
    };
  }

  // Resolve a resources list to renderable {title, url, for} links. Entries
  // are inline objects or string ids into the activity's resources_pool (E4);
  // unknown ids and non-https links are dropped rather than rendered broken.
  function resolveResources(list, activity) {
    var pool = {};
    ((activity && activity.resources_pool) || []).forEach(function (r) {
      if (r && r.id) pool[r.id] = r;
    });
    var out = [];
    (list || []).forEach(function (entry) {
      var r = typeof entry === 'string' ? pool[entry] : entry;
      if (!r || !r.title || !/^https:\/\//i.test(r.url || '')) return;
      out.push({
        title: r.title,
        url: r.url,
        'for': r['for'] || [r.type, r.source].filter(Boolean).join(' · ')
          || r.why || ''
      });
    });
    return out;
  }

  // per-topic reading, surfaced only when the answer is not yet Ready
  function weakResources(item, activity) {
    return resolveResources(item.resources, activity);
  }

  /* ---------- lesson/topic references inside free coach text ---------- */
  /* The live coach's verdict is free model text; any "Lesson N" or topic
     mention in it should stand out exactly like the deterministic routing
     line. This splits a text into segments, marking real lesson/topic
     references only: the "Lesson N" word form (English, Spanish, Hebrew)
     and the activity's own lesson_map / section_map names, whole-name
     matches only. Pure and DOM-free so the renderer and the tests share it. */

  var LESSON_REF_RE = /\b(?:Lesson|Lecci[óo]n)\s+\d+\b|שיעור\s+\d+/gi;

  function isWordChar(ch) {
    if (!ch) return false;
    try { return /[\p{L}\p{N}]/u.test(ch); } catch (e) { return /\w/.test(ch); }
  }

  function lessonRefSegments(text, activity) {
    text = String(text || '');
    var names = [];
    [((activity || {}).lesson_map) || {}, ((activity || {}).section_map) || {}]
      .forEach(function (map) {
        Object.keys(map).forEach(function (key) {
          var name = String(map[key] || '').trim();
          if (name.length >= 4) names.push(name); // conservative: skip trivial names
        });
      });
    names.sort(function (a, b) { return b.length - a.length; });

    var hits = [];
    var m;
    LESSON_REF_RE.lastIndex = 0;
    while ((m = LESSON_REF_RE.exec(text)) !== null) {
      hits.push({ start: m.index, end: m.index + m[0].length });
    }
    var low = text.toLowerCase();
    names.forEach(function (name) {
      var needle = name.toLowerCase();
      var at = low.indexOf(needle);
      while (at !== -1) {
        // whole-name matches only, never inside a longer word
        if (!isWordChar(text.charAt(at - 1)) && !isWordChar(text.charAt(at + needle.length))) {
          hits.push({ start: at, end: at + needle.length });
        }
        at = low.indexOf(needle, at + needle.length);
      }
    });
    hits.sort(function (a, b) { return a.start - b.start || b.end - a.end; });

    var segments = [];
    var pos = 0;
    hits.forEach(function (h) {
      if (h.start < pos) return; // overlap: the earlier / longer match wins
      if (h.start > pos) segments.push({ text: text.slice(pos, h.start), hit: false });
      segments.push({ text: text.slice(h.start, h.end), hit: true });
      pos = h.end;
    });
    if (pos < text.length) segments.push({ text: text.slice(pos), hit: false });
    return segments;
  }

  /* ---------- field evaluation ---------- */

  function evaluateField(field, text, checksFile, activity) {
    var strings = getStrings(checksFile);
    var trimmed = (text || '').trim();
    var result = {
      fieldId: field.id,
      tag: TAGS.READY,
      empty: false,
      messages: [],
      piiWarnings: [],
      routing: null
    };

    var safety = (activity && activity.safety) || {};
    var pii = detectPII(trimmed, safety.redact_before_ai);
    pii.forEach(function (p) {
      result.piiWarnings.push(fmt(strings.pii_warning, { what: p.label }));
    });
    // a real person's identifying detail is not a "careful" nudge: the coach
    // will refuse to send this answer at all, so the local verdict says so
    result.identityPII = pii.some(function (p) { return p.identity; });
    if (result.identityPII) {
      result.piiWarnings = [fmt(strings.identity_warning,
        { what: pii.filter(function (p) { return p.identity; })[0].label })];
    }

    if (!trimmed) {
      result.empty = true;
      result.tag = TAGS.REVISE;
      result.messages.push(strings.empty_field);
      result.routing = null; // routing only helps once there is something to revise
      return result;
    }

    // the universal guard runs before any per-field rule: a filler or
    // gibberish answer is Revise even when the field's own rules would pass
    if (isNonAnswer(trimmed)) {
      result.tag = TAGS.REVISE;
      result.nonAnswer = true; // no evidence: the guards treat this like empty
      result.messages.push(strings.non_answer);
      var isHomeGuard = !!(activity && activity.meta && activity.meta.context === 'home');
      var guardLine = isHomeGuard ? routingLine(field, activity, strings) : null;
      result.routing = guardLine ? guardLine.text : null;
      result.routingTargets = guardLine ? guardLine.targets : [];
      result.resources = isHomeGuard ? weakResources(field, activity) : [];
      return result;
    }

    var defs = (checksFile && checksFile.definitions) || {};
    var checkIds = field.quality_checks || [];
    var failures = 0;
    checkIds.forEach(function (id) {
      var def = defs[id];
      var passed;
      if (def && def.pass) {
        passed = evalRule(def.pass, trimmed);
        if (!passed) result.messages.push(def.fail_message || strings.unknown_check_fail);
      } else {
        passed = evalRule({ min_words: 8 }, trimmed); // generic substance fallback
        if (!passed) result.messages.push(strings.unknown_check_fail);
      }
      if (!passed) failures++;
    });

    var total = checkIds.length || 1;
    if (failures === 0) {
      result.tag = TAGS.READY;
    } else if (failures / total <= 0.5) {
      result.tag = TAGS.LIGHT;
    } else {
      result.tag = TAGS.REVISE;
    }

    // PII anywhere blocks a clean Ready: the exercise forbids identifying data.
    if (result.tag === TAGS.READY && result.piiWarnings.length) {
      result.tag = TAGS.LIGHT;
    }
    // a real person's detail is never Light: it has to come out before the
    // answer can be checked at all, so it is always Revise.
    if (result.identityPII) {
      result.tag = TAGS.REVISE;
    }

    if (result.tag !== TAGS.READY) {
      // The per-field "revisit Lesson N" routing and the matched resources are
      // part of the personal path, which is a home-only feature. Class activities
      // keep the immediate correctness feedback (result.messages) but never show
      // the lesson-revisit pointer or resources. Gated off meta.context.
      var isHome = !!(activity && activity.meta && activity.meta.context === 'home');
      var line = isHome ? routingLine(field, activity, strings) : null;
      result.routing = line ? line.text : null;
      result.routingTargets = line ? line.targets : [];
      result.resources = isHome ? weakResources(field, activity) : [];
    }
    if (result.tag === TAGS.READY && !result.messages.length) {
      result.messages.push(strings.ready_note);
    }
    return result;
  }

  /* ---------- ordered points (pitch planner) evaluation ---------- */

  function evaluatePoint(prompt, text, checksFile) {
    var strings = getStrings(checksFile);
    var cfg = (checksFile && checksFile.ordered_points) || {};
    var minW = cfg.min_words || 3;
    var maxW = cfg.max_words || 120;
    var trimmed = (text || '').trim();
    var result = { promptId: prompt.id, tag: TAGS.READY, empty: false, messages: [] };

    if (!trimmed) {
      result.empty = true;
      result.tag = TAGS.REVISE;
      result.messages.push(strings.empty_point);
      return result;
    }
    if (isNonAnswer(trimmed)) {
      result.tag = TAGS.REVISE;
      result.nonAnswer = true; // no evidence: the guards treat this like empty
      result.messages.push(strings.non_answer);
      return result;
    }
    var n = words(trimmed).length;
    if (n < minW) {
      result.tag = TAGS.LIGHT;
      result.messages.push(cfg.too_short_message || strings.unknown_check_fail);
    } else if (n > maxW) {
      result.tag = TAGS.LIGHT;
      result.messages.push(cfg.too_long_message || strings.unknown_check_fail);
    } else {
      result.messages.push(strings.ready_note);
    }
    return result;
  }

  /* ---------- rubric + overall ---------- */

  function getStrings(checksFile) {
    var out = {};
    var override = (checksFile && checksFile.strings) || {};
    Object.keys(DEFAULT_STRINGS).forEach(function (k) {
      out[k] = override[k] || DEFAULT_STRINGS[k];
    });
    return out;
  }

  function collectFields(activity) {
    var fields = [];
    (activity.sections || []).forEach(function (s) {
      if (s.type === 'fields') fields = fields.concat(s.fields || []);
      if (s.type === 'scenes') {
        (s.scenes || []).forEach(function (scene) {
          if (scene.reflection) fields.push(scene.reflection);
        });
      }
    });
    return fields;
  }

  function collectScenes(activity) {
    var scenes = [];
    (activity.sections || []).forEach(function (s) {
      if (s.type === 'scenes') scenes = scenes.concat(s.scenes || []);
    });
    return scenes;
  }

  /* ---------- branching decisions (scenes sections) ---------- */

  var QUALITY_TAG = { strong: TAGS.READY, mixed: TAGS.LIGHT, weak: TAGS.REVISE };

  function decisionKey(scene) {
    return 'decision:' + scene.id;
  }

  // A decision is judged by its authored quality; a weak-on-dependency choice
  // surfaces the same "revisit Lesson N" routing as a weak field.
  function evaluateDecision(scene, optionId, activity, checksFile) {
    var strings = getStrings(checksFile);
    var result = { sceneId: scene.id, tag: null, empty: true, option: null, routing: null };
    var option = (scene.decision.options || []).filter(function (o) {
      return o.id === optionId;
    })[0];
    if (!option) return result;
    result.empty = false;
    result.option = option;
    result.tag = QUALITY_TAG[option.quality] || TAGS.LIGHT;
    if (result.tag !== TAGS.READY) {
      if ((option.routes_to || []).length) {
        var labels = (option.routes_to || []).map(function (k) {
          return routeLabel(k, activity);
        });
        result.routing = fmt(strings.routing_line_decision, { lessons: labels.join(' and ') });
      }
      result.resources = weakResources(scene, activity);
    }
    return result;
  }

  function collectPrompts(activity) {
    var prompts = [];
    (activity.sections || []).forEach(function (s) {
      if (s.type === 'ordered_points') prompts = prompts.concat(s.prompts || []);
    });
    return prompts;
  }

  function evaluateActivity(activity, checksFile, answers) {
    var strings = getStrings(checksFile);
    answers = answers || {};
    var fields = collectFields(activity);
    var prompts = collectPrompts(activity);

    // evidence = a real answer: empty and non-answer ("asdf", "a") are the
    // same absence, and none of the guards may treat them differently
    function real(r) { return !r.empty && !r.nonAnswer; }

    var fieldResults = {};
    fields.forEach(function (f) {
      fieldResults[f.id] = evaluateField(f, answers[f.id], checksFile, activity);
    });

    // branching decisions (scenes sections); answers hold the chosen option
    // id under "decision:<sceneId>". Unreached scenes are not penalized: on a
    // branch, the student legitimately never sees some scenes. Only scenes on
    // the traveled path (a recorded answer) or with no answer AND marked
    // visited by the caller count. We treat "answered" as the signal.
    var scenes = collectScenes(activity);
    var decisionResults = {};
    scenes.forEach(function (scene) {
      decisionResults[scene.id] =
        evaluateDecision(scene, answers[decisionKey(scene)], activity, checksFile);
    });

    var pointResults = {};
    prompts.forEach(function (p) {
      pointResults[p.id] = evaluatePoint(p, answers[p.id], checksFile);
    });

    // pitch total-length note
    var notes = [];
    var cfg = (checksFile && checksFile.ordered_points) || {};
    var totalPitch = prompts.reduce(function (sum, p) {
      return sum + words(answers[p.id]).length;
    }, 0);
    if (cfg.total_max_words && totalPitch > cfg.total_max_words) {
      notes.push(cfg.total_too_long_message || strings.unknown_check_fail);
    }

    // rubric verdicts
    var rubricAuto = (checksFile && checksFile.rubric_auto) || {};
    var rubric = (activity.rubric || []).map(function (crit) {
      // the pitch's own mastery signal: seven points in order, each within
      // its word bounds, the whole thing tight enough for three minutes.
      // Ready only on the pitch's OWN pass; a finished canvas alone earns
      // nothing here.
      if (rubricAuto[crit.id] === 'pitch_ready') {
        if (!prompts.length) {
          return { id: crit.id, name: crit.name, tag: null, verdict: strings.rubric_live_only };
        }
        var emptyPts = prompts.filter(function (p) { return pointResults[p.id].empty; });
        var unansweredPts = prompts.filter(function (p) { return !real(pointResults[p.id]); });
        // no evidence at all is "not answered", never "weak": a criterion
        // cannot be coached on work that does not exist (tag null keeps
        // rubric_weak / rubric_revise / profile_* rules from firing)
        if (unansweredPts.length === prompts.length) {
          return { id: crit.id, name: crit.name, tag: null, complete: false,
            verdict: strings.rubric_not_answered };
        }
        if (emptyPts.length) {
          return {
            id: crit.id, name: crit.name, tag: TAGS.REVISE, complete: false,
            verdict: fmt(strings.pitch_incomplete_note, { n: emptyPts.length })
          };
        }
        var weakPts = prompts.filter(function (p) { return pointResults[p.id].tag !== TAGS.READY; });
        var overTotal = cfg.total_max_words && totalPitch > cfg.total_max_words;
        if (weakPts.length || overTotal) {
          var labels = weakPts.map(function (p) { return p.label; });
          if (overTotal) labels.push('the total length');
          return {
            id: crit.id, name: crit.name, tag: TAGS.LIGHT,
            complete: !unansweredPts.length,
            verdict: fmt(strings.rubric_light, { fields: labels.join('; ') })
          };
        }
        return { id: crit.id, name: crit.name, tag: TAGS.READY, complete: true,
          verdict: strings.rubric_ready };
      }
      if (rubricAuto[crit.id] === 'all_fields_filled') {
        var requiredF = fields.filter(function (f) { return f.required !== false; });
        var emptyF = requiredF.filter(function (f) { return fieldResults[f.id].empty; });
        var unansweredF = requiredF.filter(function (f) { return !real(fieldResults[f.id]); });
        // a canvas with no real answer in it is "not answered", not "weak"
        // (see above): "asdf" everywhere is the same absence as blank
        if (requiredF.length && unansweredF.length === requiredF.length) {
          return { id: crit.id, name: crit.name, tag: null, complete: false,
            verdict: strings.rubric_not_answered };
        }
        return {
          id: crit.id,
          name: crit.name,
          tag: emptyF.length ? TAGS.REVISE : TAGS.READY,
          complete: !unansweredF.length,
          verdict: emptyF.length
            ? fmt(strings.rubric_incomplete, {
                n: emptyF.length,
                fields: emptyF.map(function (f) { return f.label; }).join('; ')
              })
            : fmt(strings.rubric_complete, { n: fields.length })
        };
      }
      var linked = fields.filter(function (f) {
        return (f.rubric_refs || []).indexOf(crit.id) !== -1;
      });
      var linkedScenes = scenes.filter(function (s) {
        return (s.rubric_refs || []).indexOf(crit.id) !== -1;
      });
      if (!linked.length && !linkedScenes.length) {
        return { id: crit.id, name: crit.name, tag: null, verdict: strings.rubric_live_only };
      }
      // the evidence gate: a criterion whose every linked field lacks a real
      // answer (empty OR a filler like "asdf") and whose every linked
      // decision is unanswered has NOTHING to be judged on. It is "not
      // answered", never "weak": tag null (the same mechanism as a
      // coach-only criterion) so no rubric_weak / rubric_revise / profile_*
      // rule can coach work that does not exist.
      var anyEvidence = linked.some(function (f) {
        return real(fieldResults[f.id]);
      }) || linkedScenes.some(function (s) {
        return !decisionResults[s.id].empty;
      });
      if (!anyEvidence) {
        return { id: crit.id, name: crit.name, tag: null, complete: false,
          verdict: strings.rubric_not_answered };
      }
      var worst = TAGS.READY;
      var weakLabels = [];
      linked.forEach(function (f) {
        var t = fieldResults[f.id].tag;
        if (TAG_RANK[t] > TAG_RANK[worst]) worst = t;
        if (t !== TAGS.READY) weakLabels.push(f.label);
      });
      linkedScenes.forEach(function (s) {
        var d = decisionResults[s.id];
        if (d.empty) return; // unreached branch: not judged
        if (TAG_RANK[d.tag] > TAG_RANK[worst]) worst = d.tag;
        if (d.tag !== TAGS.READY) weakLabels.push(s.title);
      });
      var verdict = worst === TAGS.READY
        ? strings.rubric_ready
        : fmt(worst === TAGS.LIGHT ? strings.rubric_light : strings.rubric_revise, {
            fields: weakLabels.join('; ')
          });
      // complete = every linked FIELD holds a real answer (unreached branch
      // decisions are legitimately unanswered and never count against
      // completeness); the profile writes only fully-evidenced dimensions
      // on a partial run, and focus cards fire only on complete dimensions
      var allAnswered = linked.every(function (f) {
        return real(fieldResults[f.id]);
      });
      return { id: crit.id, name: crit.name, tag: worst, complete: allAnswered,
        verdict: verdict };
    });

    // overall level
    var required = fields.filter(function (f) { return f.required !== false; });
    var emptyCount = 0, unansweredCount = 0, reviseCount = 0, lightCount = 0;
    required.forEach(function (f) {
      var r = fieldResults[f.id];
      if (r.empty) emptyCount++;
      if (!real(r)) unansweredCount++; // empty OR a non-answer: no evidence
      if (r.tag === TAGS.REVISE) reviseCount++;
      else if (r.tag === TAGS.LIGHT) lightCount++;
    });
    // answered decisions weigh in like fields; unreached branches do not
    scenes.forEach(function (s) {
      var d = decisionResults[s.id];
      if (d.empty) return;
      if (d.tag === TAGS.REVISE) reviseCount++;
      else if (d.tag === TAGS.LIGHT) lightCount++;
    });
    var severity = 2 * reviseCount + lightCount;
    var levelIndex;
    if (reviseCount >= 3 || severity >= 6) {
      levelIndex = 2; // significant revision
    } else if (reviseCount >= 1 || lightCount >= 3) {
      levelIndex = 1; // light completion
    } else {
      levelIndex = 0; // ready
    }

    // an unfinished pitch keeps the activity from a clean Ready
    var emptyPoints = prompts.filter(function (p) { return pointResults[p.id].empty; });
    var unansweredPoints = prompts.filter(function (p) { return !real(pointResults[p.id]); });
    if (emptyPoints.length) {
      notes.push(fmt(strings.pitch_incomplete_note, { n: emptyPoints.length }));
      if (levelIndex === 0) levelIndex = 1;
    }

    var levels = activity.completion_levels || ['Ready', 'Almost', 'Revise'];

    // two highest-value fixes: worst fields first, in canvas order
    var fixes = [];
    [TAGS.REVISE, TAGS.LIGHT].forEach(function (tag) {
      fields.forEach(function (f) {
        if (fixes.length >= 2) return;
        var r = fieldResults[f.id];
        if (r.tag === tag) {
          var why = r.messages[0] || '';
          fixes.push({ fieldId: f.id, label: f.label, message: why });
        }
      });
    });

    return {
      fields: fieldResults,
      points: pointResults,
      decisions: decisionResults,
      rubric: rubric,
      notes: notes,
      overall: {
        level: levels[levelIndex],
        levelIndex: levelIndex,
        emptyCount: emptyCount,
        emptyPointCount: emptyPoints.length,
        unansweredCount: unansweredCount,
        unansweredPointCount: unansweredPoints.length,
        reviseCount: reviseCount,
        lightCount: lightCount,
        fixes: fixes
      }
    };
  }

  var api = {
    TAGS: TAGS,
    evalRule: evalRule,
    detectPII: detectPII,
    IDENTITY_PATTERNS: IDENTITY_PATTERNS,
    isNonAnswer: isNonAnswer,
    hasRealAnswer: hasRealAnswer,
    evaluateField: evaluateField,
    evaluatePoint: evaluatePoint,
    evaluateDecision: evaluateDecision,
    evaluateActivity: evaluateActivity,
    collectFields: collectFields,
    collectPrompts: collectPrompts,
    collectScenes: collectScenes,
    decisionKey: decisionKey,
    routeLabel: routeLabel,
    resolveResources: resolveResources,
    lessonRefSegments: lessonRefSegments
  };

  root.PracticeFeedback = api;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/*
 * Practice Studio — client-side PII redactor (Phase 2).
 * Runs over the student's text BEFORE anything is substituted into a coach
 * prompt and sent to the proxy. Unredacted text never leaves the browser.
 * The Worker applies the same patterns again server-side as a second layer.
 * Pure, DOM-free, mirrors the pattern list in the activity spec's
 * safety.redact_before_ai and in proxy/worker.js.
 */
(function (root) {
  'use strict';

  var PATTERNS = [
    { name: 'email_addresses', re: /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, sub: '[email removed]' },
    { name: 'government_ids', re: /\b\d{3}[-\s]\d{2,3}[-\s]\d{4}\b/g, sub: '[id removed]' },
    { name: 'street_addresses', re: /\b\d{1,5}\s*(?:st|nd|rd|th)?[\s,]+[A-Za-z0-9.'\u2019-]+[\s,]+(?:street|st|avenue|ave|road|rd|boulevard|blvd|lane|ln|drive|dr|court|ct|place|pl|way)\b/gi, sub: '[address removed]' },
    { name: 'postal_codes', re: /\b(?:zip|postal)\s*code\b\s*(?:is|:|=|,)?\s*[A-Za-z0-9][A-Za-z0-9-]{2,9}\b/gi, sub: '[postcode removed]' },
    { name: 'phone_numbers', re: /\+?\d(?:[\s().\-]?\d){8,}/g, sub: '[number removed]' },
    { name: 'long_digit_sequences', re: /\d{9,}/g, sub: '[number removed]' },
    {
      name: 'api_key_shaped_tokens',
      re: /\b(?=[A-Za-z0-9_\-]{20,}(\b|$))(?=[^\s]*\d)(?=[^\s]*[A-Za-z])[A-Za-z0-9_\-]{20,}\b/g,
      sub: '[token removed]'
    }
  ];

  function redact(text) {
    var out = String(text || '');
    PATTERNS.forEach(function (p) {
      p.re.lastIndex = 0;
      out = out.replace(p.re, p.sub);
    });
    return out;
  }

  root.PracticeRedact = { redact: redact, PATTERNS: PATTERNS };
})(typeof window !== 'undefined' ? window : this);

<script>
/*
 * Practice Studio — live coach client (Phase 2).
 *
 * Talks to the Wawiwa anonymizing proxy when the center has the live layer
 * on. This file is only bundled into a page when the build config enables
 * live AI; the default (off) build contains no network code at all.
 *
 * What it sends per call: the coach system prompt, the activity's grounding
 * pack, and one call prompt with the student's REDACTED text substituted in.
 * No identifier of any kind. Every failure path rejects quickly so the
 * engine can fall back to the local deterministic feedback.
 *
 * The ONE thing it does block: an answer carrying a real person's
 * identifying detail is never sent at all (see the identity gate below).
 *
 * Prompt templates come from the activity's coach_prompts.md (bundled at
 * build time into window.LIVE.prompts). The placeholder vocabulary this
 * client substitutes is part of the generator contract:
 *   {field.label} {field.help} {field.quality_checks}
 *   {resolved names of field.rubric_refs}
 *   {field.routes_to as lesson names, or "none"}
 *   {student_text} {all_fields_concatenated} {pitch_text}
 *   {short_canvas_summary}
 */
(function (root) {
  'use strict';

  var TAG_RE = /\b(Ready|Light|Revise)\b[.!\s"']*$/;
  var CALL_TIMEOUT_MS = 20000;

  var usedTokens = 0;

  function cfg() {
    return root.LIVE || null;
  }

  function available() {
    var c = cfg();
    return !!(c && c.enabled && c.proxy_url);
  }

  function capReached() {
    var c = cfg();
    if (!c) return true;
    return usedTokens >= (c.session_token_cap || 25000);
  }

  function usage() {
    var c = cfg() || {};
    return { used: usedTokens, cap: c.session_token_cap || 25000 };
  }

  /* ---------- prompt assembly ---------- */

  function fill(template, values) {
    var out = template || '';
    Object.keys(values).forEach(function (key) {
      out = out.split('{' + key + '}').join(values[key]);
    });
    return out;
  }

  function lessonNames(field, activity) {
    var routes = field.routes_to || [];
    if (!routes.length) return 'none';
    // section keys resolve to the specific section name, one voice with the
    // local engine's routing
    return routes.map(function (k) {
      return root.PracticeFeedback.routeLabel(k, activity);
    }).join('; ');
  }

  // per-topic resources ride along so the coach can point at them by name
  function resourceNote(item, activity) {
    var reads = root.PracticeFeedback.resolveResources(item.resources, activity);
    if (!reads.length) return '';
    return '\n\nRecommended resource for this field (mention it briefly if the answer is weak): '
      + reads.map(function (r) { return '"' + r.title + '" (' + r['for'] + ')'; }).join('; ');
  }

  function rubricNames(field, activity) {
    var refs = field.rubric_refs || [];
    var byId = {};
    (activity.rubric || []).forEach(function (r) { byId[r.id] = r.name; });
    return refs.map(function (id) { return byId[id] || id; }).join('; ') || 'none';
  }

  function redacted(text) {
    return root.PracticeRedact.redact(text || '');
  }

  function buildFieldCall(field, activity, studentText) {
    return fill(cfg().prompts.field, {
      'field.label': field.label,
      'field.help': field.help || '',
      'field.quality_checks': (field.quality_checks || []).join(', ') || 'none',
      'resolved names of field.rubric_refs': rubricNames(field, activity),
      'field.routes_to as lesson names, or "none"': lessonNames(field, activity),
      'student_text': redacted(studentText)
    }) + resourceNote(field, activity);
  }

  function concatFields(activity, answers) {
    var FB = root.PracticeFeedback;
    return FB.collectFields(activity).map(function (f) {
      var n = f.number !== undefined ? f.number + '. ' : '';
      return n + f.label + ':\n' + redacted(answers[f.id] || '(empty)');
    }).join('\n\n');
  }

  function shortCanvasSummary(activity, answers) {
    var FB = root.PracticeFeedback;
    // the pitch draft itself is never canvas context: the pitch call carries
    // it separately as {pitch_text}
    return FB.collectFields(activity).filter(function (f) {
      return f.ai_action !== 'pitch';
    }).map(function (f) {
      var words = redacted(answers[f.id] || '').split(/\s+/).slice(0, 20).join(' ');
      return f.label + ': ' + (words || '(empty)');
    }).join('\n');
  }

  function concatPitch(activity, answers) {
    var FB = root.PracticeFeedback;
    var prompts = FB.collectPrompts(activity);
    if (prompts.length) {
      return prompts.map(function (p, i) {
        return (i + 1) + '. ' + p.label + '\n' + redacted(answers[p.id] || '(empty)');
      }).join('\n\n');
    }
    // no ordered points: the pitch lives in the spec-flagged free-text field
    // (the final homework's f13_pitch_plan)
    return FB.collectFields(activity).filter(function (f) {
      return f.ai_action === 'pitch';
    }).map(function (f) {
      return redacted(answers[f.id] || '(empty)');
    }).join('\n\n');
  }

  /* ---------- the empty-canvas guard ---------- */
  /* The whole-canvas call must know what is NOT there: how many required
     fields (and pitch points) lack a REAL answer — blank, whitespace, and
     fillers like "asdf" all count (PracticeFeedback.hasRealAnswer is the
     one shared test). A canvas with no real answer anywhere is never sent
     at all — there is nothing to review, and the deterministic line below
     stands in for the coach without spending a token. */

  var EMPTY_CANVAS_MSG = 'There is nothing to review yet: no field holds '
    + 'a real answer. Write your answers first, then ask for the review again.';

  function unanswered(activity, answers) {
    var FB = root.PracticeFeedback;
    answers = answers || {};
    var items = FB.collectFields(activity).filter(function (f) {
      return f.required !== false;
    }).concat(FB.collectPrompts(activity));
    var missing = items.filter(function (item) {
      return !FB.hasRealAnswer(answers[item.id]);
    }).length;
    return { missing: missing, total: items.length };
  }

  function incompleteNote(state) {
    if (!state.missing) return '';
    return '\n\nIMPORTANT: this canvas is INCOMPLETE. ' + state.missing
      + ' of ' + state.total + ' fields have no real answer yet (blank, or '
      + 'a placeholder like "asdf"). Rules for this review: say so first '
      + 'and name how many fields lack a real answer. Do not praise work '
      + 'that is not there, and never open with a compliment on an '
      + 'incomplete canvas. Coach only the fields that actually contain an '
      + 'answer; make no claim about any other field beyond noting it has '
      + 'no answer yet.';
  }

  function buildCanvasCall(activity, answers) {
    return fill(cfg().prompts.canvas, {
      'all_fields_concatenated': concatFields(activity, answers)
    }) + incompleteNote(unanswered(activity, answers));
  }

  function buildPitchCall(activity, answers) {
    return fill(cfg().prompts.pitch, {
      'pitch_text': concatPitch(activity, answers),
      'short_canvas_summary': shortCanvasSummary(activity, answers)
    });
  }

  /* ---------- the in-lesson chat call ----------
     One question per call, with the screen the lesson says the learner is
     on and, at most, the last exchange (never the full history). The
     screen fields come from the lesson's wawiwa-coach-context message:
     they are Wawiwa content, but they arrive from outside the page, so
     each is cut to a length. Every piece of learner text (the question,
     the case notes, the last question) is redacted here, after the
     identity gate in coachChat has passed it. */

  var CHAT_FIELD_MAX = { screen: 12, chapterTitle: 60, step: 40, screenType: 12, note: 700 };
  var CHAT_QUESTION_MAX = 300;
  var CHAT_CASE_MAX = 1200;

  function clip(text, max) {
    return String(text || '').replace(/\s+/g, ' ').trim().slice(0, max);
  }

  // the screen types whose case notes ride along: the pack names them
  // (chat.case_types, passed in by the chat format), 'case' by default
  function isCaseScreen(ctx) {
    return (ctx.caseTypes || ['case']).indexOf(ctx.screenType) !== -1;
  }

  function buildChatCall(ctx, question, prev) {
    var caseBlock = '';
    if (isCaseScreen(ctx) && clip(ctx.caseNotes, CHAT_CASE_MAX)) {
      caseBlock = '\nThe learner\'s own case notes (already redacted): """'
        + redacted(clip(ctx.caseNotes, CHAT_CASE_MAX)) + '"""';
    }
    var last = '';
    if (prev && prev.q && prev.a) {
      last = '\nLast exchange. Learner: """' + redacted(clip(prev.q, CHAT_QUESTION_MAX))
        + '""" Coach: """' + redacted(clip(prev.a, 600)) + '"""';
    }
    return fill(cfg().prompts.chat, {
      'screen_id': clip(ctx.screen, CHAT_FIELD_MAX.screen),
      'n': String(parseInt(ctx.chapter, 10) || ''),
      'chapters': String(parseInt(ctx.chapters, 10) || ''),
      'chapter_title': clip(ctx.chapterTitle, CHAT_FIELD_MAX.chapterTitle),
      'step_verb': clip(ctx.step, CHAT_FIELD_MAX.step),
      'screen_type': clip(ctx.screenType, CHAT_FIELD_MAX.screenType),
      'note': clip(ctx.note, CHAT_FIELD_MAX.note),
      'case_block': caseBlock,
      'last_exchange': last,
      'question': redacted(clip(question, CHAT_QUESTION_MAX))
    });
  }

  /* ---------- the identity gate (layer 1) ----------
     The redactor is layer 2: it scrubs an email or a digit run out of the
     text on its way to the proxy. It never covered a name, a street or a
     postcode, so on its own it is not a control over identity.

     This is layer 1. An answer carrying a real person's identifying detail
     is not scrubbed, it is NOT SENT: no POST, no proxy, no vendor, no token
     spend. It blocks the VALUE and allows the CATEGORY, because describing
     the category is what these activities actually ask for. "The About
     section gave a home city" passes; "he lives at 24 2nd Street" does not.

     These patterns are unconditional. Unlike safety.redact_before_ai, an
     activity spec cannot narrow or disable them: identity is a floor.

     Resolving rather than rejecting is deliberate. Every call site already
     renders a coach box on resolve, so the student gets a real Revise
     verdict and a usable instruction, instead of the generic "the live
     coach is unavailable" fallback that a rejection would produce. */

  var PII_GATE = [
    { what: 'an email address',
      re: /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/ },
    { what: 'a government ID number',
      re: /\b\d{3}[-\s]\d{2,3}[-\s]\d{4}\b/ },
    { what: 'a phone or ID number',
      re: /\+?\d(?:[\s().\-]?\d){6,}/ },
    { what: 'a street address',
      re: /\b\d{1,5}\s*(?:st|nd|rd|th)?[\s,]+[A-Za-z0-9.'\u2019-]+[\s,]+(?:street|st|avenue|ave|road|rd|boulevard|blvd|lane|ln|drive|dr|court|ct|place|pl|way)\b/i },
    { what: 'a postal code',
      re: /\b(?:zip|postal)\s*code\b\s*(?:is|:|=|,)?\s*[A-Za-z0-9][A-Za-z0-9-]{2,9}\b/i },
    { what: 'a person\u2019s name',
      re: /\b(?:full|real|last|first|maiden|legal)\s+name\s*(?:is|was|:|=)\s*["\u201c']?[A-Z][A-Za-z'\u2019-]+/ },
    { what: 'a person\u2019s name',
      re: /\b(?:his|her|their|my)\s+(?:[a-z]+\s+){0,2}name\s*(?:is|was|:|=)\s*["\u201c']?[A-Z][A-Za-z'\u2019-]+/i },
    { what: 'a person\u2019s name',
      re: /\b(?:is|was|are|were)\s+named\s+["\u201c']?[A-Z][A-Za-z'\u2019-]+\s+[A-Z][A-Za-z'\u2019-]+/ },
    { what: 'a person\u2019s name',
      re: /\bsurname\s*(?:is|was|:|=)\s*["\u201c']?[A-Z][A-Za-z'\u2019-]+/i },
    { what: 'a person\u2019s name',
      re: /\b(?:the\s+(?:owner|manager|contact|partner|target|victim|customer|client|employee|colleague|student|person|candidate|recruiter))\b[^.\n]{0,28}\b(?:named|name\s*(?:is|was|:|=)|called)\s*["\u201c']?[A-Z][A-Za-z'\u2019-]+/i },
    { what: 'a date of birth',
      re: /\b(?:date\s+of\s+birth|d\.?o\.?b\.?|born(?:\s+on)?)\s*(?:is|:|=)?\s*\d/i }
  ];

  function piiHit(text) {
    var t = String(text || '');
    for (var i = 0; i < PII_GATE.length; i++) {
      PII_GATE[i].re.lastIndex = 0;
      if (PII_GATE[i].re.test(t)) return PII_GATE[i].what;
    }
    return null;
  }

  /* every answer on the canvas, since a whole-canvas call carries them all */
  function piiHitAnswers(answers) {
    answers = answers || {};
    var keys = Object.keys(answers);
    for (var i = 0; i < keys.length; i++) {
      var hit = piiHit(answers[keys[i]]);
      if (hit) return hit;
    }
    return null;
  }

  function piiBlocked(what) {
    return {
      text: 'Not sent. This answer carries ' + what + ' belonging to a real person, so it '
          + 'was not sent to the coach and did not leave this page. Describe what you saw in '
          + 'categories, for example \u201ca home city\u201d or \u201can employer\u201d, rather '
          + 'than the detail itself, then ask again.',
      tag: 'Revise',
      blocked: true
    };
  }

  /* ---------- proxy transport ---------- */

  function callProxy(kind, call) {
    var c = cfg();
    if (!available()) return Promise.reject(new Error('live_off'));
    if (capReached()) return Promise.reject(new Error('token_cap'));

    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = controller && setTimeout(function () { controller.abort(); }, CALL_TIMEOUT_MS);

    var payload = {
      kind: kind,
      system: c.prompts.system,
      grounding: c.grounding,
      call: call,
      session: { used_tokens: usedTokens }
    };
    // per-center model choice; the Worker honors it only when the model is
    // in its server-side allowlist (ALLOWED_MODELS)
    if (c.model) payload.model = c.model;

    return fetch(c.proxy_url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: controller ? controller.signal : undefined,
      body: JSON.stringify(payload)
    }).then(function (resp) {
      if (timer) clearTimeout(timer);
      return resp.json().then(function (data) {
        if (!resp.ok || !data.ok) {
          throw new Error(data && data.error === 'token_cap' ? 'token_cap' : 'proxy_error');
        }
        var u = data.usage || {};
        usedTokens += (u.input_tokens || 0) + (u.output_tokens || 0);
        return data.text || '';
      });
    }).catch(function (err) {
      if (timer) clearTimeout(timer);
      throw err;
    });
  }

  function parseTag(text) {
    var m = TAG_RE.exec((text || '').trim());
    return m ? m[1] : null;
  }

  /* ---------- public API (what engine.js uses) ---------- */

  var api = {
    available: available,
    capReached: capReached,
    usage: usage,
    coachField: function (field, activity, studentText) {
      var hit = piiHit(studentText);
      if (hit) return Promise.resolve(piiBlocked(hit));
      return callProxy('field', buildFieldCall(field, activity, studentText)).then(function (text) {
        return { text: text, tag: parseTag(text) };
      });
    },
    coachCanvas: function (activity, answers) {
      var hit = piiHitAnswers(answers);
      if (hit) return Promise.resolve(piiBlocked(hit));
      // an entirely empty canvas never reaches the proxy: no POST, no
      // tokens, and no model asked to review work that does not exist
      var state = unanswered(activity, answers);
      if (state.total && state.missing === state.total) {
        return Promise.resolve({ text: EMPTY_CANVAS_MSG, tag: null });
      }
      return callProxy('canvas', buildCanvasCall(activity, answers)).then(function (text) {
        return { text: text, tag: null };
      });
    },
    coachPitch: function (activity, answers) {
      var hit = piiHitAnswers(answers);
      if (hit) return Promise.resolve(piiBlocked(hit));
      return callProxy('pitch', buildPitchCall(activity, answers)).then(function (text) {
        return { text: text, tag: parseTag(text) };
      });
    },
    // E4: phrase the deterministic personal path in the mentor voice. Same
    // proxy, same 'canvas' kind, no new network path. The text sent is built
    // from spec-authored labels only (rubric names, focus lines, resource
    // titles), never from the student's own free text.
    coachPath: function (activity, deterministicText) {
      var call = 'The student has finished the activity. Below is their personal path, '
        + 'computed deterministically from the rubric and the activity\'s outcome logic: '
        + 'strengths, focus areas, review pointers, and matched resources.\n\n"""\n'
        + deterministicText
        + '\n"""\n\nRephrase this same personal path in your mentor voice, grounded in the '
        + 'lesson material. Keep every focus area, review pointer, and resource name exactly '
        + 'as given; do not add, drop, or reorder recommendations. Address the student '
        + 'directly. Four to six sentences, plain and encouraging.';
      return callProxy('canvas', call).then(function (text) {
        return { text: text, tag: null };
      });
    },
    // the in-lesson chat (format 'chat'): the question, the lesson's case
    // notes and the last question all pass the identity gate before any
    // POST. A hit resolves { blocked, what } and nothing leaves the page.
    coachChat: function (ctx, question, prev) {
      var hit = piiHit(question) || (prev ? piiHit(prev.q) : null);
      var source = 'question';
      if (!hit && isCaseScreen(ctx)) {
        hit = piiHit(ctx.caseNotes);
        source = 'case';
      }
      if (hit) return Promise.resolve({ blocked: true, what: hit, source: source, text: '' });
      return callProxy('chat', buildChatCall(ctx, question, prev)).then(function (text) {
        return { text: text, blocked: false };
      });
    },
    // exposed for tests
    _buildChatCall: buildChatCall,
    _buildFieldCall: buildFieldCall,
    _buildCanvasCall: buildCanvasCall,
    _buildPitchCall: buildPitchCall,
    _parseTag: parseTag,
    _unanswered: unanswered,
    _piiHit: piiHit,
    _piiHitAnswers: piiHitAnswers,
    _piiBlocked: piiBlocked,
    _emptyCanvasMsg: EMPTY_CANVAS_MSG
  };

  root.PracticeLive = api;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/*
 * Practice Studio — shared runtime core (Phase 3).
 *
 * Everything every format needs: DOM helpers, the Wawiwa brand pieces
 * (inline SVG logo, medallions, badges, spinner), local + live feedback
 * blocks with the shared Ready/Light/Revise tags, autosave, the page chrome
 * (header, safety notice, footer, export), and the FORMAT REGISTRY.
 *
 * A format is one function registered under a name; meta.format picks it.
 * Adding a format later = one new file calling PracticeCore.registerFormat,
 * concatenated by build.py. No rebuild of anything here.
 *
 * No network code lives in this file. The live coach (window.PracticeLive)
 * exists only in live builds; everything here guards on liveOn().
 */
(function () {
  'use strict';

  var FB = window.PracticeFeedback;
  var TAG_CLASS = { Ready: 'tag-ready', Light: 'tag-light', Revise: 'tag-revise' };

  function liveOn() {
    return !!(window.PracticeLive && window.PracticeLive.available());
  }

  /* ---------- the skin + its label map ---------- */
  /* The engine-level skin. build.py bakes window.CENTER = {skin: 'rise'}
     into rise builds only (a mission build carries no CENTER at all), the
     same bootstrap channel that carries live_ai. ALL skin-dependent wording
     lives in this ONE map: formats and the skin layer read C.LABELS /
     C.fmtLabel instead of hardcoding strings, so nothing is scattered.
     A null label (and a false flag) means "do not render that element":
     the rise skin computes Insight points internally (outcome_ranks and
     tag logic still run) but never displays them. */

  var SKIN = ((window.CENTER || {}).skin === 'rise') ? 'rise' : 'mission';

  var LABEL_SETS = {
    mission: {
      start: 'Start the mission',
      resume: 'Continue the mission',
      finish: 'Finish the mission',
      next: 'Next stop',
      nextCase: 'Next case',
      report: 'Mission report',
      reportHint: 'The review and the export',
      reviewEyebrow: 'The last stop',
      reviewBack: null, // the Mission Board rail is the way back
      stopBadge: 'Stop {i} / {n}',
      stopBadgeSolo: 'Stop 1 / 1',
      railTitle: 'Mission Board',
      railFootMany: 'Open the {n} stops in any order. Every field counts toward the mission.',
      railFootOne: 'Work through every field to complete the mission.',
      savePdf: 'Save the mission report (PDF)',
      reportTitle: 'Mission Report',
      progressLabel: 'Mission progress',
      pathNeutral: 'Work through the stops and run the review; your recap lands here when the mission is done.',
      reward: 'Reward: +{n} Insight when this field locks in',
      completeStatus: 'Complete  ·  +{n} Insight',
      insightHud: true,   // the HUD Insight chip
      toast: true,        // the "+N Insight" reward toast
      scoreline: true     // the gold "N of M Insight" line (sheet + PDF hero)
    },
    rise: {
      start: 'Start',
      resume: 'Continue',
      finish: 'Finish',
      next: 'Next',
      nextCase: 'Next case',
      report: 'Review and export',
      reportHint: 'Check and download your work',
      reviewEyebrow: 'Review',
      reviewBack: 'Back to my work', // the rail hides on a one-part activity
      stopBadge: 'Part {i} of {n}',
      stopBadgeSolo: null,
      railTitle: 'Contents',
      railFootMany: 'Open the {n} parts in any order. Your work saves as you type.',
      railFootOne: 'Work through every field, then review and export your work.',
      savePdf: 'Save as PDF',
      reportTitle: 'Practice Report',
      progressLabel: 'Progress',
      pathNeutral: 'Work through every field and run the review; your recap lands here when the activity is done.',
      reward: null,
      completeStatus: 'Complete',
      insightHud: false,
      toast: false,
      scoreline: false
    }
  };

  var LABELS = LABEL_SETS[SKIN];

  // fmtLabel('reward', 25) -> the label with {n} (and {i}) filled, or null
  // when the skin does not render that element at all
  function fmtLabel(key, n, i) {
    var t = LABELS[key];
    if (t === null || t === undefined) return null;
    return String(t).replace('{n}', String(n)).replace('{i}', String(i));
  }

  /* ---------- DOM helpers (textContent only, never user HTML) ---------- */

  function el(tagName, className, text) {
    var node = document.createElement(tagName);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function svgEl(markup, className) {
    var wrap = el('span', className);
    wrap.innerHTML = markup; // static, engine-authored markup only
    return wrap;
  }

  // Visual slots (cover_image, intro.illustration, scene.image). The build
  // bakes each referenced image into window.ASSETS as a data: URI; paths
  // resolve against that map, so nothing is ever fetched. External URLs are
  // refused so the no-external-request guarantee holds at runtime too.
  function imageEl(src, className, alt) {
    if (!src) return null;
    if (/^(https?:)?\/\//i.test(src)) return null; // external: refused
    var resolved = src;
    if (!/^data:/i.test(src)) {
      resolved = (window.ASSETS || {})[src] || null;
      if (!resolved) return null; // not baked in: render nothing, never fetch
    }
    var img = el('img', className);
    img.src = resolved;
    img.alt = alt || '';
    return img;
  }

  /* ---------- brand SVG library ---------- */

  /* Every SVG here is either MEANINGFUL (role="img" + aria-label: the logo)
     or DECORATIVE (aria-hidden="true": it repeats what the adjacent text
     already says). WCAG 1.1.1; build.py enforces this split on the bundle. */
  var SVG = {
    // the red-tag wawiwa logo
    logo: '<svg viewBox="0 0 120 48" width="100" height="40" role="img" aria-label="wawiwa">'
      + '<rect x="0" y="0" width="120" height="34" rx="2" fill="#EE3124"/>'
      + '<path d="M26 33 L46 33 L26 47 Z" fill="#EE3124"/>'
      + '<text x="60" y="25" text-anchor="middle" font-family="Roboto, sans-serif" font-weight="800" font-size="23" fill="#fff" letter-spacing="0">wawiwa</text></svg>',
    // circular ring medallion with a check that appears when done
    ring: function (label) {

        + '<circle class="ring-track" cx="18" cy="18" r="15.5" fill="none" stroke-width="2.5"/>'
        + '<circle class="ring-fill" cx="18" cy="18" r="15.5" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="97.4" transform="rotate(-90 18 18)"/>'

        + '<path class="ring-check" d="M11.5 18.5l4.5 4.5 8.5-9" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    },
    spinner: '<svg viewBox="0 0 24 24" width="18" height="18" class="spin-svg" aria-hidden="true">'
      + '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="42" stroke-dashoffset="28"/></svg>',
    spark: '<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M10 1.5l1.9 6.1 6.1 1.9-6.1 1.9L10 17.5 8.1 11.4 2 9.5l6.1-1.9z" fill="currentColor"/></svg>',
    download: '<svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M10 2.5v9m0 0l-3.5-3.5M10 11.5l3.5-3.5M3.5 15h13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    shield: '<svg viewBox="0 0 22 22" width="18" height="18" aria-hidden="true"><path d="M11 1.8l7.5 2.8v5.6c0 4.6-3.1 8.1-7.5 9.9-4.4-1.8-7.5-5.3-7.5-9.9V4.6L11 1.8z" fill="none" stroke="#EE3124" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.6 11l2.3 2.3 4.4-4.6" fill="none" stroke="#EE3124" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    // level badges for the review banner (the level text sits right beside them)
    badgeReady: '<svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="rgba(255,255,255,0.22)"/><path d="M14 24.5l6.5 6.5L34 17.5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    badgeLight: '<svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="rgba(255,255,255,0.22)"/><path d="M24 13v13" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="33.5" r="2.6" fill="#fff"/></svg>',
    badgeRevise: '<svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="rgba(255,255,255,0.22)"/><path d="M17 17l14 14M31 17l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>',
    chevron: '<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    restart: '<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M4 10a6 6 0 116 6M4 10V5.5M4 10h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  var LEVEL_BADGES = [SVG.badgeReady, SVG.badgeLight, SVG.badgeRevise];

  /* ---------- local storage (student's own work, device only) ---------- */

  function storageKey(activity) {
    return 'practice-studio:' + activity.meta.id;
  }

  function loadAnswers(activity) {
    try {
      var raw = localStorage.getItem(storageKey(activity));
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function saveAnswers(activity, answers) {
    try {
      localStorage.setItem(storageKey(activity), JSON.stringify(answers));
    } catch (e) { /* storage blocked: page still works, nothing leaves the device */ }
  }

  function clearAnswers(activity) {
    try { localStorage.removeItem(storageKey(activity)); } catch (e) { /* ignore */ }
    try { localStorage.removeItem(coachKey(activity)); } catch (e) { /* ignore */ }
  }

  /* ---------- coach verdicts (the live coach is authoritative) ---------- */
  /* When the live coach is on, its verdict drives the field's status, tile,
     and points, not the local rules. Each verdict is stored with the exact
     answer text it judged, so editing the answer invalidates it and the
     silent local fallback takes over until the coach is asked again. */

  function coachKey(activity) {
    return 'practice-studio:' + activity.meta.id + ':coach';
  }

  function loadCoachVerdicts(activity) {
    try {
      var raw = localStorage.getItem(coachKey(activity));
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function recordCoachVerdict(state, fieldId, tag) {
    if (!tag) return;
    state.coachVerdicts[fieldId] = {
      tag: tag,
      text: (state.answers[fieldId] || '').trim()
    };
    try {
      localStorage.setItem(coachKey(state.activity), JSON.stringify(state.coachVerdicts));
    } catch (e) { /* storage blocked: the session still works */ }
  }

  // the authoritative tag for a field: the coach's verdict while it matches
  // the current answer text, the local deterministic tag otherwise
  function coachTagFor(state, fieldId) {
    if (!liveOn()) return null;
    var v = (state.coachVerdicts || {})[fieldId];
    if (v && v.tag && v.text === (state.answers[fieldId] || '').trim()) return v.tag;
    return null;
  }

  /* ---------- tags + feedback blocks (one voice for local and live) ---------- */

  // every check/coach feedback container is a polite live region, so a
  // verdict (and the "coach is reading..." state) is announced to screen
  // readers when it appears (WCAG 4.1.3). build.py asserts this survives.
  function liveRegion(className) {
    var region = el('div', className || 'feedback');
    region.setAttribute('aria-live', 'polite');
    return region;
  }

  function tagPill(tag) {
    return el('span', 'tag-pill ' + (TAG_CLASS[tag] || 'tag-none'), tag);
  }

  function feedbackBlock(container, result) {
    container.textContent = '';
    container.classList.add('has-feedback', 'local-box');
    container.classList.remove('coach-box');
    var head = el('div', 'feedback-head');
    head.appendChild(el('span', 'feedback-title', 'Local check'));
    head.appendChild(tagPill(result.tag));
    container.appendChild(head);
    (result.piiWarnings || []).forEach(function (w) {
      container.appendChild(el('div', 'feedback-line pii-line', w));
    });
    (result.messages || []).forEach(function (m) {
      var cls = result.tag === 'Ready' ? 'feedback-line ok-line' : 'feedback-line';
      container.appendChild(el('div', cls, m));
    });
    if (result.routing) {
      // the lesson/topic names stand out inside the sentence: bold AND an
      // accent color that holds 4.5:1, never color alone (v2e, WCAG 1.4.1/3)
      var routing = el('div', 'feedback-line routing-line');
      var rest = result.routing;
      (result.routingTargets || []).forEach(function (target) {
        var at = rest.indexOf(target);
        if (at === -1) return;
        if (at > 0) routing.appendChild(document.createTextNode(rest.slice(0, at)));
        routing.appendChild(el('strong', 'routing-target', target));
        rest = rest.slice(at + target.length);
      });
      if (rest) routing.appendChild(document.createTextNode(rest));
      container.appendChild(routing);
    }
    appendResources(container, result.resources);
  }

  // per-topic "read this" links: ordinary navigation anchors in a new tab;
  // nothing is fetched by the page, the offline guarantee is untouched
  function appendResources(container, resources) {
    (resources || []).forEach(function (res) {
      var row = el('div', 'resource-row');
      var link = el('a', 'resource-link', res.title);
      link.href = res.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      row.appendChild(link);
      row.appendChild(el('span', 'resource-for', res['for']));
      container.appendChild(row);
    });
  }

  function coachBlock(container, text, tag, activity) {
    container.textContent = '';
    container.classList.add('has-feedback', 'coach-box');
    container.classList.remove('local-box');
    var head = el('div', 'feedback-head');
    head.appendChild(el('span', 'feedback-title coach-title', 'Live coach'));
    if (tag) head.appendChild(tagPill(tag));
    container.appendChild(head);
    if (text) {
      // any "Lesson N" / topic-name reference inside the free coach text
      // stands out exactly like the deterministic routing line: bold + the
      // same accent class, >=4.5:1, never color alone (WCAG 1.4.1 / 1.4.3)
      var line = el('div', 'feedback-line');
      if (activity) {
        FB.lessonRefSegments(text, activity).forEach(function (seg) {
          line.appendChild(seg.hit
            ? el('strong', 'routing-target', seg.text)
            : document.createTextNode(seg.text));
        });
      } else {
        line.textContent = text;
      }
      container.appendChild(line);
    }
  }

  function coachThinking(container) {
    container.textContent = '';
    container.classList.add('has-feedback', 'coach-box');
    var row = el('div', 'coach-thinking');
    row.appendChild(svgEl(SVG.spinner, 'spin'));
    row.appendChild(el('span', 'coach-note', 'The coach is reading your work...'));
    container.appendChild(row);
  }

  function coachFallback(state, container, err, localFn) {
    var capped = err && err.message === 'token_cap';
    if (capped) {
      state.coachButtons.forEach(function (b) { b.disabled = true; });
    }
    container.textContent = '';
    container.classList.remove('has-feedback', 'coach-box', 'local-box');
    if (localFn) localFn();
    container.appendChild(el('div', 'feedback-line coach-note coach-offline',
      capped
        ? 'The live coach reached this session’s limit. The local checks keep working.'
        : 'The live coach is unavailable right now. Here is the local check instead.'));
  }

  // the pitch-shaping action: live coach + home context + a spec-flagged
  // field, nothing else. Class builds never show it even with the coach on,
  // and coach-off builds have no PracticeLive at all.
  function pitchActionOn(activity, field) {
    return liveOn()
      && !!(field && field.ai_action === 'pitch')
      && !!(activity && activity.meta && activity.meta.context === 'home');
  }

  function coachButton(state, label, onClick) {
    var btn = el('button', 'btn btn-coach');
    btn.type = 'button';
    btn.appendChild(svgEl(SVG.spark, 'btn-icon'));
    btn.appendChild(el('span', null, label));
    btn.addEventListener('click', function () {
      if (window.PracticeLive.capReached()) {
        state.coachButtons.forEach(function (b) { b.disabled = true; });
        return;
      }
      onClick(btn);
    });
    state.coachButtons.push(btn);
    return btn;
  }

  /* ---------- shared field editor (canvas fields and scene reflections) ---------- */

  function fieldEditor(state, activity, field, opts) {
    opts = opts || {};
    var card = el('div', 'field-card' + (opts.embedded ? ' field-embedded' : ''));
    card.id = 'card-' + field.id;

    var head = el('div', 'field-head');
    var medal = svgEl(SVG.ring(opts.badge !== undefined ? opts.badge : (field.number !== undefined ? String(field.number) : '•')), 'field-medal');
    head.appendChild(medal);
    var labelWrap = el('div', 'field-label-wrap');
    var labelEl = el('h3', 'field-label', field.label);
    labelEl.id = 'label-' + field.id;
    labelWrap.appendChild(labelEl);
    if (field.help) labelWrap.appendChild(el('p', 'field-help', field.help));
    head.appendChild(labelWrap);
    card.appendChild(head);

    if (field.good_example || field.weak_example) {
      var ex = el('div', 'examples');
      [['weak_example', 'Weak', 'example-weak'], ['good_example', 'Strong', 'example-good']].forEach(function (spec) {
        if (!field[spec[0]]) return;
        var row = el('div', 'example ' + spec[2]);
        row.appendChild(el('span', 'example-tag', spec[1]));
        row.appendChild(el('span', 'example-text', field[spec[0]]));
        ex.appendChild(row);
      });
      card.appendChild(ex);
    }

    // the answer input is programmatically tied to its field label (WCAG
    // 1.3.1 / 3.3.2 / 4.1.2); the Mission layout re-points it at the visible
    // block heading, but the association always exists
    var ta = el('textarea', 'answer-input');
    ta.id = 'input-' + field.id;
    ta.setAttribute('aria-labelledby', labelEl.id);
    ta.placeholder = opts.placeholder || 'Write here. No names, IDs, or confidential text.';
    ta.value = state.answers[field.id] || '';
    ta.addEventListener('input', function () {
      state.answers[field.id] = ta.value;
      saveAnswers(state.activity, state.answers);
    });
    card.appendChild(ta);

    var feedback = liveRegion();
    var check = function () {
      var result = FB.evaluateField(field, state.answers[field.id], state.checks, activity);
      feedbackBlock(feedback, result);
      card.classList.toggle('card-ready', result.tag === 'Ready');
      if (opts.onResult) opts.onResult(result);
      return result;
    };
    ta.addEventListener('blur', function () {
      // with the coach on, no local box is painted on blur: the coach is the
      // one voice the student sees, and the local check stays silent
      if (!liveOn() && (ta.value || '').trim()) check();
    });

    var btnRow = el('div', 'btn-row');
    var coachOut = null;
    if (liveOn()) {
      // the live coach is authoritative: Check this field asks the coach and
      // its verdict is the only one shown. The local deterministic check is
      // the silent fallback, rendered only when the coach is capped or down.
      coachOut = liveRegion();
      // the label names the AI only while the click actually reaches it: a
      // capped or offline session falls back to the local deterministic
      // check, and the same button drops the "with AI" for honesty (v2e)
      var plainLabel = opts.checkLabel || 'Check this field';
      var aiLabel = plainLabel + ' with AI';
      var askBtn = el('button', 'btn btn-coach');
      askBtn.type = 'button';
      askBtn.appendChild(svgEl(SVG.spark, 'btn-icon'));
      var askLabel = el('span', null, aiLabel);
      askBtn.appendChild(askLabel);
      askBtn.addEventListener('click', function () {
        if (!(state.answers[field.id] || '').trim()) { check(); return; }
        if (window.PracticeLive.capReached()) {
          askLabel.textContent = plainLabel;
          coachFallback(state, coachOut, { message: 'token_cap' }, check);
          return;
        }
        askBtn.disabled = true;
        coachThinking(coachOut);
        window.PracticeLive.coachField(field, activity, state.answers[field.id])
          .then(function (r) {
            askBtn.disabled = false;
            askLabel.textContent = aiLabel; // a transient outage recovered
            coachBlock(coachOut, r.text, r.tag, activity);
            // never a contradictory pair: any earlier fallback box goes away
            feedback.textContent = '';
            feedback.className = 'feedback';
            // "read this" links stay a home-only feature (the class/home gate)
            var isHome = !!(activity && activity.meta && activity.meta.context === 'home');
            if (isHome && r.tag && r.tag !== 'Ready') {
              appendResources(coachOut, FB.resolveResources(field.resources, activity));
            }
            card.classList.toggle('card-ready', r.tag === 'Ready');
            recordCoachVerdict(state, field.id, r.tag);
            if (r.tag && opts.onResult) opts.onResult({ tag: r.tag, empty: false });
          })
          .catch(function (err) {
            askBtn.disabled = false;
            askLabel.textContent = plainLabel; // this click ran the local check
            coachFallback(state, coachOut, err, check);
          });
      });
      // deliberately NOT in state.coachButtons: the token-cap path disables
      // that list, but this is the field's only Check button, so a capped
      // session must keep it alive — each further click lands in the
      // capReached() branch and runs the local check with the offline note.
      btnRow.appendChild(askBtn);
    } else {
      var btn = el('button', 'btn btn-primary', opts.checkLabel || 'Check this field');
      btn.type = 'button';
      btn.addEventListener('click', check);
      btnRow.appendChild(btn);
    }
    // "Shape my pitch with AI" (the final homework's pitch field): a second
    // coach action that shapes the student's OWN pitch points. It coaches
    // structure, order, and length; it never writes the pitch. Home-gated:
    // pitchActionOn is false in class builds even when the coach is live.
    var pitchOut = null;
    if (pitchActionOn(activity, field)) {
      pitchOut = liveRegion();
      var shapeBtn = el('button', 'btn btn-coach');
      shapeBtn.type = 'button';
      shapeBtn.appendChild(svgEl(SVG.spark, 'btn-icon'));
      shapeBtn.appendChild(el('span', null, 'Shape my pitch with AI'));
      shapeBtn.addEventListener('click', function () {
        if (!(state.answers[field.id] || '').trim()) {
          // nothing to shape yet, and the coach never writes the points
          pitchOut.textContent = '';
          pitchOut.className = 'feedback';
          pitchOut.appendChild(el('div', 'feedback-line coach-note',
            'Jot down a few rough pitch points first, in your own words. Then I can help you shape them.'));
          return;
        }
        if (window.PracticeLive.capReached()) {
          coachFallback(state, pitchOut, { message: 'token_cap' }, check);
          return;
        }
        shapeBtn.disabled = true;
        coachThinking(pitchOut);
        window.PracticeLive.coachPitch(activity, state.answers)
          .then(function (r) {
            shapeBtn.disabled = false;
            // shaping advice, never a verdict: no tag, nothing recorded
            coachBlock(pitchOut, r.text, null, activity);
          })
          .catch(function (err) {
            shapeBtn.disabled = false;
            coachFallback(state, pitchOut, err, check);
          });
      });
      btnRow.appendChild(shapeBtn);
    }

    card.appendChild(btnRow);
    card.appendChild(feedback);
    if (coachOut) card.appendChild(coachOut);
    if (pitchOut) card.appendChild(pitchOut);

    state.checkFns[field.id] = check;
    return { card: card, check: check, textarea: ta };
  }

  /* ---------- page chrome ---------- */

  function renderHeader(activity, opts) {
    opts = opts || {};
    var meta = activity.meta;
    var cover = imageEl(meta.cover_image, 'hero-bg');

    // With a cover image: the cinematic poster hero. Without: the light header.
    var header = el('header', (cover ? 'page-header hero' : 'page-header') + ' rise');
    if (cover) {
      header.appendChild(cover);
      header.appendChild(el('div', 'hero-scrim'));
      header.appendChild(el('div', 'hero-motif'));
    }
    var content = el('div', cover ? 'hero-content' : 'header-content');
    header.appendChild(content);

    var brand = el('div', 'brand-row');
    brand.appendChild(svgEl(SVG.logo, 'brand-logo'));
    var caption = el('div', 'brand-caption');
    caption.appendChild(el('span', null, 'Reskilling the World'));
    caption.appendChild(el('span', null, 'to AI & Tech'));
    brand.appendChild(caption);
    content.appendChild(brand);

    var kickerBits = [meta.program, meta.module, meta.lesson].filter(Boolean).join('  ·  ');
    if (kickerBits) content.appendChild(el('div', 'kicker', kickerBits));
    content.appendChild(el('h1', 'page-title', meta.title));
    if (activity.intro && activity.intro.headline) {
      content.appendChild(el('p', 'lede-headline', activity.intro.headline));
    }
    if (activity.intro && activity.intro.body) {
      content.appendChild(el('p', 'lede', activity.intro.body));
    }
    var illo = imageEl(activity.intro && activity.intro.illustration, 'intro-illustration');
    if (illo) content.appendChild(illo);

    var chips = el('div', 'meta-chips');
    if (meta.estimated_minutes) chips.appendChild(el('span', 'meta-chip', 'About ' + meta.estimated_minutes + ' minutes'));
    (opts.chips || []).forEach(function (c) { chips.appendChild(el('span', 'meta-chip', c)); });
    chips.appendChild(el('span', 'meta-chip ' + (liveOn() ? 'meta-chip-live' : ''),
      liveOn() ? 'Live coach on' : 'Local coach'));
    content.appendChild(chips);
    return header;
  }

  function renderSafetyNotice(activity) {
    var safety = activity.safety || {};
    if (!safety.student_notice) return null;
    var box = el('div', 'safety-notice rise');
    var head = el('div', 'safety-head');
    head.appendChild(svgEl(SVG.shield, 'safety-icon'));
    head.appendChild(el('strong', 'safety-title', 'Before you start: no personal data.'));
    box.appendChild(head);
    box.appendChild(el('p', 'safety-body', safety.student_notice));
    box.appendChild(el('p', 'safety-local', liveOn()
      ? 'Your work is saved only in this browser. When you ask the live coach, your answer text is scrubbed of emails, phone numbers, long numbers, and keys, then sent anonymously through Wawiwa’s proxy. Your identity is never sent because it is never collected.'
      : 'Everything you write stays in this browser on this device. This page sends nothing anywhere.'));
    return box;
  }

  function renderFooter(activity, state, opts) {
    opts = opts || {};
    var footer = el('footer', 'page-footer');
    var actions = el('div', 'footer-actions');

    var printBtn = el('button', 'btn btn-primary');
    printBtn.type = 'button';
    printBtn.appendChild(svgEl(SVG.download, 'btn-icon'));
    printBtn.appendChild(el('span', null, 'Export as PDF'));
    printBtn.addEventListener('click', function () {
      // code-generated PDF (engine/export.js): never the browser's print
      // dialog, so no URL/date footer, embedded or standalone
      window.PracticeExport.saveReport(activity, window.PracticeExport.genericData(activity, state));
    });
    actions.appendChild(printBtn);

    (opts.extraActions || []).forEach(function (a) { actions.appendChild(a); });

    var clearBtn = el('button', 'btn btn-ghost-danger', 'Clear my work');
    clearBtn.type = 'button';
    clearBtn.addEventListener('click', function () {
      if (window.confirm('Delete everything you wrote on this device? This cannot be undone.')) {
        clearAnswers(activity);
        window.location.reload();
      }
    });
    actions.appendChild(clearBtn);

    footer.appendChild(actions);
    footer.appendChild(el('div', 'footer-note', '© Wawiwa Tech | Confidential'));
    return footer;
  }

  /* ---------- level banner + rubric (shared by every format's review) ---------- */

  function levelBanner(evalResult) {
    var banner = el('div', 'level-banner level-' + evalResult.overall.levelIndex + ' pop-in');
    banner.appendChild(svgEl(LEVEL_BADGES[evalResult.overall.levelIndex], 'level-badge'));
    var textWrap = el('div', 'level-text');
    textWrap.appendChild(el('div', 'level-label', 'Overall level'));
    textWrap.appendChild(el('div', 'level-value', evalResult.overall.level));
    banner.appendChild(textWrap);

    // anonymous passback (Phase 4): present only in builds whose center
    // config enabled it. The signal goes to the center's own LMS; it carries
    // the level and score, never an identity.
    if (window.PracticePassback && window.PracticePassback.enabled()) {
      var sent = window.PracticePassback.report(evalResult);
      if (sent.sent) {
        textWrap.appendChild(el('div', 'level-passback',
          'Result reported anonymously to your center’s learning system.'));
      }
    }
    return banner;
  }

  function rubricBox(evalResult) {
    var box = el('div', 'rubric-box');
    box.appendChild(el('h3', 'panel-subtitle', 'Rubric check'));
    evalResult.rubric.forEach(function (r) {
      var row = el('div', 'rubric-row');
      row.appendChild(r.tag ? tagPill(r.tag) : el('span', 'tag-pill tag-none', 'Coach'));
      var textWrap = el('div', 'rubric-text');
      textWrap.appendChild(el('span', 'rubric-name', r.name + '. '));
      textWrap.appendChild(el('span', 'rubric-verdict', r.verdict));
      row.appendChild(textWrap);
      box.appendChild(row);
    });
    return box;
  }

  /* ---------- format registry + boot ---------- */

  var FORMATS = {};

  function registerFormat(name, renderFn) {
    FORMATS[name] = renderFn;
  }

  function newState(activity, checks) {
    return {
      activity: activity,
      checks: checks,
      answers: loadAnswers(activity),
      coachVerdicts: loadCoachVerdicts(activity),
      checkFns: {},
      coachButtons: []
    };
  }

  function boot() {
    var rootNode = document.getElementById('activity-root');
    var activity = window.ACTIVITY;
    var checks = window.CHECKS || {};
    if (!activity || !activity.meta) {
      rootNode.appendChild(el('p', 'engine-error', 'No activity spec was bundled into this page.'));
      return;
    }
    var format = FORMATS[activity.meta.format];
    if (!format) {
      rootNode.appendChild(el('p', 'engine-error',
        'The format "' + activity.meta.format + '" is not in this build’s format library yet.'));
      return;
    }
    document.title = 'Wawiwa · ' + activity.meta.title;
    document.body.classList.add('format-' + activity.meta.format);
    format(rootNode, activity, checks, newState(activity, checks));

    // for Export as PDF: let every textarea show its full content
    window.addEventListener('beforeprint', function () {
      Array.prototype.forEach.call(document.querySelectorAll('textarea'), function (ta) {
        ta.style.height = 'auto';
        ta.style.height = Math.max(ta.scrollHeight + 4, 40) + 'px';
      });
    });
  }

  window.PracticeCore = {
    el: el,
    svgEl: svgEl,
    imageEl: imageEl,
    SVG: SVG,
    skin: SKIN,
    LABELS: LABELS,
    fmtLabel: fmtLabel,
    liveOn: liveOn,
    pitchActionOn: pitchActionOn,
    tagPill: tagPill,
    liveRegion: liveRegion,
    feedbackBlock: feedbackBlock,
    appendResources: appendResources,
    coachBlock: coachBlock,
    coachThinking: coachThinking,
    coachFallback: coachFallback,
    coachButton: coachButton,
    fieldEditor: fieldEditor,
    renderHeader: renderHeader,
    renderSafetyNotice: renderSafetyNotice,
    renderFooter: renderFooter,
    levelBanner: levelBanner,
    rubricBox: rubricBox,
    saveAnswers: saveAnswers,
    clearAnswers: clearAnswers,
    coachTagFor: coachTagFor,
    registerFormat: registerFormat,
    boot: boot
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

/*
 * Practice Studio — the code-generated PDF export (shared by every format).
 *
 * Replaces window.print(): the browser's Save-as-PDF stamps its own header
 * and footer (the page URL and the date) whenever the activity runs inside
 * an embed (Rise), because the print margin belongs to the browser. This
 * helper draws the report itself with the vendored jsPDF (inlined at build
 * time, no CDN), so the file contains exactly what we draw — a branded
 * Mission Report with the Wawiwa red wordmark, navy headings, and the
 * student's own work — and never a browser footer, in any embed.
 *
 * Input is the same data model engine/mission.js buildReportSheet takes:
 *   { scoreline: {points, max, rank}, level: {index, label},
 *     sections: [{ title, cards: [{ num, title, tag,
 *                  rows: [{label, value, empty}] }] }] }
 * so each format hands the identical content to the on-screen report sheet
 * and to this file.
 *
 * No network code lives here; jsPDF's remote loaders are stripped from the
 * vendored copy. The PDF is assembled in memory and saved via a download.
 */
(function () {
  'use strict';

  /* the Wawiwa palette (matches :root in styles.css / the Mission skin) */
  var RED = [238, 49, 36];        // #EE3124
  var NAVY = [37, 87, 119];       // #255777 (Mission navy)
  var INK = [31, 44, 54];         // #1F2C36
  var SLATE = [111, 122, 138];    // #6F7A8A
  var LINE = [227, 233, 236];     // #E3E9EC
  var GOLD = [244, 180, 26];      // #F4B41A
  var TEAL = [90, 179, 170];      // #5AB3AA (the rise rule, non-text)
  var TEAL_DEEP = [46, 110, 118]; // #2E6E76 (rise kicker text, AA on white)
  var TAG_RGB = {
    Ready: [46, 139, 87],         // --w-ready
    Light: [217, 136, 15],        // --w-light
    Revise: [193, 59, 59]         // --w-revise
  };
  var LEVEL_RGB = [TAG_RGB.Ready, TAG_RGB.Light, TAG_RGB.Revise];

  /* A4 metrics, mm */
  var PAGE_W = 210, PAGE_H = 297;
  var MARGIN = 14;
  var CONTENT_W = PAGE_W - 2 * MARGIN;
  var FOOT_Y = PAGE_H - 9;
  var BOTTOM = FOOT_Y - 6;

  /* The built-in PDF fonts encode Latin-1: map the typography the engine
     uses (curly quotes, dashes, ellipsis) and drop what cannot encode,
     rather than printing mojibake. */
  var CHAR_MAP = {
    '‘': "'", '’': "'", '‚': "'",
    '“': '"', '”': '"', '„': '"',
    '–': '-', '—': '-', '−': '-',
    '…': '...', ' ': ' ', '•': '-',
    '→': '->', '←': '<-', '✓': '+', '✔': '+',
    '✎': '', '●': '-'
  };
  function clean(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/[‘’‚“”„–—−… •→←✓✔✎●]/g,
        function (c) { return CHAR_MAP[c]; })
      .replace(/[^\x09\x0A\x0D\x20-\xFF]/g, '');
  }

  function jsPdfCtor() {
    return (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : null;
  }

  /* the red-tag wawiwa wordmark, drawn (same shape as the SVG logo) */
  function drawWordmark(doc, x, y) {
    doc.setFillColor(RED[0], RED[1], RED[2]);
    doc.roundedRect(x, y, 26, 8.6, 0.7, 0.7, 'F');
    doc.triangle(x + 5.6, y + 8.5, x + 10.4, y + 8.5, x + 5.6, y + 11.6, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12.5);
    doc.setTextColor(255, 255, 255);
    doc.text('wawiwa', x + 13, y + 6, { align: 'center' });
  }

  function drawChip(doc, x, y, label, rgb) {
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    var w = doc.getTextWidth(label) + 5;
    doc.setFillColor(rgb[0], rgb[1], rgb[2]);
    doc.roundedRect(x, y, w, 5.4, 2.7, 2.7, 'F');
    doc.setTextColor(255, 255, 255);
    doc.text(label, x + w / 2, y + 3.8, { align: 'center' });
    return w;
  }

  /* every page gets the Wawiwa footer — ours, never the browser's */
  function drawPageFooters(doc) {
    var total = doc.getNumberOfPages();
    for (var i = 1; i <= total; i++) {
      doc.setPage(i);
      doc.setDrawColor(LINE[0], LINE[1], LINE[2]);
      doc.setLineWidth(0.25);
