    window.addEventListener('beforeprint', function () {
      buildReport(activity, state);
    });

    if (!all.length) {
      state.shell.main.appendChild(el('p', 'engine-error', 'This activity has no scenes to play.'));
      return;
    }

    function playScene(sceneId) {
      var scene = sceneById(activity, sceneId);
      if (!scene) { showEnding(); return; }
      var path = state.answers[PATH_KEY];
      if (path.indexOf(sceneId) === -1) {
        path.push(sceneId);
        C.saveAnswers(activity, state.answers);
      }
      state.currentSceneId = sceneId;
      state.atEnding = false;
      state.shell.backdrop.set(all.indexOf(scene), scene.background || scene.image);
      var node = buildSceneCard(activity, state, scene, function (nextId) {
        if (nextId) playScene(nextId);
        else showEnding();
      });
      stage.swap(node);
      if (state.booted) M.focusHeading(node); // navigation moves focus to the new heading
      refreshHud(activity, state);
    }

    function showEnding() {
      state.atEnding = true;
      state.currentSceneId = null;
      state.shell.backdrop.set(all.length, activity.meta.background || null);
      var node = buildEndingScene(activity, state);
      stage.swap(node);
      if (state.booted) M.focusHeading(node);
      refreshHud(activity, state);
    }

    function resume() {
      var path = state.answers[PATH_KEY];
      if (!path.length) { playScene(all[0].id); return; }
      // pick up at the frontier: the last visited scene, or past its decision
      var last = sceneById(activity, path[path.length - 1]);
      var decided = state.answers[FB.decisionKey(last)];
      if (!decided) { playScene(last.id); return; }
      var option = (last.decision.options || []).filter(function (o) { return o.id === decided; })[0];
      var nid = nextSceneId(activity, last, option);
      if (nid === null) showEnding();
      else if (path.indexOf(nid) === -1) playScene(nid);
      else playScene(path[path.length - 1]);
    }

    state.shell.backdrop.set(0, activity.meta.background || activity.meta.cover_image);
    stage.swap(buildTitleScene(activity, state, resume));
    state.booted = true; // from here on, every scene swap moves focus
    refreshHud(activity, state);
  }

  C.registerFormat('branching_scenario', renderBranchingScenario);
})();

/*
 * Practice Studio format: chat, the in-lesson coach page.
 *
 * A reusable template for every Wawiwa program: this file and the skin
 * (engine/skins/coach-chat.css) are generic, and each lesson plugs in its
 * own PACK, an activity folder holding the system prompt and chat call
 * (coach_prompts.md), the grounding (grounding_pack.md) and the chat block
 * of activity.json: screen types with their opening line and chips, the
 * screen notes, and every text the page shows. Start a new pack from
 * templates/chat-coach/ (docs/chat-coach-template.md).
 *
 * A self-study lesson frames this page inside its own coach panel and keeps
 * it mounted across screens, so one page load is one coach session (the
 * token counter lives in live.js). The page has no header of its own: the
 * lesson's panel provides it. It fills the panel body with a message log,
 * the screen's chips, one input and the privacy notice.
 *
 * Lesson to page (postMessage, from window.parent only, exact shape):
 *   { type: 'wawiwa-coach-context', v: 1, screen, chapter, chapterTitle,
 *     step, screenType, note, tip, caseNotes }
 * When the pack lists the screen (chat.screens), the pack's type and note
 * win over the lesson's, so a framing page cannot rewrite what the coach
 * is told; the lesson's values cover screens the pack does not list.
 * Page to lesson (no learner text): { type: 'wawiwa-coach-ready' } on load,
 * { type: 'wawiwa-coach-close' } on Esc.
 *
 * Two screen-type behaviours are the engine's, named per pack:
 * chat.locked_types (default ['locked']: no input, no call) and
 * chat.case_types (default ['case']: the lesson's case notes ride along).
 *
 * Transport, the identity gate, redaction, the token cap and the timeout
 * are live.js (PracticeLive.coachChat); this file never builds a request.
 * Without the live layer (a live-off build) every question gets the
 * screen's offline tip. Nothing is stored and nothing goes to SCORM.
 */
(function () {
  'use strict';

  var C = window.PracticeCore;
  var M = window.PracticeMission;
  var el = C.el;

  var CONTEXT_KEYS = ['type', 'v', 'screen', 'chapter', 'chapterTitle', 'step',
    'screenType', 'note', 'tip', 'caseNotes'];
  var STRING_MAX = { screen: 12, chapterTitle: 80, step: 60, note: 1500, tip: 600, caseNotes: 6000 };

  // the page's own words; every pack sets them in chat.ui (the build
  // requires it), these only keep an incomplete pack readable
  var UI_DEFAULTS = {
    speaker_coach: 'Coach: ',
    speaker_you: 'You: ',
    thinking: 'The coach is thinking',
    send: 'Send',
    chips_label: 'Suggested questions',
    log_label: 'Conversation with the coach',
    input_label: 'Ask the coach about this screen',
    placeholder: '',
    notice: '',
    offline_lead: '',
    cap_lead: '',
    blocked: 'Not sent.',
    blocked_case: 'Not sent.',
    locked_line: ''
  };

  function settings(spec) {
    var ui = {};
    Object.keys(UI_DEFAULTS).forEach(function (k) {
      ui[k] = (spec.ui && typeof spec.ui[k] === 'string') ? spec.ui[k] : UI_DEFAULTS[k];
    });
    return {
      ui: ui,
      chapters: spec.chapters || 1,
      maxQ: spec.question_max_chars || 300,
      openings: spec.openings || {},
      screenOpenings: spec.screen_openings || {},
      screens: spec.screens || {},
      lockedTypes: spec.locked_types || ['locked'],
      caseTypes: spec.case_types || ['case']
    };
  }

  function knownType(s, t) {
    return Object.prototype.hasOwnProperty.call(s.openings, t) || s.lockedTypes.indexOf(t) !== -1;
  }

  /* the lesson's message, accepted only in its exact shape */
  function validContext(data, s) {
    if (!data || typeof data !== 'object' || Array.isArray(data)) return null;
    var keys = Object.keys(data);
    if (keys.length !== CONTEXT_KEYS.length) return null;
    for (var i = 0; i < CONTEXT_KEYS.length; i++) {
      if (!Object.prototype.hasOwnProperty.call(data, CONTEXT_KEYS[i])) return null;
    }
    if (data.type !== 'wawiwa-coach-context' || data.v !== 1) return null;
    if (typeof data.chapter !== 'number' || data.chapter % 1 !== 0
        || data.chapter < 1 || data.chapter > s.chapters) return null;
    for (var k in STRING_MAX) {
      if (typeof data[k] !== 'string' || data[k].length > STRING_MAX[k]) return null;
    }
    if (!/^[A-Za-z0-9]{1,12}$/.test(data.screen)) return null;
    if (!knownType(s, data.screenType)) return null;
    return resolveContext(data, s);
  }

  /* the pack's own entry for a screen wins over what the lesson sent */
  function resolveContext(c, s) {
    var own = Object.prototype.hasOwnProperty.call(s.screens, c.screen) ? s.screens[c.screen] : null;
    var type = own && own.type ? own.type : c.screenType;
    return {
      screen: c.screen,
      chapter: c.chapter,
      chapters: s.chapters,
      chapterTitle: c.chapterTitle,
      step: c.step,
      screenType: type,
      note: own && own.note ? own.note : c.note,
      tip: own && own.tip ? own.tip : c.tip,
      caseTypes: s.caseTypes,
      // case notes ride only on case screens
      caseNotes: s.caseTypes.indexOf(type) !== -1 ? (c.caseNotes || '') : ''
    };
  }

  function framed() {
    try { return window.parent && window.parent !== window; } catch (e) { return true; }
  }

  function toLesson(type) {
    if (!framed()) return;
    window.parent.postMessage({ type: type }, '*');
  }

  function srOnly(text) {
    return el('span', 'chat-sr', text);
  }

  function avatar() {
    var bot = M.mentor(20, 'chat-avatar');
    var svg = bot.querySelector('svg');
    // decorative here: every coach bubble carries a speaker label
    svg.setAttribute('aria-hidden', 'true');
    svg.removeAttribute('role');
    svg.removeAttribute('aria-label');
    return bot;
  }

  function renderChat(rootNode, activity) {
    var s = settings(activity.chat || {});
    var ui = s.ui;
    var live = window.PracticeLive && window.PracticeLive.available() ? window.PracticeLive : null;

    var ctx = null;          // the screen the lesson says the learner is on
    var prev = null;         // the last sent exchange { q, a } on this screen
    var busy = false;
    var capped = false;
    var turn = 0;            // bumps on every screen change; stale replies are dropped

    var wrap = el('div', 'chat');
    var log = el('div', 'chat-log');
    log.setAttribute('role', 'log');
    log.setAttribute('aria-live', 'polite');
    log.setAttribute('aria-label', ui.log_label);
    var chips = el('div', 'chat-chips');
    chips.setAttribute('role', 'group');
    chips.setAttribute('aria-label', ui.chips_label);

    var form = el('form', 'chat-form');
    form.setAttribute('novalidate', '');
    var label = el('label', 'chat-sr', ui.input_label);
    label.htmlFor = 'chat-q';
    var input = el('input', 'chat-input');
    input.id = 'chat-q';
    input.type = 'text';
    input.maxLength = s.maxQ;
    input.autocomplete = 'off';
    input.placeholder = ui.placeholder;
    input.setAttribute('aria-describedby', 'chat-notice');
    var send = el('button', 'chat-send');
    send.type = 'submit';
    send.setAttribute('aria-label', ui.send);
    send.appendChild(C.svgEl('<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" '
      + 'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<path d="M10 16V4M5 9l5-5 5 5"/></svg>', 'chat-send-icon'));
    form.appendChild(label);
    form.appendChild(input);
    form.appendChild(send);

    var notice = el('p', 'chat-notice');
    notice.id = 'chat-notice';
    notice.appendChild(C.svgEl(M.GLYPH.lock, 'chat-lock'));
    notice.appendChild(document.createTextNode(' ' + ui.notice));

    var footer = el('div', 'chat-footer');
    footer.appendChild(chips);
    footer.appendChild(form);
    footer.appendChild(notice);
    wrap.appendChild(log);
    wrap.appendChild(footer);
    rootNode.appendChild(wrap);

    /* ---------- the log ---------- */

    function scrollDown() {
      log.scrollTop = log.scrollHeight;
    }

    function coachSay(text) {
      var row = el('div', 'chat-row chat-row-coach');
      row.appendChild(avatar());
      var bubble = el('div', 'chat-bubble chat-coach');
      bubble.appendChild(srOnly(ui.speaker_coach));
      bubble.appendChild(document.createTextNode(text));
      row.appendChild(bubble);
      log.appendChild(row);
      scrollDown();
      return row;
    }

    function learnerSay(text) {
      var row = el('div', 'chat-row chat-row-me');
      var bubble = el('div', 'chat-bubble chat-me');
      bubble.appendChild(srOnly(ui.speaker_you));
      bubble.appendChild(document.createTextNode(text));
      row.appendChild(bubble);
      log.appendChild(row);
      scrollDown();
    }

    function noticeSay(lead, tip) {
      var row = el('div', 'chat-row chat-row-notice');
      var bubble = el('div', 'chat-bubble chat-notice-bubble');
      bubble.appendChild(srOnly(ui.speaker_coach));
      bubble.appendChild(el('span', 'chat-notice-lead', lead));
      if (tip) bubble.appendChild(el('span', 'chat-notice-tip', ' ' + tip));
      row.appendChild(bubble);
      log.appendChild(row);
      scrollDown();
    }

    function thinking() {
      var row = el('div', 'chat-row chat-row-coach chat-thinking');
      row.appendChild(avatar());
      var bubble = el('div', 'chat-bubble chat-coach');
      bubble.setAttribute('aria-busy', 'true');
      bubble.appendChild(srOnly(ui.thinking));
      var dots = el('span', 'chat-dots');
      dots.setAttribute('aria-hidden', 'true');
      for (var i = 0; i < 3; i++) dots.appendChild(el('span', 'chat-dot'));
      bubble.appendChild(dots);
      row.appendChild(bubble);
      log.appendChild(row);
      log.setAttribute('aria-busy', 'true');
      scrollDown();
      return row;
    }

    function doneThinking(row) {
      if (row && row.parentNode) row.parentNode.removeChild(row);
      log.removeAttribute('aria-busy');
    }

    /* ---------- controls ---------- */

    function setEnabled(on) {
      input.disabled = !on;
      send.disabled = !on;
      Array.prototype.forEach.call(chips.querySelectorAll('button'), function (b) {
        b.disabled = !on;
      });
      wrap.classList.toggle('is-disabled', !on);
    }

    function renderChips(list) {
      chips.textContent = '';
      (list || []).forEach(function (text) {
        var chip = el('button', 'chat-chip', text);
        chip.type = 'button';
        chip.addEventListener('click', function () { ask(text); });
        chips.appendChild(chip);
      });
      chips.hidden = !(list && list.length);
    }

    function opening(c) {
      return s.screenOpenings[c.screen] || s.openings[c.screenType] || { line: '', chips: [] };
    }

    function locked(c) {
      return s.lockedTypes.indexOf(c.screenType) !== -1;
    }

    function applyContext(c) {
      var sameScreen = ctx && ctx.screen === c.screen;
      ctx = c;
      if (sameScreen) return; // e.g. the case notes changed: keep the conversation
      turn++;
      prev = null;
      busy = false;
      log.textContent = '';
      log.removeAttribute('aria-busy');
      var o = opening(c);
      if (locked(c)) {
        noticeSay(o.line || ui.locked_line);
        renderChips([]);
        footer.hidden = true;
        return;
      }
      footer.hidden = false;
      if (o.line) coachSay(o.line);
      if (capped) {
        renderChips([]);
        noticeSay(ui.cap_lead, c.tip);
        setEnabled(false);
        return;
      }
      renderChips(o.chips);
      setEnabled(true);
    }

    /* ---------- one question ---------- */

    function ask(raw) {
      var q = String(raw || '').replace(/\s+/g, ' ').trim().slice(0, s.maxQ);
      if (!q || !ctx || busy || capped || locked(ctx)) return;
      learnerSay(q);
      input.value = '';
      if (!live) {
        noticeSay(ui.offline_lead, ctx.tip);
        return;
      }
      busy = true;
      setEnabled(false);
      var myTurn = turn;
      var asked = ctx;
      var dots = thinking();
      live.coachChat(asked, q, prev).then(function (res) {
        if (myTurn !== turn) return;
        doneThinking(dots);
        if (res.blocked) {
          var says = res.source === 'case' ? ui.blocked_case : ui.blocked;
          noticeSay(says.split('{what}').join(res.what));
        } else {
          coachSay(res.text);
          prev = { q: q, a: res.text };
        }
        if (live.capReached()) capReached();
      }).catch(function (err) {
        if (myTurn !== turn) return;
        doneThinking(dots);
        if (err && err.message === 'token_cap') capReached();
        else noticeSay(ui.offline_lead, asked.tip);
      }).then(function () {
        if (myTurn !== turn) return;
        busy = false;
        if (!capped) {
          setEnabled(true);
          input.focus();
        }
      });
    }

    function capReached() {
      capped = true;
      noticeSay(ui.cap_lead, ctx && ctx.tip);
      renderChips([]);
      setEnabled(false);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      ask(input.value);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') toLesson('wawiwa-coach-close');
    });

    window.addEventListener('message', function (e) {
      if (!framed() || e.source !== window.parent) return;
      var c = validContext(e.data, s);
      if (c) applyContext(c);
    });

    // framed: wait for the lesson's context (nothing can be asked before
    // it, so a launch straight onto a locked screen never shows an input).
    // Standalone (the Pages URL opened directly): the pack's opener.
    if (framed()) {
      footer.hidden = true;
      toLesson('wawiwa-coach-ready');
    } else if (activity.chat && activity.chat.standalone_context) {
      applyContext(resolveContext(activity.chat.standalone_context, s));
    }
  }

  C.registerFormat('chat', renderChat);
})();

/*
 * Practice Studio format: coached_canvas, the Mission workbook.
 *
 * Rendered through the shared Mission skin (engine/mission.js). The layout
 * follows the spec's meta.layout: a "cases" workbook (L1/L2 class) makes each
 * SECTION one playable stop entered from the case picker in any order; any
 * other spec renders its sections in order as ONE continuous screen, each
 * section's title + instruction as a heading above its fields. Either way a
 * screen shows the case scenario at the top, then every field stacked: the
 * field label, its labeled INSTRUCTIONS card, and its answer editor. Insight points stay keyed to fields; the header medallion
 * counts Ready fields on a single-case activity and completed cases on a
 * multi-case one. A reward toast lands each Ready field. The mission ends on a
 * review scene and a designed one-page report export; on a multi-case activity
 * each case also exports its own scoped report.
 *
 * Mechanics are identical to before and stay field-keyed underneath: the same
 * field editors, local checks, live coach, review (levelBanner is where
 * passback hooks), fix-links by field id, and autosave. This file is layout
 * and motion only.
 */
(function () {
  'use strict';

  var C = window.PracticeCore;
  var M = window.PracticeMission;
  var FB = window.PracticeFeedback;
  var el = C.el;

  var INTRO_ID = '_intro';
  var PICKER_ID = '_cases';
  var REVIEW_ID = '_review';

  function shortTitle(section) {
    return (section.title || '').replace(/^Part [A-Z]\s*[\u2014-]\s*/, '');
  }

  /* ---------- the playable stops: intro, one per section, review ---------- */

  function collectStops(activity, state) {
    var stops = [{ kind: 'intro', id: INTRO_ID }];
    state.items = [];          // every field/prompt, flat, in spec order
    state.stopOf = {};         // field/prompt id -> its section stop
    // The case picker is an AUTHORING decision, never a section count: only
    // a spec that declares meta.layout "cases" is a pick-one-of-N workbook
    // (L1/L2 class). Every other multi-section activity is one deliverable
    // split into ordered parts and renders as one continuous screen.
    state.multiCase = !!(activity.meta && activity.meta.layout === 'cases');
    var number = 0;
    function register(stop) {
      stop.items.forEach(function (entry) {
        number += 1;
        entry.number = number;
        state.stopOf[entry.id] = stop;
      });
      state.items = state.items.concat(stop.items);
      stops.push(stop);
    }
    var groups = [];
    (activity.sections || []).forEach(function (section) {
      var items = [];
      (section.type === 'fields' ? (section.fields || []) : []).forEach(function (field) {
        items.push({ kind: 'field', id: field.id, item: field, section: section });
      });
      (section.type === 'ordered_points' ? (section.prompts || []) : []).forEach(function (prompt) {
        items.push({ kind: 'prompt', id: prompt.id, item: prompt, section: section });
      });
      // a 'card' section is read-only information (e.g. the L6 peer-review
      // protocol): it renders inline in the continuous flow, holds no items,
      // and can never gate progress, Ready, or the review
      if (items.length || section.type === 'card') groups.push({ section: section, items: items });
    });
    if (state.multiCase || groups.length <= 1) {
      // one playable stop per section: the cases of a picker workbook, or
      // the single screen of a single-section activity. Item-less card
      // groups never become stops of their own.
      groups.forEach(function (g) {
        if (!g.items.length) return;
        register({ kind: 'section', id: g.section.id, section: g.section, items: g.items });
      });
    } else {
      // one CONTINUOUS activity: every section in spec order on one screen,
      // each with its title + instruction as a heading above its fields;
      // one progress bar over all fields, the one end review + report
      var all = [];
      groups.forEach(function (g) { all = all.concat(g.items); });
      register({ kind: 'section', id: '_work', section: null, sections: groups, items: all });
    }
    stops.push({ kind: 'review', id: REVIEW_ID });
    if (state.multiCase) {
      // picker workbooks land on the case picker after the intro; the picker
      // (not the side rail) is the primary way into a case
      stops.splice(1, 0, { kind: 'picker', id: PICKER_ID });
    }
    return stops;
  }

  function workStops(stops) {
    return stops.filter(function (s) { return s.kind === 'section'; });
  }

  /* ---------- Insight points, still per FIELD, from the same checks ---------- */

  function itemTag(entry, activity, state) {
    var text = (state.answers[entry.id] || '').trim();
    if (!text) return null;
    if (entry.kind === 'field') {
      // the live coach is authoritative: while its verdict matches the
      // current answer text it drives the tile, points, and report tag;
      // the deterministic check is the silent fallback otherwise
      var coachTag = C.coachTagFor(state, entry.id);
      if (coachTag) return coachTag;
      return FB.evaluateField(entry.item, text, state.checks, activity).tag;
    }
    return FB.evaluatePoint(entry.item, text, state.checks).tag;
  }

  function itemPoints(entry, cfg) {
    return entry.kind === 'field' ? cfg.field_ready : cfg.prompt_ready;
  }

  function tallyPoints(activity, state, cfg) {
    var total = 0;
    state.items.forEach(function (entry) {
      if (itemTag(entry, activity, state) === 'Ready') total += itemPoints(entry, cfg);
    });
    return total;
  }

  function maxPoints(state, cfg) {
    return state.items.reduce(function (sum, entry) {
      return sum + itemPoints(entry, cfg);
    }, 0);
  }

  /* a section's aggregate status: all fields Ready = done,
     some answered = in progress, none = not started */
  function sectionStatus(stop, activity, state) {
    var tags = stop.items.map(function (entry) { return itemTag(entry, activity, state); });
    var answered = stop.items.filter(function (entry) {
      return (state.answers[entry.id] || '').trim();
    }).length;
    return {
      done: tags.length > 0 && tags.every(function (t) { return t === 'Ready'; }),
      answered: answered,
      total: stop.items.length
    };
  }

  /* ---------- HUD + rail refresh ---------- */

  function refreshProgress(activity, state) {
    var cfg = state.missionPoints;
    var pts = tallyPoints(activity, state, cfg);
    state.shell.hud.setPoints(pts);
    if (pts > (state.lastPts || 0) && state.booted) {
      M.toast('Field locked in', pts - (state.lastPts || 0));
    } else if (pts < (state.lastPts || 0) && state.booted) {
      // a Ready field went back (the live coach said Light or Revise, or an edit): say so, never drop points silently
      M.toast('Field needs another look', pts - (state.lastPts || 0));
    }
    state.lastPts = pts;

    if (state.multiCase) {
      // the header ring counts CASES COMPLETED (a case is complete when all
      // its fields are Ready), never the raw field total across all cases
      var doneCases = workStops(state.stops).filter(function (stop) {
        return sectionStatus(stop, activity, state).done;
      }).length;
      state.shell.hud.medallion.set(doneCases, workStops(state.stops).length);
    } else {
      var ready = state.items.filter(function (entry) {
        return itemTag(entry, activity, state) === 'Ready';
      });
      state.shell.hud.medallion.set(ready.length, state.items.length);
    }

    // section tiles (the rail, now a secondary jump list) and the picker's
    // case cards share the same aggregate status
    workStops(state.stops).forEach(function (stop) {
      var st = sectionStatus(stop, activity, state);
      var tile = state.tileFor[stop.id];
      if (tile) {
        tile.className = 'm-tile'
          + (state.currentId === stop.id ? ' m-tile-open' : '')
          + (st.done ? ' m-tile-done' : (st.answered ? ' m-tile-active' : ''));
        var dot = tile.querySelector('.m-tile-dot');
        dot.textContent = '';
        if (st.done) dot.appendChild(C.svgEl(M.GLYPH.check, 'm-tile-check'));
        else dot.appendChild(el('span', null, String(stop.number)));
        var sectionPts = stop.items.reduce(function (sum, entry) {
          return sum + itemPoints(entry, cfg);
        }, 0);
        tile.querySelector('.m-tile-st').textContent =
          st.done ? C.fmtLabel('completeStatus', sectionPts)
            : (st.answered ? st.answered + ' of ' + st.total + ' answered' : 'Not started');
      }
      var card = state.cardFor && state.cardFor[stop.id];
      if (card) {
        card.className = 'm-case-card'
          + (st.done ? ' m-case-done' : (st.answered ? ' m-case-active' : ''));
        card.querySelector('.m-case-st').textContent =
          st.done ? 'Done' : (st.answered ? 'In progress  ·  ' + st.answered + ' of ' + st.total : 'Not started');
      }
    });

    if (state.pickerOverall) {
      var doneCount = workStops(state.stops).filter(function (stop) {
        return sectionStatus(stop, activity, state).done;
      }).length;
      state.pickerOverall.textContent =
        'Cases completed: ' + doneCount + ' of ' + workStops(state.stops).length;
    }

    // the footer bar tracks the CURRENT case only (per-case progress);
    // on single-section activities that is the whole activity anyway
    if (state.barFill && state.currentStop && state.currentStop.kind === 'section') {
      var st2 = sectionStatus(state.currentStop, activity, state);
      state.barFill.style.width = (st2.total ? Math.round(100 * st2.answered / st2.total) : 0) + '%';
      state.barCount.textContent = state.multiCase
        ? st2.answered + ' of ' + st2.total + ' answered in this case'
        : st2.answered + '/' + st2.total + ' answered';
      if (state.caseBackBtn && state.multiCase) {
        // once every field of the case is Ready, the way out reads as a finish
        state.caseBackBtn.textContent = st2.done ? 'Done with this case' : 'Back to cases';
      }
    }
  }

  /* ---------- the Mission Board rail (the case picker) ---------- */

  function buildRail(activity, state, openStop) {
    var rail = el('nav', 'm-rail');
    rail.appendChild(el('h4', 'm-rail-title', C.LABELS.railTitle));
    var work = workStops(state.stops);
    work.forEach(function (stop, i) {
      stop.number = i + 1;
      var tile = el('button', 'm-tile');
      tile.type = 'button';
      var dot = el('span', 'm-tile-dot', String(stop.number));
      tile.appendChild(dot);
      var txt = el('span', 'm-tile-txt');
      txt.appendChild(el('span', 'm-tile-nm',
        stop.section ? shortTitle(stop.section) : activity.meta.title));
      txt.appendChild(el('span', 'm-tile-st', 'Not started'));
      tile.appendChild(txt);
      tile.addEventListener('click', function () { openStop(stop.id); });
      state.tileFor[stop.id] = tile;
      rail.appendChild(tile);
    });
    var report = el('button', 'm-tile m-tile-report');
    report.type = 'button';
    var rdot = el('span', 'm-tile-dot');
    rdot.appendChild(C.svgEl(M.GLYPH.star, null));
    report.appendChild(rdot);
    var rtxt = el('span', 'm-tile-txt');
    rtxt.appendChild(el('span', 'm-tile-nm', C.LABELS.report));
    rtxt.appendChild(el('span', 'm-tile-st', C.LABELS.reportHint));
    report.appendChild(rtxt);
    report.addEventListener('click', function () { openStop(REVIEW_ID); });
    rail.appendChild(report);
    rail.appendChild(el('div', 'm-rail-foot',
      work.length > 1
        ? C.fmtLabel('railFootMany', work.length)
        : C.LABELS.railFootOne));
    return rail;
  }

  /* ---------- the intro scene ---------- */

  function buildIntroScene(activity, state, openStop) {
    var scene = M.buildScene({
      eyebrow: [activity.meta.program, activity.meta.module, activity.meta.lesson]
        .filter(Boolean).join('  ·  '),
      title: activity.meta.title
    });
    scene.node.querySelector('.m-scene-title').classList.add('m-scene-title-big');
    if (activity.intro && activity.intro.headline) {
      scene.body.appendChild(el('p', 'm-lead m-lead-strong', activity.intro.headline));
    }
    if (activity.intro && activity.intro.body) {
      scene.body.appendChild(el('p', 'm-lead', activity.intro.body));
    }

    var say = el('div', 'm-mentor-say');
    say.appendChild(M.mentor(50));
    var sayBody = el('div');
    sayBody.appendChild(el('b', null, 'Wawiwa AI Coach'));
    sayBody.appendChild(el('div', 'm-mentor-text',
      'Open any stop, write each answer in your own words, check it, and I will react to what you wrote.'));
    say.appendChild(sayBody);
    scene.body.appendChild(say);

    if (state.scaffold) {
      var support = el('div', 'm-support-note');
      support.appendChild(el('p', null,
        'Support mode. Each field shows a worked example from a different case. Read it, then write your own version for your case. Same canvas, same saving, gentler road.'));
      scene.body.appendChild(support);
    }

    var work = workStops(state.stops);
    var chips = el('div', 'meta-chips title-chips');
    if (activity.meta.estimated_minutes) {
      chips.appendChild(el('span', 'meta-chip', 'About ' + activity.meta.estimated_minutes + ' minutes'));
    }
    if (state.multiCase) {
      // cases, never the raw field total across all of them (the v2c rule)
      chips.appendChild(el('span', 'meta-chip', work.length + ' cases'));
    } else {
      chips.appendChild(el('span', 'meta-chip',
        work.length === 1 ? '1 stop' : work.length + ' stops'));
      chips.appendChild(el('span', 'meta-chip',
        state.items.length === 1 ? '1 field' : state.items.length + ' fields'));
    }
    chips.appendChild(el('span', 'meta-chip' + (C.liveOn() ? ' meta-chip-live' : ''),
      C.liveOn() ? 'Live coach' : 'Local coach'));
    scene.body.appendChild(chips);

    // the PII rule stays a first-class part of the flow
    var safety = (activity.safety || {}).student_notice;
    if (safety) {
      var box = el('div', 'm-safety');
      var head = el('div', 'm-safety-head');
      head.appendChild(C.svgEl(C.SVG.shield, 'safety-icon'));
      head.appendChild(el('strong', 'm-safety-title', 'Before you start: no personal data.'));
      box.appendChild(head);
      box.appendChild(el('p', 'm-safety-body', safety));
      box.appendChild(el('p', 'm-safety-local', C.liveOn()
        ? 'Your work is saved only in this browser. When you ask the live coach, your answer text is scrubbed of emails, phone numbers, long numbers, and keys, then sent anonymously through Wawiwa’s proxy. Your identity is never sent because it is never collected.'
        : 'Everything you write stays in this browser on this device. This page sends nothing anywhere.'));
      scene.body.appendChild(box);
    }

    var foot = scene.foot();
    foot.appendChild(el('span', 'm-spacer'));
    var started = state.items.some(function (entry) {
      return (state.answers[entry.id] || '').trim();
    });
    var start = el('button', 'btn btn-primary btn-large',
      state.multiCase ? (started ? 'Continue: choose a case' : 'Choose a case')
        : (started ? C.LABELS.resume : C.LABELS.start));
    start.type = 'button';
    start.addEventListener('click', function () {
      if (state.multiCase) { openStop(PICKER_ID); return; }
      var next = work.filter(function (s) {
        return s.items.some(function (entry) { return !(state.answers[entry.id] || '').trim(); });
      })[0] || work[0];
      openStop(next.id);
    });
    foot.appendChild(start);
    return scene.node;
  }

  /* ---------- the case picker (multi-case activities only) ---------- */
  /* All cases on one page as selectable cards; this, not the side rail,
     is the primary way into a case. Any order, nothing gated. */

  function buildPickerScene(activity, state, openStop) {
    var work = workStops(state.stops);
    var scene = M.buildScene({
      eyebrow: activity.meta.title,
      title: 'Choose a case to work on'
    });
    scene.node.querySelector('.m-scene-title').classList.add('m-scene-title-big');

    state.pickerOverall = el('p', 'm-picker-overall', '');
    scene.body.appendChild(state.pickerOverall);

    var grid = el('div', 'm-picker');
    state.cardFor = {};
    work.forEach(function (stop) {
      var card = el('button', 'm-case-card');
      card.type = 'button';
      var head = el('div', 'm-case-head');
      head.appendChild(el('span', 'm-case-num', String(stop.number)));
      head.appendChild(el('span', 'm-case-title', shortTitle(stop.section)));
      card.appendChild(head);
      var preview = (stop.section.instruction || '').trim();
      if (preview) {
        card.appendChild(el('p', 'm-case-preview',
          preview.length > 160 ? preview.slice(0, 157).replace(/\s+\S*$/, '') + '…' : preview));
      }
      card.appendChild(el('span', 'm-case-st', 'Not started'));
      card.addEventListener('click', function () { openStop(stop.id); });
      state.cardFor[stop.id] = card;
      grid.appendChild(card);
    });
    scene.body.appendChild(grid);

    var foot = scene.foot();
    foot.appendChild(el('span', 'm-foot-note',
      'Open the cases in any order. Your work saves as you type.'));
    foot.appendChild(el('span', 'm-spacer'));
    var report = el('button', 'btn btn-teal', C.LABELS.report);
    report.type = 'button';
    report.addEventListener('click', function () { openStop(REVIEW_ID); });
    foot.appendChild(report);
    return scene.node;
  }

  /* a read-only informational card (a 'card' section, e.g. the L6 peer
     review): body, optional bullet list, optional footer line. No inputs,
     no checks, no points; purely part of the flow. */
  function buildNoteCard(section) {
    var card = el('div', 'm-notecard');
    if (section.body) card.appendChild(el('p', 'm-notecard-body', section.body));
    if ((section.bullets || []).length) {
      var list = el('ul', 'm-notecard-list');
      section.bullets.forEach(function (line) {
        list.appendChild(el('li', null, line));
      });
      card.appendChild(list);
    }
    if (section.footer) card.appendChild(el('p', 'm-notecard-foot', section.footer));
    return card;
  }

  /* ---------- one field or prompt, stacked inside its section screen ---------- */

  function buildPromptEditor(state, activity, prompt) {
    // ordered_points editor: same checks and autosave as before; the section
    // screen renders the label, so the card holds only the work surface
    var card = el('div', 'field-card');
    card.id = 'card-' + prompt.id;
    var ta = el('textarea', 'answer-input answer-short');
    ta.id = 'input-' + prompt.id;
    // labelled at creation; the section screen re-points this at its
    // visible block heading (WCAG 1.3.1 / 3.3.2)
    ta.setAttribute('aria-label', prompt.label || 'Your answer');
    ta.placeholder = 'Points to speak from, not a script.';
    ta.value = state.answers[prompt.id] || '';
    var feedback = C.liveRegion();
    var check = function () {
      var result = FB.evaluatePoint(prompt, state.answers[prompt.id], state.checks);
      C.feedbackBlock(feedback, result);
      refreshProgress(activity, state);
      return result;
    };
    ta.addEventListener('input', function () {
      state.answers[prompt.id] = ta.value;
      C.saveAnswers(activity, state.answers);
      refreshProgress(activity, state);
    });
    ta.addEventListener('blur', function () {
      if ((ta.value || '').trim()) check();
    });
    card.appendChild(ta);
    var btnRow = el('div', 'btn-row');
    var btn = el('button', 'btn btn-primary', 'Check this point');
    btn.type = 'button';
    btn.addEventListener('click', check);
    btnRow.appendChild(btn);
    card.appendChild(btnRow);
    card.appendChild(feedback);
    state.checkFns[prompt.id] = check;
    return { card: card, check: check, textarea: ta };
  }

  function buildItemBlock(activity, state, entry) {
    var block = el('div', 'm-fieldblock');
    block.id = 'block-' + entry.id;
    var blockTitle = el('h3', 'm-fieldblock-title', entry.item.label);
    blockTitle.id = 'block-title-' + entry.id;
    block.appendChild(blockTitle);

    // The field's instructions, clearly labelled and placed above the answer.
    // This is authored guidance, not the AI coach; the coach only speaks after
    // the student clicks Check this field or Ask the coach, and its feedback
    // renders inside the editor card below, on demand.
    var helpText = entry.item.help || '';
    if (helpText) {
      var instr = el('div', 'm-instructions');
      var ik = el('div', 'm-instructions-k');
      ik.appendChild(el('span', null, 'Instructions'));
      instr.appendChild(ik);
      instr.appendChild(el('p', 'm-instructions-p', helpText));
      var pcfg = state.missionPoints;
      // the reward chip is skin-gated wording: on rise the label is null and
      // the chip does not render at all (points still count silently)
      var rewardText = C.fmtLabel('reward', itemPoints(entry, pcfg));
      if (rewardText) {
        var chip = el('div', 'm-instructions-reward');
        // the SVG star, not a text star: decorative, hidden, and exempt from
        // the text-contrast rule a low-contrast gold character would fail
        chip.appendChild(C.svgEl(M.GLYPH.star, 'm-instructions-star'));
        chip.appendChild(el('span', null, rewardText));
        instr.appendChild(chip);
      }
      block.appendChild(instr);
    }

    var editor = state.editors[entry.id];
    if (!editor) {
      if (entry.kind === 'field') {
        editor = C.fieldEditor(state, activity, entry.item, {
          onResult: function () { refreshProgress(activity, state); }
        });
        editor.textarea.addEventListener('input', function () {
          refreshProgress(activity, state);
        });
      } else {
        editor = buildPromptEditor(state, activity, entry.item);
      }
      state.editors[entry.id] = editor;
    }
    // the visible block heading is the programmatic label of the input here
    // (the field-head inside the editor is hidden by the Mission layout)
    editor.textarea.setAttribute('aria-labelledby', blockTitle.id);
    block.appendChild(editor.card);
    return block;
  }

  /* ---------- one SECTION, as a scene (one screen per case) ---------- */

  function buildSectionScene(activity, state, stop, openStop) {
    var work = workStops(state.stops);
    var idx = work.indexOf(stop);
    var scene = M.buildScene({
      // a one-part activity carries no step badge on the rise skin
      badge: work.length > 1 ? C.fmtLabel('stopBadge', work.length, idx + 1)
        : C.LABELS.stopBadgeSolo,
      title: stop.section ? shortTitle(stop.section) : activity.meta.title,
      className: 'm-scene-wide'
    });

    var grid = el('div', 'm-workgrid m-workgrid-single');
    scene.body.appendChild(grid);

    var console_ = el('div', 'm-console');
    // declared image attachments (the L5 diagram) open the deliverable: they
    // render once, at the top of the first work screen, above the sections
    if (idx === 0 && (activity.attachments || []).length && window.PracticeAttach) {
      activity.attachments.forEach(function (att) {
        console_.appendChild(window.PracticeAttach.buildEditor(state, activity, att));
      });
    }
    if (stop.sections) {
      // the continuous layout: every section in order, its title and
      // instruction as a heading above its own fields
      stop.sections.forEach(function (group) {
        console_.appendChild(el('h2', 'm-sectionhead', group.section.title));
        if (group.section.type === 'card') {
          console_.appendChild(buildNoteCard(group.section));
          return;
        }
        if (group.section.instruction) {
          console_.appendChild(el('p', 'm-console-hint m-scenario', group.section.instruction));
        }
        group.items.forEach(function (entry) {
          console_.appendChild(buildItemBlock(activity, state, entry));
        });
      });
    } else {
      // The section instruction is the case scenario: it opens the screen, so
      // the student reads the situation once and then works every field of it.
      if (stop.section.instruction) {
        console_.appendChild(el('p', 'm-console-hint m-scenario', stop.section.instruction));
      }
      stop.items.forEach(function (entry) {
        console_.appendChild(buildItemBlock(activity, state, entry));
      });
    }
    grid.appendChild(console_);

    var foot = scene.foot();
    if (state.multiCase) {
      // the picker is the primary navigation: a clear way back to it,
      // per-case progress, and a shortcut to the next case
      var backToCases = el('button', 'btn btn-ghost', 'Back to cases');
      backToCases.type = 'button';
      backToCases.addEventListener('click', function () { openStop(PICKER_ID); });
      foot.appendChild(backToCases);
      state.caseBackBtn = backToCases;
    } else {
      var prev = el('button', 'btn btn-ghost', 'Back');
      prev.type = 'button';
      prev.disabled = true;
      foot.appendChild(prev);
    }

    var barWrap = el('div', 'm-bar');
    state.barFill = el('i');
    barWrap.appendChild(state.barFill);
    foot.appendChild(barWrap);
    state.barCount = el('span', 'm-bar-count', '');
    foot.appendChild(state.barCount);

    if (state.multiCase) {
      // each case is independently finishable: a footer-free PDF of just
      // this case, so a student can complete one case, save it, and stop
      // without visiting the global Mission report (which stays available)
      var casePdf = el('button', 'btn btn-teal');
      casePdf.type = 'button';
      casePdf.appendChild(C.svgEl(C.SVG.download, 'btn-icon'));
      casePdf.appendChild(el('span', null, 'Save this case as PDF'));
      casePdf.addEventListener('click', function () {
        window.PracticeExport.saveReport(activity, caseReportData(activity, state, stop));
      });
      foot.appendChild(casePdf);
    }

    var next = el('button', 'btn btn-primary',
      idx + 1 < work.length ? (state.multiCase ? C.LABELS.nextCase : C.LABELS.next) : C.LABELS.finish);
    next.type = 'button';
    next.addEventListener('click', function () {
      if (idx + 1 < work.length) openStop(work[idx + 1].id);
      else openStop(REVIEW_ID);
    });
    foot.appendChild(next);
    return scene.node;
  }

  /* ---------- the review scene (mechanics unchanged, passback intact) ---------- */

  function buildReviewScene(activity, state, openStop) {
    var scene = M.buildScene({
      badge: C.LABELS.report,
      eyebrow: C.LABELS.reviewEyebrow,
      title: 'Review my work',
      className: 'm-scene-wide'
    });
    scene.body.appendChild(el('p', 'm-lead',
      'A rule-based review against the rubric. It checks structure, not meaning: a green tag says the bones are in place.'));

    var btn = el('button', 'btn btn-teal btn-large', 'Run the full review');
    btn.type = 'button';
    var out = C.liveRegion('review-out');
    var coachOut = C.liveOn() ? C.liveRegion() : null;

    // the personal path (E4): home activities only; the component itself
    // gates on meta.context, so a class build renders nothing here
    var pathHost = el('div', 'm-path-host');
    function renderPath() {
      var cfg = state.missionPoints;
      pathHost.textContent = '';
      var block = window.PracticeOutcome.buildPathBlock(activity, state, {
        points: tallyPoints(activity, state, cfg),
        max: maxPoints(state, cfg)
      });
      if (block) pathHost.appendChild(block);
    }

    btn.addEventListener('click', function () {
      out.textContent = '';
      var evalResult = FB.evaluateActivity(activity, state.checks, state.answers);
      state.lastEval = evalResult; // the designed export shows the result too
      // with the coach on, the review never repaints local boxes into the
      // editors: the coach's verdicts stay the one voice on each field
      if (!C.liveOn()) {
        Object.keys(state.checkFns).forEach(function (id) { state.checkFns[id](); });
      }
      refreshProgress(activity, state);
      renderPath();

      out.appendChild(C.levelBanner(evalResult));
      evalResult.notes.forEach(function (n) {
        out.appendChild(el('div', 'review-note', n));
      });
      out.appendChild(C.rubricBox(evalResult));

      if (evalResult.overall.fixes.length) {
        var fixBox = el('div', 'fix-box');
        fixBox.appendChild(el('h3', 'panel-subtitle', 'Start here'));
        evalResult.overall.fixes.forEach(function (f) {
          var row = el('div', 'fix-row');
          var link = el('button', 'fix-link m-fix-link', f.label);
          link.type = 'button';
          link.addEventListener('click', function () { openStop(f.fieldId); });
          row.appendChild(link);
          if (f.message) row.appendChild(el('span', 'fix-why', ' ' + f.message));
          fixBox.appendChild(row);
        });
        out.appendChild(fixBox);
      }
      out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    var btnRow = el('div', 'btn-row');
    btnRow.appendChild(btn);
    if (coachOut) {
      btnRow.appendChild(C.coachButton(state, 'Ask the coach for a full review', function (b) {
        b.disabled = true;
        C.coachThinking(coachOut);
        window.PracticeLive.coachCanvas(activity, state.answers)
          .then(function (r) { b.disabled = false; C.coachBlock(coachOut, r.text, null, activity); })
          .catch(function (err) { b.disabled = false; C.coachFallback(state, coachOut, err, function () { btn.click(); }); });
      }));
    }
    scene.body.appendChild(btnRow);
    if (coachOut) scene.body.appendChild(coachOut);
    scene.body.appendChild(out);
    scene.body.appendChild(pathHost);
    renderPath(); // present as soon as the student reaches the last stop

    var foot = scene.foot();
    // on a skin that hides the rail (rise, one-part activities), the review
    // still needs a way back to the work screen
    if (C.LABELS.reviewBack) {
      var backBtn = el('button', 'btn btn-ghost', C.LABELS.reviewBack);
      backBtn.type = 'button';
      backBtn.addEventListener('click', function () {
        openStop(workStops(state.stops)[0].id);
      });
      foot.appendChild(backBtn);
    }
    var clearBtn = el('button', 'btn btn-ghost-danger', 'Clear my work');
    clearBtn.type = 'button';
    clearBtn.addEventListener('click', function () {
      if (window.confirm('Delete everything you wrote on this device? This cannot be undone.')) {
        C.clearAnswers(activity);
        window.location.reload();
      }
    });
    foot.appendChild(clearBtn);
    foot.appendChild(el('span', 'm-spacer'));
    var printBtn = el('button', 'btn btn-primary');
    printBtn.type = 'button';
    printBtn.appendChild(C.svgEl(C.SVG.download, 'btn-icon'));
    printBtn.appendChild(el('span', null, C.LABELS.savePdf));
    printBtn.addEventListener('click', function () {
      // code-generated PDF: no browser print footer, embed-safe
      window.PracticeExport.saveReport(activity, reportData(activity, state));
    });
    foot.appendChild(printBtn);
    return scene.node;
  }

  /* ---------- the designed export ---------- */

  /* one data model feeds both the on-screen report sheet (browser print
     path) and the code-generated PDF (engine/export.js) */
  function reportData(activity, state) {
    var cfg = state.missionPoints;
    var sections = [];
    workStops(state.stops).forEach(function (stop) {
      // the continuous layout folds sections into one stop; the report keeps
      // one section block per SPEC section either way
      var groups = stop.sections || [{ section: stop.section, items: stop.items }];
      groups.forEach(function (group) {
        // read-only card sections are information, not work: no report block
        if (group.section.type === 'card') return;
        var cards = group.items.map(function (entry, i) {
          var text = (state.answers[entry.id] || '').trim();
          return {
            num: entry.number || i + 1,
            title: entry.item.label,
            tag: itemTag(entry, activity, state),
            rows: [{ value: text || 'Not answered yet.', empty: !text }]
          };
        });
        sections.push({ title: group.section.title, cards: cards });
      });
    });

    var level = state.lastEval ? {
      index: state.lastEval.overall.levelIndex,
      label: state.lastEval.overall.level
    } : null;

    // the personal path rides in the same report (home activities only;
    // reportSection returns null otherwise)
    var pathSection = window.PracticeOutcome.reportSection(activity, state, {
      points: tallyPoints(activity, state, cfg),
      max: maxPoints(state, cfg)
    });
    if (pathSection) sections.push(pathSection);

    return {
      scoreline: { points: tallyPoints(activity, state, cfg), max: maxPoints(state, cfg) },
      level: level,
      // attached diagrams ride at the top of the PDF, caption + image
      attachments: window.PracticeAttach
        ? window.PracticeAttach.attachmentData(activity, state) : [],
      sections: sections
    };
  }

  function buildReport(activity, state) {
    M.buildReportSheet(activity, reportData(activity, state));
  }

  /* the per-case export: one section only (the case scenario, then each of
     its fields with the student's answer and its tag). Rides the same jsPDF
     path as the full Mission report (footer-free, embed-safe), scoped by
     data.title and data.fileSlug. */
  function caseReportData(activity, state, stop) {
    var cfg = state.missionPoints;
    var cards = [];
    var scenario = (stop.section.instruction || '').trim();
    if (scenario) {
      cards.push({ title: 'The case', rows: [{ value: scenario }] });
    }
    var pts = 0, max = 0;
    stop.items.forEach(function (entry, i) {
      var text = (state.answers[entry.id] || '').trim();
      cards.push({
        num: i + 1,
        title: entry.item.label,
        tag: itemTag(entry, activity, state),
        rows: [{ value: text || 'Not answered yet.', empty: !text }]
      });
      max += itemPoints(entry, cfg);
      if (itemTag(entry, activity, state) === 'Ready') pts += itemPoints(entry, cfg);
    });
    return {
      title: 'Case Report  ·  ' + shortTitle(stop.section),
      fileSlug: stop.id,
      scoreline: { points: pts, max: max },
      sections: [{ title: stop.section.title, cards: cards }]
    };
  }

  /* ---------- the format ---------- */

  function renderCoachedCanvas(rootNode, activity, checks, state) {
    state.tileFor = {};
    state.editors = {};
    state.stops = collectStops(activity, state);
    state.missionPoints = M.pointsConfig(activity);

    // Scaffolded support mode (Self-Study Phase 8): the SAME activity opened
    // with #scaffold shows each field's worked example (from a different
    // case). Mechanics, checks, answers, and scoring are identical.
    state.scaffold = /(^|[#&])scaffold(\b|$)/.test(window.location.hash || '');
    if (state.scaffold) {
      document.body.classList.add('canvas-scaffold');
      FB.collectFields(activity).forEach(function (field) {
        if (field.scaffold_example && !field.good_example) {
          field.good_example = field.scaffold_example;
        }
      });
    }

    // the blank template sits in the top bar, so it is there on every stop,
    // before Start too; it reads the spec only, never the student's work
    var blankBtn = el('button', 'btn btn-ghost m-blank-pdf');
    blankBtn.type = 'button';
    blankBtn.appendChild(C.svgEl(C.SVG.download, 'btn-icon'));
    blankBtn.appendChild(el('span', null, 'Download blank PDF'));
    blankBtn.addEventListener('click', function () {
      window.PracticeExport.saveBlank(activity);
    });

    var hudOpts = state.multiCase
      ? { total: workStops(state.stops).length, progressLabel: 'Cases completed' }
      : { total: state.items.length };
    hudOpts.extras = [blankBtn];
    state.shell = M.buildShell(rootNode, activity, hudOpts);
    state.shell.hud.node.classList.add('m-topbar-blank');
    var stage = M.buildStage(state.shell.main);
    state.shell.main.classList.add('m-main-rail');

    function openStop(id) {
      // a field id resolves to its section screen, then scrolls to the field
      // (the review's fix-links stay keyed by field id)
      var focusItemId = null;
      var stop = state.stops.filter(function (s) { return s.id === id; })[0];
      if (!stop && state.stopOf[id]) {
        focusItemId = id;
        stop = state.stopOf[id];
      }
      if (!stop) return;
      state.currentId = stop.id;
      state.currentStop = stop;
      if (stop.kind !== 'picker') { state.pickerOverall = null; state.cardFor = null; }
      var sceneIndex = state.stops.indexOf(stop);
      var raster = (stop.section && stop.section.background)
        || activity.meta.background || null;
      state.shell.backdrop.set(sceneIndex, raster);
      var node = stop.kind === 'intro' ? buildIntroScene(activity, state, openStop)
        : stop.kind === 'picker' ? buildPickerScene(activity, state, openStop)
        : stop.kind === 'review' ? buildReviewScene(activity, state, openStop)
        : buildSectionScene(activity, state, stop, openStop);
      stage.swap(node);
      refreshProgress(activity, state);
      if (focusItemId) {
        window.setTimeout(function () {
          var block = node.querySelector('#block-' + focusItemId);
          if (block) block.scrollIntoView({ behavior: 'smooth', block: 'start' });
          // a fix-link jump lands focus on that field heading (WCAG 2.4.3)
          var blockTitle = node.querySelector('#block-title-' + focusItemId);
          if (blockTitle) {
            blockTitle.setAttribute('tabindex', '-1');
            try { blockTitle.focus({ preventScroll: true }); } catch (e) { blockTitle.focus(); }
          }
        }, M.reducedMotion() ? 0 : 60);
      } else if (state.booted) {
        // step/case navigation moves focus to the heading of the new scene
        M.focusHeading(node);
      }
    }
    state.openTile = openStop;

    var rail = buildRail(activity, state, openStop);
    state.shell.main.insertBefore(rail, state.shell.main.firstChild);

    window.addEventListener('beforeprint', function () {
      buildReport(activity, state);
    });

    openStop(INTRO_ID);
    state.booted = true;
  }

  C.registerFormat('coached_canvas', renderCoachedCanvas);

  // a small pure surface for the deterministic tests (none of it touches
  // the DOM): stop collection, per-section status, the per-case export data
  window.PracticeCoachedCanvas = {
    collectStops: collectStops,
    sectionStatus: sectionStatus,
    caseReportData: caseReportData,
    reportData: reportData
  };
})();

/*
 * Practice Studio format: game_3d — the flagship first-person 3D walkthrough.
 *
 * A stylized LOW-POLY Wawiwa environment built entirely from Three.js
 * primitives and canvas-generated textures (no model files, no image fetches,
 * zero external requests). A corridor connects decision rooms; each room is
 * one station = one scene from the same branching_scenario spec. The student
 * looks with the mouse (drag), moves with WASD or by clicking the glowing
 * waypoint ring, reads the situation on a floating in-world panel, picks a
 * choice by clicking a 3D card, watches the room react (light shift + a wall
 * screen showing the shared Ready/Light/Revise tag), writes the reflection in
 * the shared field editor (same quality checks, same live coach through the
 * proxy, same PII redaction), and walks on. A low-poly robot companion
 * follows the player and delivers the coaching in a speech bubble.
 *
 * Every mechanic is unchanged and shared with branching_scenario:
 * PracticeFeedback.evaluateDecision / decisionKey / evaluateActivity,
 * PracticeCore.fieldEditor (checks + live coach + redaction), levelBanner
 * (where passback hooks), the same localStorage answer keys, the same
 * '_scenePath' travel key — so progress moves between the 2D and 3D builds
 * of the same content. This file is presentation only.
 *
 * Round 2 (2026-07-12), the finished M1 walkthrough: all seven stations
 * themed (vendor stage / rescope meeting / data archive / crossroads /
 * sunk-cost meeting / alarm-lit failure room / metric room) with per-room
 * mural icon sets, accent palettes, and prop dressing; a distinct detour
 * corridor (narrow amber duct) for weak-choice edges; a real 3D recap room
 * (walkable path markers, in-world rubric panel, medallion trophy, Wawi's
 * celebrate gesture + tier-gated confetti); a designed one-page export
 * sheet on the shared print design system; and re-pick parity with the 2D
 * game (Change my choice before advancing).
 *
 * Visual pass (2026-07-12): PBR materials over a procedural PMREM
 * environment (real reflections), physically-correct key/fill/rim rig with
 * PCFSoft shadows, first-party saturation-gated bright-pass bloom (the
 * colorful glow on brand emissives only), procedural Wawiwa poster murals
 * with generated normal/roughness maps, rounded hero geometry, the
 * redesigned glossy Wawi with idle life + tag gestures, adaptive
 * High/Medium/Low quality with a startup FPS probe + HUD toggle, on-demand
 * rendering (full rate only while something happens), eased walks, a fade
 * beat between stations, and a vignette.
 *
 * Robustness: devicePixelRatio capped at 2, geometries/materials/textures
 * tracked and disposed, WebGL init wrapped in try/catch with a plain fallback
 * (pointing to the 2D decision game as the graceful alternative), context
 * loss handled, prefers-reduced-motion honored (forces the calm Low tier:
 * no head bob, no idle motion, no gestures, instant walks and light shifts).
 */
(function () {
  'use strict';

  var C = window.PracticeCore;
  var FB = window.PracticeFeedback;
  var el = C.el;
  var PATH_KEY = '_scenePath';

  /* ---------- constants: world + brand ---------- */

  var ROOM_W = 11, ROOM_D = 9, WALL_H = 3.4, SPACING = 16, CORRIDOR_W = 3.4;
  var EYE = 1.6;
  var COL = {
    navyDeep: 0x071826, navy: 0x0C2233, charcoal: 0x1F2C36,
    teal: 0x0097A7, tealDeep: 0x007681, tealBright: 0x2FC3D4,
    mist: 0xF5F7F8, red: 0xEE3124, slate: 0x3A4555
  };
  // the shared tag palette (styles.css --w-ready / --w-light / --w-revise)
  var TAG_HEX = { Ready: 0x2E8B57, Light: 0xD9880F, Revise: 0xC13B3B };
  var TAG_CSS = { Ready: '#2E8B57', Light: '#D9880F', Revise: '#C13B3B' };
  var FONTS = 'Assistant, Roboto, -apple-system, sans-serif';

  var reducedMotion = false;
  try {
    reducedMotion = window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { /* default: motion on */ }

  /* ---------- station theming: all seven M1 scenes ---------- */
  var ROOM_THEMES = {
    s1_capability: 'vendor_stage',   // the demo that promises everything
    s1b_rescope: 'rescope',          // detour: the rescope meeting
    s2_data: 'data_archive',         // the data nobody labeled
    s3_build_buy: 'crossroads',      // the build-vs-buy crossroads
    s3b_sunk_cost: 'sunk_cost',      // detour: the sunk-cost meeting
    s4_failure: 'failure',           // the day it breaks (alarm-lit)
    s5_metric: 'metric'              // prove it worked
  };
  // a scene is a detour when its authored kicker says so (spec-driven)
  function isDetourScene(scene) { return /detour/i.test((scene && scene.kicker) || ''); }

  /* ---------- spec helpers (same semantics as the 2D game) ---------- */

  function scenesOf(activity) { return FB.collectScenes(activity); }
  function sceneById(activity, id) {
    return scenesOf(activity).filter(function (s) { return s.id === id; })[0] || null;
  }
  function nextSceneId(activity, scene, option) {
    if (option && option.goto !== undefined) return option.goto;
    var all = scenesOf(activity);
    var idx = all.indexOf(scene);
    return idx >= 0 && idx + 1 < all.length ? all[idx + 1].id : null;
  }
  function optionById(scene, id) {
    return (scene.decision.options || []).filter(function (o) { return o.id === id; })[0] || null;
  }

  /* ---------- canvas text helpers (all in-world text is generated) ---------- */

  function wrapLines(ctx, text, maxWidth) {
    var words = String(text || '').split(/\s+/), lines = [], line = '';
    words.forEach(function (w) {
      var probe = line ? line + ' ' + w : w;
      if (ctx.measureText(probe).width > maxWidth && line) { lines.push(line); line = w; }
      else line = probe;
    });
    if (line) lines.push(line);
    return lines;
  }

  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // A texture whose draw() can rerun (fonts.ready redraw, consequence update).
  var CANVAS_ANISO = 4; // raised to the renderer max once a renderer exists
  function canvasTexture(w, h, draw) {
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var texture = new THREE.CanvasTexture(canvas);
    texture.anisotropy = CANVAS_ANISO;
    var entry = {
      canvas: canvas, texture: texture,
      redraw: function () { draw(canvas.getContext('2d'), canvas); texture.needsUpdate = true; }
    };
    entry.redraw();
    return entry;
  }

  /* ---------- rounded box: premium silhouettes on the key shapes ----------
     Spherified box: subdivided BoxGeometry whose vertices are pulled onto
     the rounded hull (clamp to the inner box, push out along the corner
     normal). Analytic normals, so edges shade smooth. Used on the hero
     shapes only (cards, pedestals, frames, columns, robot); background
     geometry stays low-poly. */
  function roundedBoxGeometry(w, h, d, radius, seg) {
    seg = seg || 3;
    radius = Math.min(radius, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001);
    var g = new THREE.BoxGeometry(w, h, d, seg, seg, seg);
    var pos = g.attributes.position, nrm = g.attributes.normal;
    var hw = w / 2 - radius, hh = h / 2 - radius, hd = d / 2 - radius;
    var v = new THREE.Vector3();
    for (var i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      var cx = Math.max(-hw, Math.min(hw, v.x));
      var cy = Math.max(-hh, Math.min(hh, v.y));
      var cz2 = Math.max(-hd, Math.min(hd, v.z));
      v.x -= cx; v.y -= cy; v.z -= cz2;
      var len = v.length();
      if (len > 1e-6) v.divideScalar(len); else v.set(0, 1, 0);
      pos.setXYZ(i, cx + v.x * radius, cy + v.y * radius, cz2 + v.z * radius);
      nrm.setXYZ(i, v.x, v.y, v.z);
    }
    return g;
  }

  /* ---------- one shared registry so fonts.ready can retexture ---------- */

  var TEXTURE_ENTRIES = [];
  function trackTexture(entry) { TEXTURE_ENTRIES.push(entry); return entry; }
  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    document.fonts.ready.then(function () {
      TEXTURE_ENTRIES.forEach(function (t) { t.redraw(); });
    });
  }

  /* ---------- the format ---------- */

  function renderGame3D(rootNode, activity, checks, state) {
    injectCSS();
    document.body.classList.add('game-active');
    if (!Array.isArray(state.answers[PATH_KEY])) state.answers[PATH_KEY] = [];

    var stage = el('div', 'g3d-stage');
    rootNode.appendChild(stage);
    rootNode.appendChild(el('div', 'g3d-vignette')); // cheap cinematic vignette, zero GPU
    var fadeVeil = el('div', 'g3d-fade');
    rootNode.appendChild(fadeVeil);
    // a soft dip to dark as one station hands over to the next
    function fadeBeat() {
      if (reducedMotion) return;
      fadeVeil.style.opacity = '0.55';
      window.setTimeout(function () { fadeVeil.style.opacity = '0'; }, 430);
    }

    /* ----- graceful fallback: WebGL is optional, the content never is ----- */
    function showFallback(reason) {
      stage.textContent = '';
      var scr = el('div', 'g3d-screen');
      var frame = el('div', 'g3d-screen-frame');
      frame.appendChild(C.svgEl(C.SVG.logo, 'g3d-logo'));
      frame.appendChild(el('h1', 'g3d-title', activity.meta.title));
      frame.appendChild(el('p', 'g3d-lede',
        'This 3D version needs WebGL, which is not available here.'));
      frame.appendChild(el('p', 'g3d-fallback-note',
        'Nothing is lost: the 2D decision game build of this activity covers the '
        + 'same scenario, the same choices, and the same coach. Ask your instructor '
        + 'for the standard version, or open this page on a device with 3D graphics.'));
      if (reason) frame.appendChild(el('p', 'g3d-fallback-note', String(reason)));
      scr.appendChild(frame);
      stage.appendChild(scr);
    }

    var renderer, scene3, camera;
    try {
      if (!window.THREE) throw new Error('Three.js is not bundled in this build.');
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); // cap: crisp, never wasteful
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      renderer.physicallyCorrectLights = true;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      stage.appendChild(renderer.domElement);
    } catch (err) {
      showFallback(err && err.message);
      return;
    }
    renderer.domElement.addEventListener('webglcontextlost', function (e) {
      e.preventDefault();
      showFallback('The graphics context was lost.');
    });

    scene3 = new THREE.Scene();
    scene3.background = new THREE.Color(COL.navyDeep);
    scene3.fog = new THREE.Fog(COL.navyDeep, 16, 52);
    camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 80);

    /* ----- procedural environment map: real reflections, zero assets -----
       A tiny "light studio" scene (gradient sky dome + emissive softbox
       panels in the brand colors) run through PMREMGenerator once at init.
       Metals, the glossy robot shell, and the floor pick it up via
       scene.environment. */
    function buildEnvironment() {
      var env = new THREE.Scene();
      // gradient sky dome: vertex-colored sphere, navy floor to teal horizon glow
      var dome = new THREE.SphereGeometry(20, 24, 16);
      var pos = dome.attributes.position;
      var colors = new Float32Array(pos.count * 3);
      var top = new THREE.Color(0x0A2740), horizon = new THREE.Color(0x0F4B58),
        ground = new THREE.Color(0x050F18), c = new THREE.Color();
      for (var i = 0; i < pos.count; i++) {
        var y = pos.getY(i) / 20;
        if (y >= 0) c.copy(horizon).lerp(top, Math.pow(y, 0.7));
        else c.copy(horizon).lerp(ground, Math.pow(-y, 0.5));
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
      }
      dome.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      env.add(new THREE.Mesh(dome, new THREE.MeshBasicMaterial({
        vertexColors: true, side: THREE.BackSide })));
      // softbox panels: a big warm key overhead, a cool teal wall, a red sliver
      function panel(w, h, hex, intensity, x, y, z, ry, rx) {
        var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
          new THREE.MeshBasicMaterial({ color: hex }));
        m.material.color.multiplyScalar(intensity);
        m.position.set(x, y, z);
        if (ry) m.rotation.y = ry;
        if (rx) m.rotation.x = rx;
        env.add(m);
      }
      panel(8, 5, 0xFFF2E0, 5.0, 0, 9, 0, 0, Math.PI / 2);   // warm ceiling key
      panel(10, 4, 0x2FC3D4, 2.2, -9, 3, 0, Math.PI / 2, 0); // teal side wash
      panel(2.5, 5, 0xEE3124, 1.6, 9, 2.5, -2, -Math.PI / 2, 0); // red accent sliver
      panel(9, 3, 0x9FD6DC, 0.8, 0, 1, -9, 0, 0);            // cool back bounce
      var pmrem = new THREE.PMREMGenerator(renderer);
      var envRT = pmrem.fromScene(env, 0.04);
      pmrem.dispose();
      env.traverse(function (n) {
        if (n.geometry) n.geometry.dispose();
        if (n.material) n.material.dispose();
      });
      return envRT;
    }
    var envRT = buildEnvironment();
    scene3.environment = envRT.texture;

    /* ----- three-point light rig (physically-correct units) ----- */
    scene3.add(new THREE.HemisphereLight(0x9FD6DC, 0x0C2233, 0.42));
    // KEY: warm, from high front-right, carries the soft shadows and
    // follows the player so its shadow frustum stays tight and crisp
    var keyLight = new THREE.DirectionalLight(0xFFF2E2, 2.6);
    keyLight.position.set(5, 9, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.bias = -0.0004;
    keyLight.shadow.normalBias = 0.025;
    keyLight.shadow.camera.left = -10; keyLight.shadow.camera.right = 10;
    keyLight.shadow.camera.top = 10; keyLight.shadow.camera.bottom = -10;
    keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 34;
    scene3.add(keyLight);
    scene3.add(keyLight.target);
    // FILL: cool teal, low from the left, lifts the shadow side gently
    var fillLight = new THREE.DirectionalLight(0x2FC3D4, 0.5);
    fillLight.position.set(-7, 3.5, 2);
    scene3.add(fillLight);
    // RIM: cold blue from behind-above, separates silhouettes from the walls
    var rimLight = new THREE.DirectionalLight(0xBFE9F2, 1.1);
    rimLight.position.set(0, 6, -9);
    scene3.add(rimLight);

    /* ----- first-party post pipeline: bright-pass bloom -----
       No vendored postprocessing: a small RT chain written here. Scene renders
       tone-mapped into an sRGB target (multisampled on WebGL2, so AA is kept),
       the bright pass keys on the emissive brand accents, a separable gaussian
       blurs at quarter res, and the composite adds the glow back. `pulse()`
       kicks the strength briefly — the consequence-reveal pop. The quality
       tier decides whether any of this runs; off means plain direct render. */
    var POST = (function () {
      var on = false, ready = false;
      var strength = 0.7, pulseAmt = 0;
      var rtScene, rtA, rtB, quadScene, quadCam, quadMesh, brightMat, blurMat, compMat;
      var VERT = 'varying vec2 vUv;\nvoid main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
      function build() {
        if (ready) return;
        var size = new THREE.Vector2();
        renderer.getDrawingBufferSize(size);
        var pars = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true };
        rtScene = renderer.capabilities.isWebGL2
          ? new THREE.WebGLMultisampleRenderTarget(size.x, size.y, pars)
          : new THREE.WebGLRenderTarget(size.x, size.y, pars);
        rtScene.texture.encoding = THREE.sRGBEncoding;
        var q = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false };
        rtA = new THREE.WebGLRenderTarget(size.x >> 2, size.y >> 2, q);
        rtB = new THREE.WebGLRenderTarget(size.x >> 2, size.y >> 2, q);
        quadScene = new THREE.Scene();
        quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        brightMat = new THREE.ShaderMaterial({
          uniforms: { tex: { value: null }, threshold: { value: 0.52 } },
          vertexShader: VERT,
          // brightness alone would bloom every white card and the robot shell
          // into haze; gating on saturation keys the glow to the COLORED
          // emissives only — the teal/red brand accents
          fragmentShader: 'uniform sampler2D tex; uniform float threshold; varying vec2 vUv;\n'
            + 'void main(){ vec4 c = texture2D(tex, vUv);\n'
            + '  float l = dot(c.rgb, vec3(0.299, 0.587, 0.114));\n'
            + '  float mx = max(c.r, max(c.g, c.b));\n'
            + '  float mn = min(c.r, min(c.g, c.b));\n'
            + '  float sat = (mx - mn) / max(mx, 0.001);\n'
            + '  float f = smoothstep(threshold, threshold + 0.25, l) * smoothstep(0.3, 0.55, sat);\n'
            + '  gl_FragColor = vec4(c.rgb * f, 1.0); }',
          depthTest: false, depthWrite: false
        });
        blurMat = new THREE.ShaderMaterial({
          uniforms: { tex: { value: null }, dir: { value: new THREE.Vector2(1, 0) },
            texel: { value: new THREE.Vector2(1 / (size.x >> 2), 1 / (size.y >> 2)) } },
          vertexShader: VERT,
          fragmentShader: 'uniform sampler2D tex; uniform vec2 dir; uniform vec2 texel; varying vec2 vUv;\n'
            + 'void main(){\n'
            + '  float w0 = 0.227027; float w1 = 0.1945946; float w2 = 0.1216216; float w3 = 0.054054; float w4 = 0.016216;\n'
            + '  vec2 off = dir * texel;\n'
            + '  vec3 s = texture2D(tex, vUv).rgb * w0;\n'
            + '  s += (texture2D(tex, vUv + off * 1.4).rgb + texture2D(tex, vUv - off * 1.4).rgb) * w1;\n'
            + '  s += (texture2D(tex, vUv + off * 3.2).rgb + texture2D(tex, vUv - off * 3.2).rgb) * w2;\n'
            + '  s += (texture2D(tex, vUv + off * 5.0).rgb + texture2D(tex, vUv - off * 5.0).rgb) * w3;\n'
            + '  s += (texture2D(tex, vUv + off * 6.8).rgb + texture2D(tex, vUv - off * 6.8).rgb) * w4;\n'
            + '  gl_FragColor = vec4(s, 1.0); }',
          depthTest: false, depthWrite: false
        });
        compMat = new THREE.ShaderMaterial({
          uniforms: { base: { value: null }, bloom: { value: null }, strength: { value: strength } },
          vertexShader: VERT,
          fragmentShader: 'uniform sampler2D base; uniform sampler2D bloom; uniform float strength; varying vec2 vUv;\n'
            + 'void main(){ vec3 c = texture2D(base, vUv).rgb + texture2D(bloom, vUv).rgb * strength;\n'
            + '  gl_FragColor = vec4(c, 1.0); }',
          depthTest: false, depthWrite: false

        quadMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compMat);
        quadMesh.frustumCulled = false;
        quadScene.add(quadMesh);
        ready = true;
      }
      function resize() {
        if (!ready) return;
        var size = new THREE.Vector2();
        renderer.getDrawingBufferSize(size);
        rtScene.setSize(size.x, size.y);
        rtA.setSize(Math.max(1, size.x >> 2), Math.max(1, size.y >> 2));
        rtB.setSize(Math.max(1, size.x >> 2), Math.max(1, size.y >> 2));
        blurMat.uniforms.texel.value.set(1 / Math.max(1, size.x >> 2), 1 / Math.max(1, size.y >> 2));

        renderer.setRenderTarget(rtScene);
        renderer.render(scene3, camera);
        quadMesh.material = brightMat;
        brightMat.uniforms.tex.value = rtScene.texture;
        renderer.setRenderTarget(rtA);
        renderer.render(quadScene, quadCam);
        quadMesh.material = blurMat;
        blurMat.uniforms.tex.value = rtA.texture;
        blurMat.uniforms.dir.value.set(1, 0);
        renderer.setRenderTarget(rtB);
        renderer.render(quadScene, quadCam);
        blurMat.uniforms.tex.value = rtB.texture;
        blurMat.uniforms.dir.value.set(0, 1);
        renderer.setRenderTarget(rtA);
        renderer.render(quadScene, quadCam);
        quadMesh.material = compMat;
        compMat.uniforms.base.value = rtScene.texture;
        compMat.uniforms.bloom.value = rtA.texture;
        compMat.uniforms.strength.value = strength * (1 + pulseAmt * 1.7);
        renderer.setRenderTarget(null);
        renderer.render(quadScene, quadCam);
      }
      function update(dt) {
        if (pulseAmt > 0.001) pulseAmt = Math.max(0, pulseAmt - dt * 1.4);
      }
      function dispose() {
        if (!ready) return;
        [rtScene, rtA, rtB].forEach(function (rt) { rt.dispose(); });
        [brightMat, blurMat, compMat].forEach(function (m) { m.dispose(); });

        ready = false;

        render: render, update: update, resize: resize, dispose: dispose,
        pulse: function () { if (on) pulseAmt = 1; },
        active: function () { return pulseAmt > 0.001; },
        setEnabled: function (v) { on = !!v; if (v) build(); },
        enabled: function () { return on; }
      };
    })();
    /* ----- adaptive quality: High / Medium / Low -----
       Picked automatically from a short FPS sample behind the title screen
       (or forced by the HUD toggle / prefers-reduced-motion, which always
       gets the calm Low tier). Each tier scales render resolution, shadow
       map size, bloom, and mural texture resolution — weak laptops get
       smooth AND readable instead of pretty-but-choppy. */
    var TIERS = {
      high: { scale: 1.0, shadows: 2048, bloom: true, mural: 2048, idleFps: 15 },
      medium: { scale: 0.78, shadows: 1024, bloom: true, mural: 2048, idleFps: 12 },
      low: { scale: 0.6, shadows: 0, bloom: false, mural: 1024, idleFps: 8 }
    };

        roughness: 1, metalness: 0.05, envMapIntensity: 0.9
      });
    }
    var muralRes = 2048; // the quality tier rebuilds at 1024 on Low
    MAT.mural = makeMural(muralRes);

    /* ----- the seven station themes -----
       Each scene of the M1 walkthrough gets a matching identity: an accent
       color for columns/rings/guides, a light tint, a mural icon set + accent
       block color, and prop dressing in dressRoom(). Same systems, new
       parameters — nothing here invents content, it stages the spec's scenes. */
    var THEMES = {
      vendor_stage: { accent: 0x0097A7, glow: 0x2FC3D4, light: 0xEAF6F8, seed: 11,
        accentCss: '#EE3124', icons: ['screen', 'wifi', 'bulb', 'robotHead', 'spark'] },
      rescope: { accent: 0x3E7EA0, glow: 0x9FD6DC, light: 0xDCEBF4, seed: 23,
        accentCss: '#3E7EA0', icons: ['clock', 'loop', 'graph', 'screen'] },
      data_archive: { accent: 0x007681, glow: 0x2FC3D4, light: 0xE0F1EF, seed: 37,
        accentCss: '#007681', icons: ['database', 'docstack', 'shield', 'chip'] },
      crossroads: { accent: 0x0097A7, glow: 0x2FC3D4, light: 0xEAF6F8, seed: 41,
        accentCss: '#EE3124', icons: ['split', 'flag', 'gear', 'coins'] },
      sunk_cost: { accent: 0xB97814, glow: 0xE8A33D, light: 0xF0E3CC, seed: 53,
        accentCss: '#B97814', icons: ['coins', 'clock', 'gauge', 'graph'] },
      failure: { accent: 0xC13B3B, glow: 0xFF6A55, light: 0xF3DCD3, seed: 67,
        accentCss: '#EE3124', icons: ['bell', 'alert', 'shield', 'gauge'] },
      metric: { accent: 0x2E8B57, glow: 0x53C98A, light: 0xE0F2E7, seed: 79,
        accentCss: '#2E8B57', icons: ['target', 'graph', 'gauge', 'flag'] },
      recap: { accent: 0x0097A7, glow: 0x2FC3D4, light: 0xEAF6F8, seed: 97,
        accentCss: '#EE3124', icons: ['flag', 'target', 'spark', 'graph'] }
    };
    function muralCfg(name) {
      var th = THEMES[name];
      return th ? { seed: th.seed, icons: th.icons, accentCss: th.accentCss } : null;
    }
    // per-theme murals at half the main res, cached; the maps are swapped in
    // place on tier change so every already-built room updates too
    var MURAL_CACHE = {};
    function themeMuralMaterial(name) {
      if (!THEMES[name]) return MAT.mural;
      if (!MURAL_CACHE[name]) MURAL_CACHE[name] = makeMural(muralRes >> 1, muralCfg(name));
      return MURAL_CACHE[name];
    }
    // per-theme accent materials (columns, rings, guide lights), cached
    var ACCENT_CACHE = {};
    function themeAccent(name) {
      var th = THEMES[name] || { accent: COL.tealDeep, glow: COL.tealBright };
      if (!ACCENT_CACHE[name]) {
        ACCENT_CACHE[name] = {
          solid: mat(th.accent, { roughness: 0.34, metalness: 0.3, envMapIntensity: 1.2 }),
          glow: glow(th.glow, 1.5, { transparent: true, opacity: 0.85 }),
          glowStrong: glow(th.glow, 2.4)
        };
