<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PL1 before / after</title>
<link rel="icon" href="data:,">
<style>
  /* dev-only page (not loaded by the lesson, not in the SCORM package): the original lesson (port 8125)
     and this polished copy side by side on one screen, with what to try on it */
  :root { --ink: #16293A; --muted: #55626C; --line: #E2DED6; --navy: #255777; --bg: #F7F5F1; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 Arial, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fff; }
  h1 { margin: 0; font-size: 18px; }
  select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .try { flex: 1 1 420px; margin: 0; color: var(--muted); }
  .try b { color: var(--ink); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; direction: ltr; }
  figure { margin: 0; }
  figcaption { margin-bottom: 6px; font-weight: 700; }
  figcaption span { font-weight: 400; color: var(--muted); }
  @media (max-width: 1500px) { main { grid-template-columns: 1fr; } }
  iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
</style>
</head>
<body>
<header>
  <h1>לפני / אחרי</h1>
  <select id="pick" aria-label="מסך"></select>
  <p class="try" id="try"></p>
</header>
<main>
  <figure><figcaption>Original <span>eai-m1l4-selfstudy</span></figcaption><iframe id="a" title="Original"></iframe></figure>
  <figure><figcaption>Polished <span>eai-m1l4-selfstudy-polish</span></figcaption><iframe id="b" title="Polished"></iframe></figure>
</main>
<script>
  const SCREENS = [
    ['S04', 'גרירה', '<b>גררי כרטיס לעמודה.</b> מימין: הכרטיס מתרומם בזמן הגרירה, נוחת בעמודה בתנועה רכה, והכרטיס הבא עולה מהחבילה. משמאל: הכול קופץ.'],
    ['S01', 'לחיצה על תשובה', '<b>לחצי והחזיקי את העכבר על תשובה.</b> מימין הכרטיס נלחץ פנימה מעט. אחר כך עברי עם העכבר בין התשובות: המסגרת מתחלפת בהדרגה.'],
    ['S04', 'תפריט הפרקים', '<b>לחצי על ☰ למעלה משמאל.</b> מימין התפריט מחליק מהצד והרקע מתכהה בהדרגה. משמאל הוא מופיע בבת אחת. בתוכו לחצי Help: חלון הדיאלוג צומח במרכז.'],
    ['O3', 'טולטיפים', '<b>עברי עם העכבר על אריחי המטרות.</b> מימין הטולטיפ צץ מהאריח; מעבר מהיר לאריח הבא מציג אותו מיד.'],
    ['S18B', 'שדה הכותרת', '<b>כתבי כותרת ארוכה (עד 60 תווים).</b> מימין השדה רחב ומציג את כל הכותרת; משמאל היא נחתכת אחרי כ־37 תווים.'],
    ['S05a', 'הסמנים על ה־BPMN', '<b>טעני מחדש את המסך (בחרי אותו שוב).</b> הסמנים 1–3 צצים מ־90% ולא מ־60%: עדין יותר, בלי "קפיצה".'],
  ];
  const pick = document.getElementById('pick'), tryEl = document.getElementById('try');
  SCREENS.forEach(([id, label], i) => pick.add(new Option(`${id} · ${label}`, i)));
  const host = location.hostname;
  function show() {
    const [id, , text] = SCREENS[pick.value];
    const q = `/index.html?review=1&live=0&screen=${id}&t=${Date.now()}`;
    document.getElementById('a').src = `http://${host}:8125${q}`;
    document.getElementById('b').src = `http://${host}:8126${q}`;
    tryEl.innerHTML = text;
  }
  pick.addEventListener('change', show);
  show();
</script>
</body>
</html>
