# Grounding pack — AICY60 T0: Intro to AI & Cybersecurity → Media Literacy practice

> Material the coach reasons FROM. Distilled from Wawiwa's own T0 deck
> (`AICY.T0.P1 - Intro to AI & Cybersecurity`, 45 slides) and the SME practice
> `AICY.T0.E1 - Media Literacy`. The coach answers primarily from this pack, coaches against the
> rubric, cites the numbered concepts below, and says "that's outside this practice" when off-topic.
> It never fabricates detection "certainty"; media detection is probabilistic, so it coaches habits,
> not verdicts.

## Where this practice sits
Topic T0 is the course intro: foundations of cybersecurity, the CIA triad, what AI/ML are, how AI is
used for and against security, and ethics (IG objective: "Introduce students to basic concepts in AI
and Cybersecurity"; practice: "practice media literacy and exercise ways to detect AI-made media";
5h, 3 theory / 2 practical). The Media Literacy lab is a **detection** exercise: students test
themselves against AI-generated media using online tools and reflect on the cues.

## Concept map (what the coach can cite — all from the T0 deck)
- **C1 · Cybersecurity foundations.** Cybersecurity = protecting networks, devices, software and data
  from unauthorized access or attack (S3). Vulnerability / Threat / Risk (S7). Defense in depth (S12).
- **C2 · The CIA triad.** Confidentiality, Integrity, Availability (S9-11) — the benchmark for whether
  a system is secure (S8).
- **C3 · Social engineering (the human attack surface).** Manipulating people into handing over access;
  "human psychology is often easier to exploit than technical code" — people are a primary attack vector
  (S13). Media literacy is a personal defense against this.
- **C4 · What AI and ML are.** AI = systems doing tasks that need human intelligence (S15). ML learns
  patterns from data (S19, S22); supervised / unsupervised / reinforcement (S23-25); deep learning &
  neural networks (S20); generative AI / LLMs predict the next token to produce coherent language (S26).
- **C5 · How AI is weaponized against people (why this practice matters).** Generative AI produces
  hyper-realistic phishing and **convincing deepfake voice/video**, enabling customized social
  engineering at scale (S38). Deepfakes and synthetic faces/voices are cheap — so "it looks/sounds real"
  is no longer proof it is real.
- **C6 · Detection cues & verification habits (the defensive core of THIS practice).** No single tell is
  proof, but useful signals: faces — asymmetric or melting details around eyes, teeth, ears, hair,
  jewelry, background warping; video — unnatural blinking, lip-sync drift, lighting/edge artifacts;
  AI art — impossible geometry, garbled text, too-perfect texture; chat/text — evasive or generic
  answers, no genuine memory, oddly fluent hedging. The reliable habit: **treat unverified media as
  unverified** — corroborate against a trusted source and confirm identity out of band before acting.

## The practice tasks (verbatim intent from the SME doc)
Individual assignment. "Evaluate their ability to detect AI-generated media — including deepfakes,
realistic faces, videos, artwork, and chat interactions — by testing their skills across various online
identification tools." Tasks (each: try the tool, record how you did, note the cues):
1. Deepfake detection test — detectfakes.kellogg.northwestern.edu ("see how many you can detect").
2. Real vs. fake faces — whichfaceisreal.com.
3. AI-or-not video — sightengine.com/ai-or-not-video.
4. AI-or-human art — quillbot.com/blog/human-or-ai-game.
5. Human-or-not chat — humanornot.so ("see if you can detect if you're talking to humans or AI").
Answer column in the SME doc: "To be solved by the students" (open reflection — no fixed key).

## Coaching stance
The student is TESTING and REFLECTING, not building anything. The coach: affirms the attempt, asks
them to name the **specific cue** that gave a fake away (or fooled them), connects it to the concept
(deepfakes/synthetic media, C5; social engineering, C3), and reinforces the **verification habit** (C6):
no single tool is proof; corroborate and confirm out of band. It never claims a piece of media is
definitely real/fake, and it does not help create deceptive media. Out-of-scope (e.g. "make me a
deepfake"): decline, restate the detection/defense purpose, redirect to cues and verification.

  }
  function outcomeFor(when){
    return ACTIVITY.outcome_logic.filter(function(o){ return o.when === when; })[0] || null;
  }
  /* the quality rules and the canned refusal ride with every call */
  function buildSystem(){
    return PROMPTS.system
      + '\n\nQuality rules for this practice:\n'
      + ACTIVITY.quality_rules.map(function(r){ return '- ' + r; }).join('\n')
      + '\n\nIf the input breaches that scope, reply with exactly this and nothing else:\n"'
      + PROMPTS.refusal + '"';
  }

  /* ------------------------------------------------------------------
   * Live coach, wired to the Practice Studio anonymizing proxy exactly
   * like engine/live.js. Enabled for AICY60 on Dor's explicit decision
   * (2026-08-05); the DPA position for this program is his to own.
   * Student text is PII-scrubbed client-side before it is sent, the
   * Worker scrubs again server-side, and a per-session token cap
   * applies. Every failure path falls back to the offline coach, so the
   * activity never blocks a student. Over file:// there is no network,
   * which is why local testing always shows the offline coach.
   * ---------------------------------------------------------------- */
  var LIVE = {
    enabled: true,
    proxy_url: 'https://practice-studio-proxy.dory-08e.workers.dev',
    session_token_cap: 25000,
    model: null,
    prompts: {
      system: PROMPTS.system,
      /* grounding_pack.md, inlined verbatim above */
      grounding: (document.getElementById('grounding-pack') || {}).textContent || ''
    }
  };

  /* Measured live latency on this proxy runs to roughly 20s, so a 20s
     abort was killing good answers. 35s, matching T1. */
  var CALL_TIMEOUT_MS = 35000;
  var usedTokens = 0;

  /* PII scrub, same pattern list as engine/redact.js. Unredacted text
     never leaves the browser. */
  var REDACT = [
    { re:/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, sub:'[email removed]' },
    { re:/\+?\d(?:[\s().\-]?\d){8,}/g, sub:'[number removed]' },
    { re:/\d{9,}/g, sub:'[number removed]' },
    { re:/\b(?=[A-Za-z0-9_\-]{20,}(\b|$))(?=[^\s]*\d)(?=[^\s]*[A-Za-z])[A-Za-z0-9_\-]{20,}\b/g,
      sub:'[token removed]' }
  ];
  function redact(text){
    var out = String(text || '');
    REDACT.forEach(function(p){ p.re.lastIndex = 0; out = out.replace(p.re, p.sub); });
    return out;
  }

  function liveAvailable(){
    return !!(LIVE.enabled && LIVE.proxy_url && usedTokens < LIVE.session_token_cap);
  }

  function callProxy(kind, call){
    if (!liveAvailable()) return Promise.reject(new Error('live_off'));
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = controller && setTimeout(function(){ controller.abort(); }, CALL_TIMEOUT_MS);
    var payload = {
      kind: kind,
      system: buildSystem(),
      grounding: LIVE.prompts.grounding,
      call: call,
      session: { used_tokens: usedTokens }
    };
    if (LIVE.model) payload.model = LIVE.model;
    return fetch(LIVE.proxy_url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      signal: controller ? controller.signal : undefined,
      body: JSON.stringify(payload)
    }).then(function(resp){
      if (timer) clearTimeout(timer);
      return resp.json().then(function(data){
        if (!resp.ok || !data.ok) throw new Error('proxy_error');
        var u = data.usage || {};
        usedTokens += (u.input_tokens || 0) + (u.output_tokens || 0);
        return data.text || '';
      });
    }).catch(function(err){
      if (timer) clearTimeout(timer);
      throw err;
    });
  }

  /* ------------------------------------------------------------------
   * Offline coach. Deterministic guard, grounded on this practice:
   * name the media, then name the tell, then tie it to phishing.
   * ---------------------------------------------------------------- */
  var MEDIA = /(video|deep\s?fake|deepfake|face|photo|image|picture|portrait|art|artwork|painting|drawing|chat|conversation|bot|voice|audio|clip)/i;
  var TELL  = /(eye|pupil|hand|finger|teeth|tooth|ear|earring|hair|jaw|neck|skin|background|light|shadow|shade|texture|blur|edge|sync|lip|mouth|symmetr|reflection|jewel|glasses|watermark|artifact|glitch|frame|grammar|typo|spell|tone|speed|fast|slow|delay|repeat|repetit|pattern|perspective|proportion|sign|text|smooth|uniform|generic|emoji|punctuation|detail|accent|breath|blink)/i;
  var FILLER = /^(idk|dunno|none|nothing|nope|n\/?a|na|no|yes|ok|okay|good|bad|fine|easy|hard|fun|cool|nice|all|some|maybe|dont know|don't know|[\s\-\.\?]*)$/i;

  var REPLIES = {
    empty: { tone:'work', lead:'Nothing to work with yet',
      text:'Write two or three sentences: which of the five caught you out, and the detail that gave it away.' },
    thin: { tone:'work', lead:'Too thin to grade',
      text:'Name the media that fooled you, then the one detail you noticed. A tell you can point at is a tell you can reuse.' },
    media: { tone:'work', lead:'Say which one',
      text:'Was it the deepfake video, the faces, the AI clip, the art, or the chat? The giveaway is different for each of the five.' },
    tell: { tone:'work', lead:'Now name the tell',
      text:'Point at the exact detail: the lip sync, the hairline, the hands, the lighting, the reply speed. "It just looked off" will not help you next time.' },
    good: { tone:'ok', lead:'That one transfers',
      text:'A deepfake voice or video phishing attempt fails on the same detail. Trust that instinct when a face on a call is pushing you to act fast.' }
  };

  function judge(raw){
    var text = String(raw || '').trim();
    if (!text) return REPLIES.empty;
    var words = text.split(/\s+/).filter(Boolean);
    if (FILLER.test(text) || words.length < 4 || text.length < 14) return REPLIES.thin;
    if (!MEDIA.test(text)) return REPLIES.media;
    if (!TELL.test(text)) return REPLIES.tell;
    return REPLIES.good;
  }

  /* ------------------------------------------------------------------ */

  var ICON_OK   = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 13 5 5L20 6"/></svg>';
  var ICON_WORK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>';
  var ICON_EYE  = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>';
  var ICON_TICK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>';

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  var reply = document.getElementById('reply');
  var tell = document.getElementById('tell');
  var checkBtn = document.getElementById('check');

  function show(r){
    reply.hidden = false;
    reply.setAttribute('data-tone', r.tone);
    reply.innerHTML = (r.tone === 'ok' ? ICON_OK : ICON_WORK)
      + '<p><span class="lead">' + esc(r.lead) + '</span>' + esc(r.text) + '</p>';
  }

  /* The live coach writes its own prose, so apply the same house rule the
     deck pipeline applies: no em dashes, no arrow shorthand. */
  function houseStyle(text){
    return String(text || '')
      .replace(/\s*—\s*/g, ', ')
      .replace(/\s*(?:→|←|⇒)\s*/g, ', ');
  }

  function showLive(text){
    reply.hidden = false;
    reply.setAttribute('data-tone','ok');
    reply.innerHTML = ICON_OK + '<p>' + esc(houseStyle(text)) + '</p>';
  }

  checkBtn.addEventListener('click', function(){
    var answer = tell.value;
    if (!liveAvailable()){ show(judge(answer)); return; }
    checkBtn.disabled = true;
    var was = checkBtn.textContent;
    checkBtn.textContent = 'Checking…';
    /* The question on the page is the short form of the pack's debrief
       prompt; the rubric it is graded against is the pack's. */
    var call = fill(PROMPTS.debrief, {
      question: 'Which fooled you, and what gave it away?',
      rubric: rubricNames(ACTIVITY.debrief.rubric_refs),
      answer: redact(answer)
    });
    callProxy('debrief', call).then(function(text){
      if (text && text.trim()) showLive(text.trim()); else show(judge(answer));
    }).catch(function(){
      show(judge(answer));
    }).then(function(){
      checkBtn.disabled = false;
      checkBtn.textContent = was;
    });
  });

  /* ------------------------------------------------------------------
   * Personal path. Five toggles, one per challenge already on the page
   * above; each one carries the media type the pack's outcome_logic
   * keys on, so a "Fooled me" returns that entry: the takeaway, the
   * concept to review, and the reading. Nothing here is hand-written.
   * ---------------------------------------------------------------- */
  var CHALLENGES = [
    { id:'c1', name:'Deepfake video test', key:'video' },
    { id:'c2', name:'Real vs AI faces',    key:'faces' },
    { id:'c3', name:'AI video',            key:'video' },
    { id:'c4', name:'AI art',              key:'art'   },
    { id:'c5', name:'Human vs AI chat',    key:'chat'  }
  ];

  var BRIDGE = outcomeFor('bridge') || { focus:'' };

  var state = {};
  var checks = document.getElementById('checks');
  var pathout = document.getElementById('pathout');
  var pathSec = document.getElementById('path-sec');

  if (META.context === 'class'){
    pathSec.parentNode.removeChild(pathSec);
  } else {
    CHALLENGES.forEach(function(c, i){
      var li = document.createElement('li');
      li.innerHTML =
        '<span class="num" aria-hidden="true">' + (i + 1) + '</span>'
        + '<span class="cname" id="lbl-' + c.id + '">' + esc(c.name) + '</span>'
        + '<span class="seg" role="group" aria-labelledby="lbl-' + c.id + '">'
        +   '<button type="button" aria-pressed="false" data-c="' + c.id + '" data-v="spotted">'
        +     ICON_TICK + 'Spotted it</button>'
        +   '<button type="button" aria-pressed="false" data-c="' + c.id + '" data-v="fooled">'
        +     ICON_TICK + 'Fooled me</button>'
        + '</span>'
        + '<span class="pstate printonly" id="ps-' + c.id + '"></span>';
      checks.appendChild(li);
    });

    checks.addEventListener('click', function(ev){
      var btn = ev.target.closest ? ev.target.closest('button[data-c]') : null;
      if (!btn) return;
      var id = btn.getAttribute('data-c');
      var val = btn.getAttribute('data-v');
      state[id] = (state[id] === val) ? null : val;
      var group = btn.parentNode.querySelectorAll('button[data-c]');
      Array.prototype.forEach.call(group, function(b){
        b.setAttribute('aria-pressed', state[id] === b.getAttribute('data-v') ? 'true' : 'false');
      });
      var ps = document.getElementById('ps-' + id);
      if (ps) ps.textContent = state[id] === 'fooled' ? 'Fooled me'
        : (state[id] === 'spotted' ? 'Spotted it' : '');
      renderPath();
    });

    function renderPath(){
      var answered = CHALLENGES.filter(function(c){ return state[c.id]; });
      if (!answered.length){ pathout.innerHTML = ''; return; }
      var fooled = CHALLENGES.filter(function(c){ return state[c.id] === 'fooled'; });
      var html = '';
      if (fooled.length){
        /* one block per media type that fooled them, in the pack's order */
        var keys = [];
        fooled.forEach(function(c){
          if (keys.indexOf(c.key) === -1) keys.push(c.key);
        });
        var blocks = keys.map(function(k){
          var o = outcomeFor('fooled_by:' + k);
          if (!o) return '';
          var names = fooled.filter(function(c){ return c.key === k; })
            .map(function(c){ return c.name; }).join(' and ');
          var res = ACTIVITY.resources[o.resource];
          return '<li>' + ICON_EYE + '<span><b>' + esc(names) + '.</b> '
            + esc(houseStyle(o.focus))
            + (o.review ? '<span class="rev">Review: '
                + esc(conceptLabel(o.review)) + '</span>' : '')
            + (res && res.url ? '<a class="reslink" href="' + res.url
                + '" target="_blank" rel="noopener">' + esc(res.title)
                + ' (' + esc(res.source) + ')</a>' : '')
            + '</span></li>';
        }).join('');
        if (blocks) html += '<h3>Watch for</h3><ul class="tells">' + blocks + '</ul>';
      }
      html += '<p class="bridge">' + esc(houseStyle(BRIDGE.focus)) + '</p>';
      pathout.innerHTML = html;
    }
  }

  /* ------------------------------------------------------------------
   * No in-page print button: a Rise Embed block sandboxes print. The
   * print styles stay, so a learner who opens this page in its own tab
   * still gets a clean branded takeaway from the browser's own print.
   * Mirrors the answer into a print-only block, since browsers clip a
   * scrolled textarea when printing.
   * ---------------------------------------------------------------- */
  window.addEventListener('beforeprint', function(){
    document.getElementById('pv-tell').textContent = tell.value.trim();
  });
})();
</script>
</body>
</html>
