name: S1 AI Awareness build check

on:
  pull_request:
    paths:
      - 'genai-for-marketing/s1-ai-awareness/**'
  push:
    branches: [main]
    paths:
      - 'genai-for-marketing/s1-ai-awareness/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genai-for-marketing/s1-ai-awareness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: genai-for-marketing/s1-ai-awareness/package-lock.json
      - name: Install the test driver (puppeteer-core; uses the runner's Google Chrome)
        run: npm ci
      - name: Validate content and referenced files
        run: npm run check
      # P4.1: every screen, layer and state at desktop and phone size — no clipped or covered text,
      # the speaker control on every narrated screen, Prev/Next on every screen
      - name: Text fit, narration control and navigation
        run: npm run test:fit -- --narration --nav
